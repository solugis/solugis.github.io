<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="../icone-180.png">
<meta name="theme-color" content="#0a4a30">
<title>Adya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Polices chargées sans bloquer l'affichage : si Google tarde, la page s'affiche avec la police du téléphone. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" media="print" onload="this.media='all'">
<style>/* Mise en page : en-tête collant, navigation basse sur téléphone, colonne latérale sur grand écran ; cartes réservées aux objets (personnes, votes, projets). */
:root {
  --vert: #0a4a30;
  --vert-2: #12603f;
  --sauge: #7fa88a;
  --sauge-pale: #e4eee5;
  --or: #e3a43a;
  --or-pale: #fbefd6;
  --fond: #f4f6ef;
  --carte: #ffffff;
  --carte-2: #f9faf5;
  --texte: #16261c;
  --doux: #55665a;
  --ligne: #d9e1d4;
  --primaire: #0a4a30;
  --sur-primaire: #ffffff;
  --danger: #a83e2a;
  --danger-pale: #f8e3dd;
  --ok: #2c7a4b;
  --ok-pale: #dff0e4;
  --info-pale: #e6eef6;
  --ombre: 0 1px 2px rgb(10 40 25 / 6%), 0 6px 18px rgb(10 40 25 / 6%);
  --f-titre: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-texte: "Nunito Sans", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --vert: #8fd0a6; --vert-2: #6fbf8e; --sauge: #6f9a7b; --sauge-pale: #1d2c23;
    --or: #e9b04d; --or-pale: #3a2f19; --fond: #0d1511; --carte: #15201a; --carte-2: #1a271f;
    --texte: #e8efe7; --doux: #a2b3a6; --ligne: #2a3b31; --primaire: #3d9a66; --sur-primaire: #06140c;
    --danger: #ee8b74; --danger-pale: #3b211b; --ok: #7fd09c; --ok-pale: #18301f; --info-pale: #1b2733;
    --ombre: 0 1px 2px rgb(0 0 0 / 30%); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --vert: #8fd0a6; --vert-2: #6fbf8e; --sauge: #6f9a7b; --sauge-pale: #1d2c23;
  --or: #e9b04d; --or-pale: #3a2f19; --fond: #0d1511; --carte: #15201a; --carte-2: #1a271f;
  --texte: #e8efe7; --doux: #a2b3a6; --ligne: #2a3b31; --primaire: #3d9a66; --sur-primaire: #06140c;
  --danger: #ee8b74; --danger-pale: #3b211b; --ok: #7fd09c; --ok-pale: #18301f; --info-pale: #1b2733;
  --ombre: 0 1px 2px rgb(0 0 0 / 30%); color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--fond); color: var(--texte); font-family: var(--f-texte); font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
h1, h2, h3, h4 { font-family: var(--f-titre); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 1.75rem; }
h2 { font-size: 1.3rem; }
h3 { font-size: 1.08rem; }
p { margin: 0; }
a { color: var(--vert-2); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--or); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.doux { color: var(--doux); }
.petit { font-size: 0.86rem; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Structure */
.app { min-height: 100%; display: grid; grid-template-columns: 1fr; }
.entete { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--fond) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--ligne); }
.entete-in { display: flex; align-items: center; gap: 12px; padding: 10px 16px; max-width: 1180px; margin: 0 auto; }
.marque { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--texte); min-width: 0; }
.marque-disque { width: 44px; height: 44px; border-radius: 50%; background: #fefffa; display: grid; place-items: center; flex: none; box-shadow: inset 0 0 0 1px var(--ligne); }
.marque-disque img { width: 30px; height: auto; }
.marque-nom { font-family: var(--f-titre); font-weight: 700; font-size: 1.2rem; color: var(--vert); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.plat.licence { border-left: 0; background: #fbefd6; color: #5a3a08; margin-bottom: 14px; }
.entete-esp { flex: 1; }
.btn-icone { position: relative; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--ligne); background: var(--carte); display: grid; place-items: center; cursor: pointer; flex: none; padding: 0; }
.btn-icone svg { width: 22px; height: 22px; }
.pastille { position: absolute; top: -3px; right: -3px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--danger); color: #fff; font-size: 0.72rem; font-weight: 800; display: grid; place-items: center; padding: 0 5px; }
.avatar-btn { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; border: 2px solid var(--or); padding: 0; cursor: pointer; background: var(--carte); flex: none; display: grid; place-items: center; }
.avatar-btn .av { width: 100%; height: 100%; }

.corps { max-width: 1180px; width: 100%; margin: 0 auto; padding-inline: 16px; padding-block: 18px 110px; display: grid; gap: 22px; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--carte); border-top: 1px solid var(--ligne); display: grid; grid-template-columns: repeat(6, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav a { display: grid; justify-items: center; gap: 2px; padding: 8px 2px 7px; text-decoration: none; color: var(--doux); font-size: 0.68rem; font-weight: 700; min-height: 58px; }
.nav a svg { width: 24px; height: 24px; }
.nav a[aria-current="page"] { color: var(--vert); }
.nav a[aria-current="page"] svg { stroke-width: 2.4; }
.nav a[aria-current="page"] .nav-pt { background: var(--or); }
.nav-pt { width: 5px; height: 5px; border-radius: 50%; background: transparent; }
@media (min-width: 900px) {
  .app { grid-template-columns: 230px 1fr; grid-template-rows: auto 1fr; }
  .entete { grid-column: 1 / -1; }
  .nav { position: sticky; top: 72px; align-self: start; grid-template-columns: 1fr; border: 0; background: transparent; padding: 18px 0 0 16px; gap: 4px; }
  .nav a { grid-template-columns: 26px 1fr; justify-items: start; align-items: center; gap: 10px; font-size: 0.98rem; padding: 10px 14px; min-height: 0; border-radius: 12px; }
  .nav a[aria-current="page"] { background: var(--sauge-pale); }
  .nav-pt { display: none; }
  .corps { padding-block: 22px 60px; }
}

/* Éléments communs */
.titre-page { display: grid; gap: 6px; }
.titre-page p { color: var(--doux); max-width: 62ch; }
.surtitre { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 800; color: var(--sauge); }
.section { display: grid; gap: 12px; }
.section-tete { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.carte { background: var(--carte); border: 1px solid var(--ligne); border-radius: var(--r); padding: 16px; box-shadow: var(--ombre); min-width: 0; }
.plat { background: var(--carte-2); border: 1px solid var(--ligne); border-radius: var(--r); padding: 14px 16px; }
.grille { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); }
.ligne { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.pile { display: grid; gap: 10px; }
.liste { list-style: none; margin: 0; padding: 0; display: grid; }
.liste > li { padding: 12px 0; border-bottom: 1px solid var(--ligne); display: flex; gap: 12px; align-items: flex-start; }
.liste > li:last-child { border-bottom: 0; }
.vide { padding: 18px; border: 1.5px dashed var(--ligne); border-radius: var(--r); color: var(--doux); display: grid; gap: 6px; }
.vide strong { color: var(--texte); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 18px; border-radius: 12px; border: 1px solid transparent; background: var(--primaire); color: var(--sur-primaire); font-weight: 800; cursor: pointer; text-decoration: none; }
.btn svg { width: 20px; height: 20px; }
.btn.second { background: var(--carte); color: var(--texte); border-color: var(--ligne); }
.btn.or { background: var(--or); color: #2a1d05; }
.btn.danger { background: var(--danger-pale); color: var(--danger); border-color: transparent; }
.btn.lien { background: transparent; color: var(--vert-2); padding-inline: 6px; min-height: 44px; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.btn.petit { min-height: 40px; padding: 6px 12px; font-size: 0.9rem; }

.puce { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 800; background: var(--sauge-pale); color: var(--vert); white-space: nowrap; }
.puce.or { background: var(--or-pale); color: color-mix(in srgb, var(--or) 55%, var(--texte)); }
.puce.danger { background: var(--danger-pale); color: var(--danger); }
.puce.ok { background: var(--ok-pale); color: var(--ok); }
.puce.neutre { background: var(--carte-2); color: var(--doux); border: 1px solid var(--ligne); }
.attente { display: inline-flex; gap: 6px; align-items: center; font-size: 0.78rem; font-weight: 800; color: color-mix(in srgb, var(--or) 60%, var(--texte)); }
.attente::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--or); animation: clign 1.2s infinite; }
@keyframes clign { 50% { opacity: 0.3; } }

.onglets { display: flex; gap: 6px; padding: 4px; background: var(--carte-2); border: 1px solid var(--ligne); border-radius: 14px; overflow-x: auto; }
.onglets button { flex: 1 0 auto; min-height: 44px; padding: 8px 14px; border: 0; border-radius: 10px; background: transparent; font-weight: 800; color: var(--doux); cursor: pointer; }
.onglets button[aria-selected="true"] { background: var(--carte); color: var(--vert); box-shadow: var(--ombre); }

/* Formulaires */
.form { display: grid; gap: 12px; }
.champ { display: grid; gap: 5px; min-width: 0; }
.champ > span { font-weight: 800; font-size: 0.9rem; }
.champ small { color: var(--doux); }
.champ input, .champ select, .champ textarea { width: 100%; min-height: 46px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--ligne); background: var(--carte); }
.champ textarea { min-height: 96px; resize: vertical; }
.champs-2 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); }
.case { display: flex; gap: 10px; align-items: center; min-height: 44px; }
.case input { width: 22px; height: 22px; accent-color: var(--primaire); }
details.pli > summary { cursor: pointer; font-weight: 800; min-height: 44px; display: flex; align-items: center; gap: 8px; list-style: none; }
details.pli > summary::-webkit-details-marker { display: none; }
details.pli > summary::before { content: "+"; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--sauge-pale); color: var(--vert); font-weight: 900; }
details.pli[open] > summary::before { content: "−"; }

/* Avatar */
.av { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #fff; flex: none; overflow: hidden; font-size: 0.95rem; }
.av img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }
.av.g { width: 96px; height: 96px; font-size: 2rem; }
.av.p { width: 32px; height: 32px; font-size: 0.75rem; }

/* Accueil */
.bonjour { display: grid; gap: 4px; }
.bonjour h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); }
.reperes { display: grid; gap: 10px; grid-template-columns: repeat(3, 1fr); }
.repere { background: var(--carte); border: 1px solid var(--ligne); border-radius: var(--r); padding: 12px 14px; display: grid; grid-template-rows: 1fr auto; gap: 4px; min-width: 0; text-align: center; justify-items: center; align-items: center; }
.repere span { font-size: 0.8rem; color: var(--doux); font-weight: 700; }
.repere strong { font-family: var(--f-titre); font-size: 1.15rem; color: var(--vert); }
@media (max-width: 520px) { .reperes { grid-template-columns: 1fr 1fr; } .reperes .repere:last-child { grid-column: 1 / -1; } }
.finances { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); }
.indic { background: var(--carte); border: 1px solid var(--ligne); border-radius: var(--r); padding: 16px; display: grid; grid-template-rows: auto 1fr auto; gap: 6px; box-shadow: var(--ombre); min-width: 0; }
.indic .lib { font-weight: 800; }
.indic .expl { font-size: 0.86rem; color: var(--doux); }
.indic .mt { font-family: var(--f-titre); font-size: clamp(1.5rem, 4vw, 2rem); color: var(--vert); font-variant-numeric: tabular-nums; align-self: end; }
.indic.principal { background: var(--primaire); border-color: var(--primaire); color: var(--sur-primaire); }
.indic.principal .expl { color: color-mix(in srgb, var(--sur-primaire) 78%, transparent); }
.indic.principal .mt { color: var(--sur-primaire); }

/* Célébration */
.fete { position: relative; overflow: hidden; border-radius: 20px; padding: 22px; background: var(--or-pale); border: 1px solid color-mix(in srgb, var(--or) 40%, transparent); display: grid; gap: 14px; grid-template-columns: auto 1fr; align-items: center; }
.fete::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0.55;
  background-image: radial-gradient(circle, var(--or) 2.5px, transparent 3px), radial-gradient(circle, var(--sauge) 2px, transparent 2.5px), radial-gradient(circle, var(--vert-2) 1.8px, transparent 2.3px);
  background-size: 74px 64px, 52px 90px, 96px 58px; -webkit-mask-image: linear-gradient(90deg, transparent 35%, #000 75%); mask-image: linear-gradient(90deg, transparent 35%, #000 75%); background-position: 0 0, 22px 30px, 40px 12px; animation: confettis 14s linear infinite; }
@keyframes confettis { to { background-position: 0 128px, 22px 210px, 40px 128px; } }
.fete > * { position: relative; }
.fete .av.g { border: 4px solid var(--carte); box-shadow: 0 0 0 3px var(--or); }
.fete h2 { font-size: clamp(1.4rem, 4vw, 1.9rem); color: var(--vert); }
@media (max-width: 480px) { .fete { grid-template-columns: 1fr; justify-items: start; } }

/* Anniversaires */
.anniv-grille { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); }
.anniv-carte { background: var(--carte); border: 1px solid var(--ligne); border-radius: 18px; padding: 16px; display: grid; justify-items: center; text-align: center; gap: 6px; cursor: pointer; position: relative; box-shadow: var(--ombre); min-height: 210px; }
.anniv-carte:hover { border-color: var(--or); }
.anniv-carte .date { font-family: var(--f-titre); font-size: 1.05rem; color: var(--vert); }
.anniv-carte .ruban { position: absolute; top: 10px; right: 10px; }
.anniv-carte.jour { background: var(--or-pale); border-color: var(--or); }
.mur { display: grid; gap: 10px; }
.voeu { background: var(--carte-2); border: 1px solid var(--ligne); border-radius: 16px 16px 16px 4px; padding: 12px 14px; display: grid; gap: 8px; }
.reactions { display: flex; gap: 6px; flex-wrap: wrap; }
.reac { min-height: 36px; min-width: 44px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--ligne); background: var(--carte); cursor: pointer; font-size: 0.95rem; display: inline-flex; align-items: center; gap: 4px; }
.reac[aria-pressed="true"] { border-color: var(--or); background: var(--or-pale); }

/* Agenda */
.evt { display: grid; grid-template-columns: 62px 1fr; gap: 12px; align-items: start; }
.evt-date { background: var(--sauge-pale); color: var(--vert); border-radius: 12px; text-align: center; padding: 6px 4px; font-weight: 800; line-height: 1.1; }
.evt-date b { display: block; font-family: var(--f-titre); font-size: 1.45rem; }
.evt-date small { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; }
.evt-date.anniv { background: var(--or-pale); color: color-mix(in srgb, var(--or) 55%, var(--texte)); }

/* Cotisations */
.bandeau { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; background: var(--carte); border: 1px solid var(--ligne); border-left: 5px solid var(--or); border-radius: var(--r); padding: 10px 10px 10px 16px; }
.bandeau-txt { min-width: 0; display: grid; gap: 2px; }
.bandeau-txt .t { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.07em; font-weight: 800; color: var(--doux); }
.bandeau-msg { font-weight: 700; transition: opacity 0.4s; }
.bandeau-cmd { display: flex; gap: 6px; }
@media (prefers-reduced-motion: reduce) { .bandeau-msg { transition: none; } .fete::before { animation: none; } .attente::before { animation: none; } }
.seg { display: flex; gap: 4px; padding: 4px; background: var(--carte-2); border: 1px solid var(--ligne); border-radius: 14px; flex-wrap: wrap; }
.seg button { flex: 1 1 auto; min-height: 44px; border: 0; border-radius: 10px; background: transparent; font-weight: 800; color: var(--doux); padding: 6px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--primaire); color: var(--sur-primaire); }
.statut-bilan { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tableau-wrap { overflow-x: auto; border: 1px solid var(--ligne); border-radius: var(--r); background: var(--carte); }
table.tab { width: 100%; border-collapse: collapse; min-width: 640px; }
.tab th, .tab td { padding: 11px 12px; text-align: right; border-bottom: 1px solid var(--ligne); font-variant-numeric: tabular-nums; vertical-align: top; }
.tab th:first-child, .tab td:first-child { text-align: left; }
.tab thead th { font-size: 0.8rem; color: var(--doux); font-weight: 800; background: var(--carte-2); position: sticky; top: 0; }
.tab tfoot td { font-weight: 800; background: var(--carte-2); border-bottom: 0; }
.tab .neg { color: var(--danger); font-weight: 800; }
.cartes-membres { display: none; gap: 10px; }
@media (max-width: 700px) { .tableau-wrap.membres { display: none; } .cartes-membres { display: grid; } }
.cm { background: var(--carte); border: 1px solid var(--ligne); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 8px; }
.cm dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 0.92rem; }
.cm dt { color: var(--doux); }
.cm dd { margin: 0; text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }

/* Votes et projets */
.phrase-vote { font-family: var(--f-titre); font-size: 1.12rem; color: var(--vert); border-left: 4px solid var(--or); padding: 6px 0 6px 14px; max-width: 60ch; }
.barres { display: grid; gap: 8px; }
.barre { display: grid; grid-template-columns: 92px 1fr 36px; gap: 10px; align-items: center; }
.barre-piste { height: 16px; border-radius: 8px; background: var(--carte-2); border: 1px solid var(--ligne); overflow: hidden; }
.barre-rempli { height: 100%; border-radius: 8px; }
.barre .n { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
.choix { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.choix button { min-height: 50px; border-radius: 12px; border: 1.5px solid var(--ligne); background: var(--carte); font-weight: 800; cursor: pointer; }
.choix button[aria-pressed="true"] { border-color: var(--primaire); background: var(--sauge-pale); color: var(--vert); }
.progres { height: 14px; border-radius: 7px; background: var(--carte-2); border: 1px solid var(--ligne); overflow: hidden; }
.progres div { height: 100%; background: linear-gradient(90deg, var(--vert-2), var(--sauge)); border-radius: 7px; }
.etapes { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.etapes li { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: center; font-size: 0.93rem; }
.etapes .pt { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--ligne); display: grid; place-items: center; }
.etapes .fait .pt { background: var(--ok); border-color: var(--ok); color: #fff; }
.etapes .cour .pt { border-color: var(--or); background: var(--or-pale); }

/* Charte */
.charte-txt { display: grid; gap: 14px; max-width: 72ch; }
.charte-txt h3 { color: var(--vert); margin-top: 6px; }
.charte-txt p { white-space: pre-line; }
.officiel { border: 1px solid var(--ligne); border-radius: var(--r); padding: 18px; background: var(--carte); }

/* Divers */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 50; background: var(--texte); color: var(--fond); padding: 12px 18px; border-radius: 12px; font-weight: 700; max-width: min(92vw, 520px); box-shadow: 0 8px 24px rgb(0 0 0 / 25%); }
@media (min-width: 900px) { .toast { bottom: 24px; } }
.bandeau-demo { background: var(--or); color: #2a1d05; font-weight: 800; text-align: center; padding: 8px 16px; font-size: 0.9rem; }
.bandeau-demo button { background: transparent; border: 1.5px solid #2a1d05; border-radius: 8px; padding: 2px 10px; margin-left: 8px; font-weight: 800; cursor: pointer; color: #2a1d05; min-height: 32px; }
.erreur-boot { margin: 16px; padding: 14px; border-radius: 12px; background: var(--danger-pale); color: var(--danger); font-weight: 700; white-space: pre-wrap; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--danger-pale); border-radius: 12px; padding: 8px 12px; }
.hero-logo { width: 120px; height: auto; }
.accueil-tete { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; }
@media (max-width: 520px) { .hero-logo { width: 84px; } }
.deux-col { display: grid; gap: 22px; grid-template-columns: 1fr; }
@media (min-width: 1000px) { .deux-col { grid-template-columns: 1.15fr 1fr; } }
.etiq { font-size: 0.78rem; font-weight: 800; color: var(--doux); text-transform: uppercase; letter-spacing: 0.06em; }
@media (min-width: 900px) { .app > .nav { grid-column: 1; grid-row: 3; } .app > .corps { grid-column: 2; grid-row: 3; } .app > .bandeau-demo, .app > .entete { grid-column: 1 / -1; } .app { grid-template-rows: auto auto 1fr; } }
/* Écran de connexion */
.hors-session .nav, .hors-session #btn-cloche, .hors-session #btn-avatar { display: none !important; }
.hors-session .corps { padding-bottom: 40px; }
.hors-session .app > .corps { grid-column: 1 / -1; }
.connexion { display: grid; gap: 14px; max-width: 520px; margin: 0 auto; width: 100%; justify-items: center; text-align: center; padding-top: 8px; }
.connexion > .carte, .connexion > .vide, .connexion > .plat { width: 100%; text-align: left; }
.connexion .hero-logo { width: 150px; }
/* Logo toujours posé sur un disque clair, lisible en mode sombre */
.hero-logo { background: #fefffa; border-radius: 50%; padding: 8px; box-sizing: content-box; }

/* Manque à gagner (total des arriérés) */
.manque { display: grid; grid-template-columns: 1fr auto; gap: 2px 14px; align-items: baseline; background: var(--danger-pale); border-radius: var(--r); padding: 12px 16px; }
.manque-lib { font-weight: 800; color: var(--danger); }
.manque-mt { font-family: var(--f-titre); font-size: clamp(1.3rem, 4vw, 1.7rem); color: var(--danger); grid-row: span 2; align-self: center; }
.manque-det { font-size: 0.86rem; color: var(--doux); }

/* Largeur verrouillée : pas de glissement latéral ni de rebond horizontal pendant le défilement (iPhone) */
html, body { max-width: 100%; overflow-x: hidden; overscroll-behavior-x: none; }
@supports (overflow-x: clip) { html, body { overflow-x: clip; } }

/* Pastilles rouges du menu et des onglets ; badge « Nouveau » */
.nav a { position: relative; }
.nav-pastille { position: absolute; top: 4px; left: calc(50% + 6px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--danger); color: #fff; font-size: 0.68rem; font-weight: 800; display: grid; place-items: center; padding: 0 5px; line-height: 1; box-shadow: 0 0 0 2px var(--carte); }
.onglet-pt { display: inline-grid; place-items: center; min-width: 18px; height: 18px; margin-left: 6px; border-radius: 9px; background: var(--danger); color: #fff; font-size: 0.68rem; font-weight: 800; padding: 0 5px; vertical-align: 1px; }
.puce.nouveau { background: var(--danger); color: #fff; }
.ico-mini { width: 14px; height: 14px; vertical-align: -2px; margin-right: 2px; }

/* Lecture à voix haute */
.btn-lire.actif { border-color: var(--or); background: var(--or-pale); }
.btn-lire.mini { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--ligne); background: var(--carte); color: var(--vert); display: grid; place-items: center; cursor: pointer; padding: 0; flex: none; }
.btn-lire.mini svg { width: 18px; height: 18px; }
.btn-lire.mini.actif { color: var(--danger); }
.art-tete { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.article { display: grid; gap: 10px; }
.lu { background: var(--or-pale); border-radius: 6px; box-shadow: 0 0 0 4px var(--or-pale); transition: background .2s; }
.lecteur { position: fixed; left: 12px; right: 12px; bottom: calc(66px + env(safe-area-inset-bottom, 0px)); z-index: 35; display: flex; align-items: center; gap: 10px; background: var(--carte); border: 1px solid var(--or); border-radius: 14px; padding: 8px 10px; box-shadow: var(--ombre); max-width: 560px; margin: 0 auto; }
.lecteur > svg { width: 22px; height: 22px; color: var(--vert); flex: none; }
.lect-txt { flex: 1; min-width: 0; display: grid; line-height: 1.2; }
.lect-txt small { color: var(--doux); font-size: 0.72rem; }
.lect-txt b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.9rem; }
.lecteur .btn svg { width: 16px; height: 16px; }

/* Pièces jointes */
.pj-zone { display: grid; gap: 8px; justify-items: start; }
.pj-zone > small { font-size: 0.78rem; }
.pj-ajout { cursor: pointer; }
.pj-ajout svg { width: 18px; height: 18px; }
.pj-liste { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; width: 100%; }
.pj-chip { display: flex; align-items: center; gap: 10px; border: 1px solid var(--ligne); border-radius: 10px; padding: 6px 8px; background: var(--carte-2); min-width: 0; }
.pj-chip.err { border-color: var(--danger); background: var(--danger-pale); }
.pj-chip img, .pj-ico { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; flex: none; display: grid; place-items: center; background: var(--sauge-pale); color: var(--vert); }
.pj-ico svg { width: 22px; height: 22px; }
.pj-nom { flex: 1; min-width: 0; display: grid; font-size: 0.88rem; }
.pj-nom > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700; }
.pj-nom small { color: var(--doux); }
.pj-x { width: 32px; height: 32px; border-radius: 50%; border: 0; background: transparent; color: var(--doux); display: grid; place-items: center; cursor: pointer; flex: none; }
.pj-x svg { width: 18px; height: 18px; }
.pj-retrait { border: 1px solid var(--ligne); border-radius: 10px; padding: 6px 10px; margin: 0; display: grid; gap: 4px; }
.pj-aff { display: grid; gap: 8px; }
.pj-photos { display: grid; gap: 6px; grid-template-columns: repeat(2, 1fr); max-width: 520px; }
.pj-photos.n1 { grid-template-columns: 1fr; }
.pj-photos.n3 > :first-child { grid-column: span 2; }
.pj-photo { border: 0; padding: 0; border-radius: 10px; overflow: hidden; background: var(--sauge-pale); aspect-ratio: 4 / 3; cursor: zoom-in; display: grid; place-items: center; min-width: 0; }
.pj-photos.n1 .pj-photo { aspect-ratio: auto; max-height: 420px; }
.pj-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pj-photos.n1 .pj-photo img { height: auto; max-height: 420px; object-fit: contain; }
.pj-attente { font-size: 0.8rem; color: var(--doux); padding: 18px 8px; text-align: center; }
.pj-docs { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.pj-doc { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 1px solid var(--ligne); border-radius: 10px; padding: 8px 10px; background: var(--carte-2); cursor: pointer; min-width: 0; }
.pj-doc > svg { width: 24px; height: 24px; color: var(--vert); flex: none; }
.pj-doc-txt { display: grid; min-width: 0; }
.pj-doc-nom { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.visionneuse { position: fixed; inset: 0; z-index: 60; background: #07110c; display: grid; grid-template-rows: 1fr auto; place-items: center; padding: max(12px, env(safe-area-inset-top, 0px)) 12px max(12px, env(safe-area-inset-bottom, 0px)); }
.visionneuse img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; min-height: 0; }
.vis-barre { display: flex; align-items: center; gap: 8px; width: 100%; max-width: 640px; color: #fff; padding-top: 10px; }
.vis-barre span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.86rem; }
body.fige { overflow: hidden; }
body.en-lecture .corps { padding-bottom: 180px; }
h3 .puce { vertical-align: 2px; }

/* Recadrage de la photo de profil */
.cadrage { display: grid; gap: 10px; justify-items: start; }
.cadre { position: relative; border-radius: 50%; overflow: hidden; background: var(--sauge-pale); touch-action: none; cursor: grab; box-shadow: 0 0 0 3px var(--or); user-select: none; -webkit-user-select: none; }
.cadre:active { cursor: grabbing; }
.cadre img { position: absolute; left: 50%; top: 50%; max-width: none; pointer-events: none; -webkit-user-drag: none; }
.cadrage input[type=range] { width: 100%; accent-color: var(--vert-2); }
@media (min-width: 900px) {
  .nav a { grid-template-columns: 26px 1fr auto; }
  .nav-pastille { position: static; box-shadow: none; }
  .lecteur { bottom: 24px; }
}

/* Reçus de cotisation */
.liste.recus { margin-top: 8px; }
.recu-ligne { display: grid !important; gap: 8px; }
.recu-tete { display: flex; align-items: center; gap: 10px; min-width: 0; }
.recu-apercu { overflow-x: auto; margin: 4px -4px 0; padding: 4px; }

/* Laisse la place au bouton Face ID affiché par la page d'accueil */
.hors-session .corps { padding-bottom: 150px; }
.ico-titre { width: 24px; height: 24px; vertical-align: -4px; color: var(--vert-2); }

/* Statistiques de l'administrateur */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.kpi { background: var(--carte-2); border: 1px solid var(--ligne); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; }
.kpi span { font-size: 0.78rem; color: var(--doux); font-weight: 700; }
.kpi strong { font-family: var(--f-titre); font-size: 1.45rem; color: var(--vert); }
.kpi small { font-size: 0.74rem; color: var(--doux); }
.graphe-j { display: flex; align-items: flex-end; gap: 3px; height: 110px; margin-top: 8px; padding: 6px; border: 1px solid var(--ligne); border-radius: 10px; background: var(--carte-2); }
.graphe-j span { flex: 1; min-width: 0; background: var(--sauge); border-radius: 3px 3px 0 0; }
.graphe-j span.auj { background: var(--or); }
.graphe-l { display: flex; justify-content: space-between; margin-top: 4px; }
.stats-membres { display: grid; gap: 8px; }
.stat-m { border: 1px solid var(--ligne); border-radius: 12px; padding: 10px 12px; display: grid; gap: 8px; background: var(--carte); }
.stat-chiffres { display: grid; justify-items: end; line-height: 1.1; }
.stat-chiffres b { font-family: var(--f-titre); font-size: 1.3rem; color: var(--vert); }
.stat-chiffres small { font-size: 0.72rem; color: var(--doux); }
.stats-actions li { padding: 6px 0; }
.fonds-soldes { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 10px; }
.fonds-solde { background: var(--carte); border: 1px solid var(--ligne); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.fonds-solde span { font-size: 0.8rem; color: var(--doux); font-weight: 700; }
.fonds-solde span small { color: var(--vert-2); font-weight: 800; text-transform: uppercase; letter-spacing: .04em; margin-left: 4px; }
.fonds-solde strong { font-family: var(--f-titre); color: var(--vert); font-size: 1.05rem; }
.fonds-solde.capital { border-color: var(--or); }

/* Les grilles ne s’élargissent jamais au-delà de l’écran : les tableaux larges défilent dans leur cadre */
.corps > *, .section > *, .pli > * { min-width: 0; }
.info-cache { margin: 0 0 12px; padding: 8px 12px; border-radius: 10px; background: var(--sauge-pale); color: var(--vert); font-size: 14px; }
</style>

<script>/**
 * Adya – l'application privée des familles, amicales et mutuelles
 * Une solution SoluGis. Ce fichier est installé dans le compte Google du groupe :
 * les données restent dans ce compte.
 * ---------------------------------------------------------------
 * Ce script crée et fait fonctionner :
 *   - le classeur Google Sheets qui conserve toutes les données ;
 *   - l'application web (Accueil, Vie du groupe, Cotisations et parts,
 *     Projets et décisions, Charte, Mon espace) ;
 *   - les e-mails de notification (facultatifs) et les sauvegardes hebdomadaires.
 *
 * Installation (voir le guide d'installation SoluGis) :
 *   1. Remplissez le bloc PARAMETRES ci-dessous (ou utilisez le fichier préparé par SoluGis).
 *   2. Collez ce fichier dans Code.gs et créez le fichier HTML « Index ».
 *   3. Exécutez la fonction installer() une seule fois et acceptez les autorisations.
 *   4. Déployez : Déployer > Nouveau déploiement > Application Web
 *      (Exécuter en tant que : Moi ; Qui a accès : Tout le monde).
 *   5. Les codes personnels de départ sont dans l'onglet « Codes de départ » du classeur.
 *   6. Données historiques : remplissez les onglets « Import – … » du classeur, puis
 *      exécutez importer() (ou bouton « Importer » dans Administration).
 */

/* ================================================================
 * PARAMÈTRES DU GROUPE (à remplir avant installer())
 * ================================================================ */
const PARAMETRES = {
  GROUPE: 'Famille Exemple',      // nom affiché dans l'application, les e-mails et les reçus
  TYPE: 'famille',                // famille, amicale, mutuelle, association ou groupe
  SIGLE: 'FEX',                   // 2 à 6 lettres : début des numéros de reçus (FEX-2026-0001)
  MEMBRES: ['Awa Koné', 'Koffi Yao', 'Mariam Traoré', 'Serge N’Guessan', 'Nadia Bamba', 'Paul Kouassi', 'Inès Diallo', 'Hervé Aka'],
  ADMIN: 4,                       // rang dans MEMBRES de l'administrateur (1 = le premier)
  COTISATION: 10000,              // cotisation mensuelle par membre, en FCFA
  ECHEANCE: 15,                   // jour limite de paiement dans le mois (1 à 28)
  TRESORIER: 'trésorier',         // titre par défaut : 'trésorier' ou 'trésorière'
  FUSEAU: 'Africa/Abidjan',
  PORTE: '',                      // page d'accueil avec l'icône et Face ID (ex. 'https://solugis.github.io/famille-exemple/') ; '' si aucune
  LICENCE: {
    TYPE: 'abonnement',           // 'abonnement' ou 'definitive'
    ID: '',                       // identifiant du groupe chez SoluGis
    URL: ''                       // fichier des licences publié par SoluGis ('' : aucune vérification)
  },
  MAX_MEMBRES: 100                // au-delà : sur devis
};

const CONFIG = {
  NOM_CLASSEUR: 'Adya – ' + PARAMETRES.GROUPE + ' – Données',
  NOM_DOSSIER_SAUVEGARDES: 'Adya – ' + PARAMETRES.GROUPE + ' – Sauvegardes',
  NOM_DOSSIER_PJ: 'Adya – ' + PARAMETRES.GROUPE + ' – Pièces jointes',   // photos et documents joints aux publications
  NOM_DOSSIER_RECUS: 'Adya – ' + PARAMETRES.GROUPE + ' – Reçus',          // copies PDF des reçus de cotisation
  NOM_DOSSIER_EXPORTS: 'Adya – ' + PARAMETRES.GROUPE + ' – Exports',      // copies temporaires pour l'export Excel
  ADMIN: 'm' + PARAMETRES.ADMIN,
  FUSEAU: PARAMETRES.FUSEAU || 'Africa/Abidjan',
  JOURS_SESSION: 120,          // durée d'une connexion sur un appareil
  SAUVEGARDES_GARDEES: 8,      // nombre de copies hebdomadaires conservées
  JOURS_GRACE: 60              // délai de grâce après la fin de la dernière période payée (conditions générales, art. 11)
};

const TYPES_GROUPE_ = ['famille', 'amicale', 'mutuelle', 'association', 'groupe'];
/** Informations du groupe transmises à l'application (aucune donnée personnelle). */
function groupe_() {
  const p = PARAMETRES, sigle = String(p.SIGLE || 'ADYA').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6) || 'ADYA';
  let porte = '';
  const m = String(p.PORTE || '').match(/^(https:\/\/[^/]+|http:\/\/localhost(?::\d+)?)/);   // localhost : banc d'essai seulement
  if (m) porte = m[1];
  return {
    nom: String(p.GROUPE || 'Mon groupe').slice(0, 80), type: TYPES_GROUPE_.indexOf(p.TYPE) >= 0 ? p.TYPE : 'groupe', sigle: sigle,
    tresorier: p.TRESORIER === 'trésorière' ? 'trésorière' : 'trésorier', porte: porte, lienPorte: String(p.PORTE || ''),
    cotisation: Math.max(1, Math.round(+p.COTISATION || 10000)), echeance: Math.min(28, Math.max(1, Math.round(+p.ECHEANCE || 15))),
    maxMembres: Math.max(2, Math.round(+p.MAX_MEMBRES || 100)), licence: (p.LICENCE || {}).TYPE === 'definitive' ? 'definitive' : 'abonnement'
  };
}
/** « La trésorière » ou « Le trésorier » en fonction (titre choisi à la désignation). */
function titreTresorerie_(cfg, majuscule) {
  const t = ((cfg && cfg.tresoriers) || []).filter(function (x) { return !x.au; })[0];
  const f = (t && t.titre ? t.titre : groupe_().tresorier) === 'trésorière';
  return (majuscule ? (f ? 'La' : 'Le') : (f ? 'la' : 'le')) + ' ' + (f ? 'trésorière' : 'trésorier');
}
/** Nom des e-mails et du titre de la page. */
function nomApp_() { return 'Adya · ' + groupe_().nom; }
/** Page d'accueil du groupe (icône, Face ID) si elle existe, sinon le lien direct de l'application. */
function lienApp_() { return groupe_().lienPorte || url_(); }

const F_DONNEES = 'Données';
const F_REGISTRE = 'Registre financier';
const F_BILANS = 'Bilans publiés';
const F_JOURNAL = 'Journal';
const F_ENVOIS = 'E-mails envoyés';
const F_CODES = 'Codes de départ';
const F_ACTIVITE = 'Activité';   // une ligne par membre et par jour d'utilisation (statistiques de l'administrateur)

/* ================================================================
 * 1. INSTALLATION (à exécuter une seule fois)
 * ================================================================ */
function installer() {
  const props = PropertiesService.getScriptProperties();
  if (props.getProperty('SS_ID')) {
    Logger.log('Déjà installé. Classeur : ' + SpreadsheetApp.openById(props.getProperty('SS_ID')).getUrl());
    return;
  }
  const G = groupe_();
  const noms = (PARAMETRES.MEMBRES || []).map(function (n) { return String(n || '').trim().slice(0, 80); }).filter(Boolean);
  if (noms.length < 2) throw new Error('Indiquez au moins deux membres dans PARAMETRES.MEMBRES.');
  if (noms.length > G.maxMembres) throw new Error('Trop de membres : ' + G.maxMembres + ' au plus.');
  if (!(PARAMETRES.ADMIN >= 1 && PARAMETRES.ADMIN <= noms.length)) throw new Error('PARAMETRES.ADMIN doit être le rang d’un membre (de 1 à ' + noms.length + ').');
  const ss = SpreadsheetApp.create(CONFIG.NOM_CLASSEUR);
  ss.setSpreadsheetLocale('fr_FR');
  ss.setSpreadsheetTimeZone(CONFIG.FUSEAU);
  const d = ss.getSheets()[0].setName(F_DONNEES);
  entetes_(d, ['Chemin', 'Collection', 'Membre', 'Contenu', 'Créé le', 'Mis à jour le']);
  entetes_(ss.insertSheet(F_REGISTRE), ['Date', 'Type', 'Membre', 'Montant (FCFA)', 'Détail', 'Affectation', 'Saisi le', 'Saisi par', 'État']);
  entetes_(ss.insertSheet(F_BILANS), ['Bilan', 'Version', 'Période', 'Publié le', 'Publié par', 'Total reçu', 'Solde en caisse', 'Empreinte', 'Motif']);
  entetes_(ss.insertSheet(F_JOURNAL), ['Date', 'Membre', 'Action', 'Détail']);
  entetes_(ss.insertSheet(F_ENVOIS), ['Date', 'Membre', 'Catégorie', 'Objet']);
  const codes = ss.insertSheet(F_CODES);
  entetes_(codes, ['Membre', 'Code de départ (à transmettre en privé)']);
  props.setProperty('SS_ID', ss.getId());
  props.setProperty('SEL', Utilities.getUuid());

  const membres = {}, ordre = [];
  noms.forEach(function (nom, i) { const id = 'm' + (i + 1); ordre.push(id); membres[id] = nouveauMembre_(id, nom, '', null); });
  const cfg = {
    ordre: ordre, membres: membres, admins: [CONFIG.ADMIN], tresoriers: [],
    finances: { montant: G.cotisation, jour: G.echeance },
    droits: { nouvelles: 'tous', agenda: 'tous', votes: 'tous', projets: 'tous' },
    reglagesVote: { modification: false, choixVisibles: false },
    rappels: { actifs: false, heure: 8 }, charteVersions: [], journalVote: [], seuilCharte: '2/3', repriseLe: null
  };
  const maintenant = new Date();
  d.appendRow(['config/app', 'config', '', JSON.stringify(cfg), maintenant, maintenant]);

  const lignes = [];
  ordre.forEach(function (id) {
    const code = codeAleatoire_();
    props.setProperty('code:' + id, hacher_(code));
    props.setProperty('changer:' + id, '1');
    lignes.push([membres[id].nom, "'" + code]);
  });
  codes.getRange(2, 1, lignes.length, 2).setValues(lignes);
  codes.getRange(lignes.length + 3, 1).setValue('Chaque membre devra choisir son propre code à la première connexion. Supprimez cet onglet après la distribution.');

  preparerImport_(ss, membres, ordre);
  ScriptApp.newTrigger('tacheQuotidienne').timeBased().everyDays(1).atHour(8).inTimezone(CONFIG.FUSEAU).create();
  ScriptApp.newTrigger('sauvegarder').timeBased().everyWeeks(1).onWeekDay(ScriptApp.WeekDay.SUNDAY).atHour(3).inTimezone(CONFIG.FUSEAU).create();
  journal_('', 'Installation', 'Classeur créé pour ' + G.nom);
  try { verifierLicence_(); } catch (e) { Logger.log(e); }
  Logger.log('Classeur : ' + ss.getUrl());
  Logger.log('Étape suivante : Déployer > Nouveau déploiement > Application Web (Exécuter en tant que : Moi ; Accès : Tout le monde).');
}

/** Fiche d'un membre dans la configuration. entree : premier mois de cotisation (null = début du suivi). */
function nouveauMembre_(id, nom, email, entree) {
  return { nom: nom, uid: id, droitVote: true, motifVote: '', email: email || '', entree: entree || null, sortie: null, motifSortie: '' };
}

function entetes_(sh, cols) {
  sh.getRange(1, 1, 1, cols.length).setValues([cols]).setFontWeight('bold').setFontColor('#FFFFFF').setBackground('#0A4A30');
  sh.setFrozenRows(1);
}

/* ================================================================
 * 2. APPLICATION WEB
 * ================================================================ */
function doGet() {
  return HtmlService.createTemplateFromFile('Index').evaluate()
    .setTitle(nomApp_())
    .addMetaTag('viewport', 'width=device-width, initial-scale=1')
    .addMetaTag('mobile-web-app-capable', 'yes')
    .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL);   // permet l'affichage dans la page d'accueil du groupe (icône et nom sur l'écran d'accueil)
}
/** Informations publiques injectées dans la page (nom du groupe, page d'accueil) : voir Index.html. */
function adyaPublic_() {
  const G = groupe_();
  return { groupe: G.nom, type: G.type, sigle: G.sigle, tresorier: G.tresorier, porte: G.porte, lienPorte: G.lienPorte, licence: G.licence };
}

/* ================================================================
 * 3. CONNEXION ET CODES PERSONNELS
 * ================================================================ */
function sel_() { return PropertiesService.getScriptProperties().getProperty('SEL') || 'adya'; }
function hacher_(code) {
  const b = Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, sel_() + '|' + String(code), Utilities.Charset.UTF_8);
  return b.map(function (x) { return ('0' + ((x + 256) % 256).toString(16)).slice(-2); }).join('');
}
function codeAleatoire_() { let s = ''; for (let i = 0; i < 6; i++) s += Math.floor(Math.random() * 10); return s; }
function refus_(msg) { return new Error('REFUS: ' + msg); }

/** Membres présents (les membres partis n'apparaissent plus dans la liste de connexion). */
function actifs_(cfg) { return cfg.ordre.filter(function (id) { return cfg.membres[id] && !cfg.membres[id].sortie; }); }
function apiListeConnexion() {
  const cfg = lireDocsRapide_()['config/app'].data;
  return actifs_(cfg).map(function (id) { return [id, cfg.membres[id].nom]; });
}

function apiConnexion(id, code) {
  const cache = CacheService.getScriptCache();
  const kM = 'echecs:' + id, n = Number(cache.get(kM) || 0), g = Number(cache.get('echecs:tous') || 0);
  if (n >= 5 || g >= 40) throw refus_('Trop d’essais. Réessayez dans 15 minutes.');
  const props = PropertiesService.getScriptProperties();
  const h = props.getProperty('code:' + id);
  if (!h || hacher_(String(code || '').trim()) !== h) {
    cache.put(kM, String(n + 1), 900); cache.put('echecs:tous', String(g + 1), 900);
    throw refus_('Nom ou code incorrect.');
  }
  cache.remove(kM);
  journal_(id, 'Connexion', '');
  return creerSession_(id);
}
function creerSession_(id) {
  const props = PropertiesService.getScriptProperties();
  const jeton = Utilities.getUuid().replace(/-/g, '') + Utilities.getUuid().replace(/-/g, '');
  props.setProperty('sess:' + jeton, JSON.stringify({ m: id, exp: Date.now() + CONFIG.JOURS_SESSION * 864e5 }));
  return { jeton: jeton, doitChanger: props.getProperty('changer:' + id) === '1' };
}

function session_(jeton) {
  if (!jeton) throw new Error('SESSION');
  const p = PropertiesService.getScriptProperties();
  const s = p.getProperty('sess:' + jeton);
  if (!s) throw new Error('SESSION');
  const o = JSON.parse(s);
  if (o.exp < Date.now()) { p.deleteProperty('sess:' + jeton); throw new Error('SESSION'); }
  return o.m;
}

function apiDeconnexion(jeton) { PropertiesService.getScriptProperties().deleteProperty('sess:' + jeton); return true; }

function apiChangerCode(jeton, ancien, nouveau) {
  const m = session_(jeton);
  const props = PropertiesService.getScriptProperties();
  if (hacher_(String(ancien || '').trim()) !== props.getProperty('code:' + m)) throw refus_('Le code actuel est incorrect.');
  nouveau = String(nouveau || '').trim();
  if (!/^\d{6,10}$/.test(nouveau)) throw refus_('Le nouveau code doit contenir de 6 à 10 chiffres.');
  if (/^(\d)\1+$/.test(nouveau) || '0123456789'.indexOf(nouveau) >= 0) throw refus_('Choisissez un code moins facile à deviner.');
  props.setProperty('code:' + m, hacher_(nouveau));
  props.deleteProperty('changer:' + m);
  journal_(m, 'Changement de code', '');
  return true;
}

function emailDe_(docs, m) {
  const p = docs['prefs/' + m] ? docs['prefs/' + m].data : {};
  const cfg = docs['config/app'].data;
  return String((p && p.email) || (cfg.membres[m] && cfg.membres[m].email) || '').trim();
}

function apiCodeOublie(id) {
  const cache = CacheService.getScriptCache();
  if (cache.get('oubli:' + id)) throw refus_('Un code a déjà été envoyé il y a peu. Consultez vos e-mails ou réessayez dans 15 minutes.');
  const docs = lireDocs_();
  const cfg = docs['config/app'].data;
  if (!cfg.membres[id] || cfg.membres[id].sortie) throw refus_('Membre inconnu.');
  const email = emailDe_(docs, id);
  if (!email) return { envoye: false };
  const code = codeAleatoire_();
  const props = PropertiesService.getScriptProperties();
  props.setProperty('code:' + id, hacher_(code));
  props.setProperty('changer:' + id, '1');
  cache.put('oubli:' + id, '1', 900);
  MailApp.sendEmail({ to: email, name: nomApp_(), subject: nomApp_() + ' – votre code provisoire',
    body: 'Bonjour,\n\nVotre code provisoire Adya (' + groupe_().nom + ') est : ' + code + '\n\nVous choisirez un nouveau code juste après la connexion.\n\nOuvrir l’application : ' + lienApp_() + '\n\nSi vous n’avez rien demandé, prévenez l’administrateur.' });
  journal_(id, 'Code oublié', 'Code provisoire envoyé par e-mail');
  return { envoye: true };
}

function apiReinitialiserCode(jeton, id) {
  const moi = session_(jeton);
  const cfg = lireDocs_()['config/app'].data;
  if (cfg.admins.indexOf(moi) < 0) throw refus_('Réservé à l’administrateur.');
  if (!cfg.membres[id] || cfg.membres[id].sortie) throw refus_('Membre inconnu ou parti.');
  const code = codeAleatoire_();
  const props = PropertiesService.getScriptProperties();
  props.setProperty('code:' + id, hacher_(code));
  props.setProperty('changer:' + id, '1');
  fermerSessions_(id);   // ferme les connexions ouvertes de ce membre
  // Retire aussi ses appareils Face ID (téléphone perdu, changement d'appareil…)
  const lock = LockService.getScriptLock(); lock.waitLock(20000);
  try { const docs = lireDocs_(); faceIdDocs_(docs, id).forEach(function (k) { retirerDoc_(docs, k); }); } finally { lock.releaseLock(); }
  journal_(moi, 'Code réinitialisé', cfg.membres[id].nom);
  return { code: code };
}

/* ================================================================
 * 3 bis. CONNEXION PAR FACE ID (passkeys / WebAuthn)
 * Face ID ne peut pas s'exécuter dans le cadre Google : c'est la page d'accueil
 * du groupe (PARAMETRES.PORTE, l'icône sur l'écran d'accueil) qui demande Face ID au téléphone.
 * Le téléphone signe un défi avec une clé qui ne le quitte jamais ; le serveur
 * vérifie ici la signature (courbe P-256) avant d'ouvrir une session.
 * ================================================================ */
const ORIGINE_PORTE = groupe_().porte;                       // ex. https://solugis.github.io
const RP_ID = ORIGINE_PORTE.replace(/^https?:\/\//, '').replace(/:\d+$/, '');   // ex. solugis.github.io

function b64url_(octets) { return Utilities.base64Encode(octets).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function deB64url_(t) { t = String(t || '').replace(/-/g, '+').replace(/_/g, '/'); while (t.length % 4) t += '='; return Utilities.base64Decode(t); }
function octetsVersHex_(o) { return o.map(function (x) { return ('0' + ((x + 256) % 256).toString(16)).slice(-2); }).join(''); }
function texteUtf8_(o) { return Utilities.newBlob(o).getDataAsString('UTF-8'); }

/** Vérification ECDSA P-256 / SHA-256 (signature au format DER). */
function verifierP256_(xHex, yHex, messageOctets, sigDer) {
  const B = function (h) { return BigInt('0x' + h); };
  const P = B('ffffffff00000001000000000000000000000000ffffffffffffffffffffffff');
  const N = B('ffffffff00000000ffffffffffffffffbce6faada7179e84f3b9cac2fc632551');
  const A = P - BigInt(3), Bc = B('5ac635d8aa3a93e7b3ebbd55769886bc651d06b0cc53b0f63bce3c3e27d2604b');
  const G = [B('6b17d1f2e12c4247f8bce6e563a440f277037d812deb33a0f4a13945d898c296'), B('4fe342e2fe1a7f9b8ee7eb4a7c0f9e162bce33576b315ececbb6406837bf51f5')];
  const Z = BigInt(0), UN = BigInt(1), DEUX = BigInt(2);
  const mod = function (a, m) { const r = a % m; return r < Z ? r + m : r; };
  const puiss = function (b, e, m) { let r = UN; b = mod(b, m); while (e > Z) { if (e & UN) r = r * b % m; b = b * b % m; e >>= UN; } return r; };
  const inv = function (a, m) { return puiss(a, m - DEUX, m); };
  // Points en coordonnées jacobiennes [X, Y, Z] (x = X/Z², y = Y/Z³) ; null = point à l'infini
  const dbl = function (p) {
    if (!p || p[1] === Z) return null;
    const d = p[2] * p[2] % P, g = p[1] * p[1] % P, b = p[0] * g % P, a = mod(BigInt(3) * (p[0] - d) * (p[0] + d), P);
    const x = mod(a * a - BigInt(8) * b, P);
    return [x, mod(a * (BigInt(4) * b - x) - BigInt(8) * g * g, P), mod((p[1] + p[2]) * (p[1] + p[2]) - g - d, P)];
  };
  const add = function (p1, p2) {
    if (!p1) return p2; if (!p2) return p1;
    const z1 = p1[2] * p1[2] % P, z2 = p2[2] * p2[2] % P;
    const u1 = p1[0] * z2 % P, u2 = p2[0] * z1 % P, s1 = p1[1] * p2[2] % P * z2 % P, s2 = p2[1] * p1[2] % P * z1 % P;
    if (u1 === u2) return s1 === s2 ? dbl(p1) : null;
    const h = mod(u2 - u1, P), i = DEUX * h * (DEUX * h) % P, j = h * i % P, r = mod(DEUX * (s2 - s1), P), v = u1 * i % P;
    const x = mod(r * r - j - DEUX * v, P);
    return [x, mod(r * (v - x) - DEUX * s1 * j, P), mod(((p1[2] + p2[2]) * (p1[2] + p2[2]) - z1 - z2) * h, P)];
  };
  const mul = function (k, pt) { let r = null, q = pt; while (k > Z) { if (k & UN) r = add(r, q); q = dbl(q); k >>= UN; } return r; };
  // Signature DER : 30 L 02 Lr r 02 Ls s
  const s8 = sigDer.map(function (x) { return (x + 256) % 256; });
  if (s8[0] !== 0x30 || s8[2] !== 0x02) return false;
  const lr = s8[3], r = B(octetsVersHex_(sigDer.slice(4, 4 + lr)) || '0');
  if (s8[4 + lr] !== 0x02) return false;
  const ls = s8[5 + lr], s = B(octetsVersHex_(sigDer.slice(6 + lr, 6 + lr + ls)) || '0');
  if (r <= Z || r >= N || s <= Z || s >= N) return false;
  const Q = [B(xHex), B(yHex)];
  if (mod(Q[1] * Q[1] - (Q[0] * Q[0] * Q[0] + A * Q[0] + Bc), P) !== Z) return false;   // la clé doit être sur la courbe
  const e = B(octetsVersHex_(Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, messageOctets)));
  const w = inv(s, N);
  const X = add(mul(mod(e * w, N), [G[0], G[1], UN]), mul(mod(r * w, N), [Q[0], Q[1], UN]));
  if (!X) return false;
  const zi = inv(X[2], P);
  return mod(X[0] * zi % P * zi, P) % N === r;
}

/** Défi à usage unique (5 minutes) pour activer Face ID ou se connecter avec. */
function apiDefiFaceID(jeton) {
  if (!ORIGINE_PORTE) throw refus_('Face ID n’est pas disponible : ce groupe n’a pas de page d’accueil.');
  const moi = jeton ? session_(jeton) : null;
  const defi = b64url_(Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, Utilities.getUuid() + Utilities.getUuid() + Date.now()));
  CacheService.getScriptCache().put('defi:' + defi, JSON.stringify({ but: moi ? 'creation' : 'connexion', m: moi }), 300);
  return { defi: defi };
}
function consommerDefi_(clientData, type, but) {
  if (clientData.type !== type) throw refus_('Réponse Face ID invalide.');
  if (clientData.origin !== ORIGINE_PORTE) throw refus_('Face ID n’est accepté que depuis ' + ORIGINE_PORTE + '.');
  const cache = CacheService.getScriptCache(), cle = 'defi:' + clientData.challenge, v = cache.get(cle);
  if (!v) throw refus_('Demande expirée : réessayez.');
  cache.remove(cle);
  const d = JSON.parse(v);
  if (d.but !== but) throw refus_('Réponse Face ID invalide.');
  return d;
}
function faceIdDocs_(docs, m) { return Object.keys(docs).filter(function (k) { return k.indexOf('faceid/' + (m ? m + '/' : '')) === 0; }); }

/** Enregistre la clé Face ID de cet appareil pour le membre connecté. */
function apiEnregistrerFaceID(jeton, d) {
  const moi = session_(jeton);
  d = d || {};
  const cd = JSON.parse(texteUtf8_(deB64url_(d.clientDataJSON)));
  const info = consommerDefi_(cd, 'webauthn.create', 'creation');
  if (info.m !== moi) throw refus_('Réponse Face ID invalide.');
  if (+d.alg !== -7) throw refus_('Ce téléphone propose un type de clé non pris en charge.');
  const x = String(d.x || '').toLowerCase(), y = String(d.y || '').toLowerCase(), id = String(d.id || '');
  if (!/^[0-9a-f]{64}$/.test(x) || !/^[0-9a-f]{64}$/.test(y) || !/^[\w-]{16,400}$/.test(id)) throw refus_('Clé Face ID illisible.');
  const lock = LockService.getScriptLock(); lock.waitLock(20000);
  try {
    const docs = lireDocs_();
    const cle = 'faceid/' + moi + '/' + octetsVersHex_(Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, id)).slice(0, 32);
    if (!docs[cle] && faceIdDocs_(docs, moi).length >= 6) throw refus_('Six appareils au plus : retirez-en un dans Mon espace.');
    poserDoc_(docs, cle, { id: id, x: x, y: y, compteur: 0, appareil: txt_(d.appareil, 60) || 'Appareil', cree: new Date().toISOString(), dernier: null }, moi);
    SpreadsheetApp.flush();
  } finally { lock.releaseLock(); }
  journal_(moi, 'Face ID activé', txt_(d.appareil, 60));
  return apiEtat(jeton);
}

/** Connexion avec Face ID : vérifie la signature du téléphone, puis ouvre une session comme avec le code. */
function apiConnexionFaceID(d) {
  d = d || {};
  const cache = CacheService.getScriptCache(), g = Number(cache.get('echecs:tous') || 0);
  if (g >= 40) throw refus_('Trop d’essais. Réessayez dans 15 minutes.');
  const echec = function (msg) { cache.put('echecs:tous', String(g + 1), 900); return refus_(msg); };
  const cdOctets = deB64url_(d.clientDataJSON), ad = deB64url_(d.authenticatorData), sig = deB64url_(d.signature);
  const cd = JSON.parse(texteUtf8_(cdOctets));
  consommerDefi_(cd, 'webauthn.get', 'connexion');
  const docs = lireDocs_();
  const cle = faceIdDocs_(docs).filter(function (k) { return docs[k].data.id === String(d.id || ''); })[0];
  if (!cle) throw echec('Face ID n’est plus activé pour cet appareil : connectez-vous avec votre code, puis réactivez-le dans Mon espace.');
  const cred = docs[cle].data, membre = cle.split('/')[1];
  // Données de l'authentificateur : empreinte du domaine (32 octets), indicateurs, compteur
  const rp = octetsVersHex_(Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, RP_ID));
  if (octetsVersHex_(ad.slice(0, 32)) !== rp) throw echec('Réponse Face ID invalide.');
  const drapeaux = (ad[32] + 256) % 256;
  if (!(drapeaux & 0x01) || !(drapeaux & 0x04)) throw echec('Face ID n’a pas confirmé votre identité.');
  const compteur = ad.slice(33, 37).reduce(function (s, x) { return s * 256 + (x + 256) % 256; }, 0);
  if (compteur && cred.compteur && compteur <= cred.compteur) throw echec('Clé Face ID suspecte : connectez-vous avec votre code.');
  const message = ad.concat(Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, cdOctets));
  if (!verifierP256_(cred.x, cred.y, message, sig)) throw echec('Signature Face ID invalide.');
  const lock = LockService.getScriptLock(); lock.waitLock(20000);
  try { const d2 = lireDocs_(); if (d2[cle]) { const v = d2[cle].data; v.compteur = compteur; v.dernier = new Date().toISOString(); poserDoc_(d2, cle, v, membre); } } finally { lock.releaseLock(); }
  journal_(membre, 'Connexion (Face ID)', cred.appareil || '');
  return creerSession_(membre);
}

/** Retire un appareil Face ID du membre connecté. */
function apiRetirerFaceID(jeton, cle) {
  const moi = session_(jeton);
  const lock = LockService.getScriptLock(); lock.waitLock(20000);
  try {
    const docs = lireDocs_();
    if (String(cle || '').indexOf('faceid/' + moi + '/') !== 0 || !docs[cle]) throw refus_('Appareil introuvable.');
    retirerDoc_(docs, cle);
  } finally { lock.releaseLock(); }
  journal_(moi, 'Face ID retiré', '');
  return apiEtat(jeton);
}

/* ================================================================
 * 4. DONNÉES : un document JSON par ligne de l'onglet « Données »
 * ================================================================ */
let SS_CACHE = null;
function ss_() {
  const id = PropertiesService.getScriptProperties().getProperty('SS_ID');
  if (!id) throw new Error("L'application n'est pas encore installée : exécutez installer().");
  if (!SS_CACHE || SS_CACHE.getId() !== id) SS_CACHE = SpreadsheetApp.openById(id);
  return SS_CACHE;
}
function lireDocs_() {
  const sh = ss_().getSheetByName(F_DONNEES);
  const n = sh.getLastRow();
  const docs = {};
  if (n < 2) return docs;
  sh.getRange(2, 1, n - 1, 4).getValues().forEach(function (r, i) {
    if (!r[0]) return;
    try { docs[String(r[0])] = { ligne: i + 2, data: JSON.parse(r[3] || '{}') }; } catch (e) {}
  });
  return docs;
}
/** Lecture seule (ouverture, actualisation) : les documents sont gardés 10 minutes en mémoire, en morceaux de 90 000 caractères.
 *  Chaque écriture change la « version », ce qui écarte aussitôt l'ancienne copie. Les écritures relisent toujours le classeur. */
const MEMO_MORCEAU_ = 90000, MEMO_DUREE_ = 600;
function versionMemo_(cache) {
  let v = cache.get('docs:v');
  if (!v) { v = String(Date.now()) + Math.random().toString(36).slice(2, 6); cache.put('docs:v', v, 21600); }
  return PropertiesService.getScriptProperties().getProperty('SS_ID') + ':' + v;
}
function oublierMemo_() { try { CacheService.getScriptCache().put('docs:v', String(Date.now()) + Math.random().toString(36).slice(2, 6), 21600); } catch (e) {} }
function lireDocsRapide_() {
  try {
    const cache = CacheService.getScriptCache(), v = versionMemo_(cache);
    const tete = cache.get('docs:' + v + ':n');
    if (tete) {
      const n = Number(tete), cles = [];
      for (let i = 0; i < n; i++) cles.push('docs:' + v + ':' + i);
      const parts = cache.getAll(cles);
      if (cles.every(function (k) { return parts[k] != null; })) return JSON.parse(cles.map(function (k) { return parts[k]; }).join(''));
    }
    const docs = lireDocs_(), json = JSON.stringify(docs);
    if (json.length < 40 * MEMO_MORCEAU_) {
      const o = {}, n = Math.ceil(json.length / MEMO_MORCEAU_);
      for (let i = 0; i < n; i++) o['docs:' + v + ':' + i] = json.slice(i * MEMO_MORCEAU_, (i + 1) * MEMO_MORCEAU_);
      cache.putAll(o, MEMO_DUREE_); cache.put('docs:' + v + ':n', String(n), MEMO_DUREE_);
    }
    return docs;
  } catch (e) { Logger.log(e); return lireDocs_(); }
}
function poserDoc_(docs, chemin, data, membre) {
  const sh = ss_().getSheetByName(F_DONNEES);
  const json = JSON.stringify(data);
  if (json.length > 49000) throw refus_('Contenu trop volumineux (photo trop lourde ?).');
  oublierMemo_();
  const maintenant = new Date();
  if (docs[chemin]) { sh.getRange(docs[chemin].ligne, 4, 1, 3).setValues([[json, sh.getRange(docs[chemin].ligne, 5).getValue(), maintenant]]); docs[chemin].data = data; }
  else { sh.appendRow([chemin, chemin.split('/')[0], membre || '', json, maintenant, maintenant]); docs[chemin] = { ligne: sh.getLastRow(), data: data }; }
}
function retirerDoc_(docs, chemin) {
  if (!docs[chemin]) return;
  const l = docs[chemin].ligne;
  oublierMemo_();
  ss_().getSheetByName(F_DONNEES).deleteRow(l);
  delete docs[chemin];
  Object.keys(docs).forEach(function (k) { if (docs[k].ligne > l) docs[k].ligne--; });   // les lignes suivantes remontent d'un cran
}

/** Assemble les documents dans la forme attendue par l'application. */
function etat_(docs, moi) {
  const S = { config: null, charte: null, appels: {}, profils: {}, enfants: {}, contenus: {}, voeux: {}, bulletins: {}, tres: {}, ecritures: {}, bilans: {}, prefs: null };
  Object.keys(docs).forEach(function (chemin) {
    const s = chemin.split('/'), v = docs[chemin].data;
    const sous = function (o, k) { return o[k] = o[k] || {}; };
    switch (s[0]) {
      case 'config': if (s[1] === 'app') S.config = v; else if (s[1] === 'charte') S.charte = v; break;
      case 'profils': if (s.length === 2) S.profils[s[1]] = v; else if (s[2] === 'enfants') sous(S.enfants, s[1])[s[3]] = v; break;
      case 'contenus': sous(S.contenus, s[1])[s[3]] = v; break;
      case 'voeux': { const o = S.voeux[s[1]] = S.voeux[s[1]] || { messages: {}, reactions: {} }; if (s[2] === 'messages') o.messages[s[3]] = v; else if (s[2] === 'reactions') o.reactions[s[3]] = v.e; break; }
      case 'bulletins': { const o = S.bulletins[s[1]] = S.bulletins[s[1]] || { votes: {} }; o.votes[s[3]] = v; break; }
      case 'tresorerie': if (s.length === 2) S.tres[s[1]] = v; else if (s[2] === 'ecritures') sous(S.ecritures, s[1])[s[3]] = v; else if (s[2] === 'bilans') sous(S.bilans, s[1])[s[3]] = v; break;
      case 'prefs': if (s[1] === moi) S.prefs = v; break;
      case 'appels': if (s.length === 2) S.appels[s[1]] = v; break;
    }
  });
  const cfg = JSON.parse(JSON.stringify(S.config));
  const admin = cfg.admins.indexOf(moi) >= 0;
  if (!admin) cfg.ordre.forEach(function (id) { delete cfg.membres[id].email; });
  const G = groupe_();
  cfg.groupe = { nom: G.nom, type: G.type, sigle: G.sigle, tresorier: G.tresorier };
  S.config = cfg;
  S.licence = etatLicence_();
  S.moi = moi;
  S.admin = admin;
  S.emailConnu = !!emailDe_(docs, moi);
  S.maintenant = new Date().toISOString();
  S.urlClasseur = admin ? ss_().getUrl() : null;
  return S;
}

function apiEtat(jeton, opts) {
  const moi = session_(jeton);
  if (opts && opts.ouverture) noterActivite_(moi);
  const props = PropertiesService.getScriptProperties();
  const docs = lireDocsRapide_();
  const S = etat_(docs, moi);
  S.codesRecus = codesRecus_(docs, moi);
  S.faceid = faceIdDocs_(docs, moi).map(function (k) { const v = docs[k].data; return { cle: k, appareil: v.appareil, cree: v.cree, dernier: v.dernier }; });
  S.doitChanger = props.getProperty('changer:' + moi) === '1';
  return S;
}

function apiEcrire(jeton, opId, chemin, op, data) {
  const moi = session_(jeton);
  if (String(chemin || '').indexOf('prefs/') !== 0) exigerActif_();   // en mode consultation, seules les préférences restent modifiables
  const cache = CacheService.getScriptCache();
  if (opId && cache.get('op:' + opId)) return apiEtat(jeton);   // même opération déjà enregistrée (nouvel essai après coupure)
  const lock = LockService.getScriptLock();
  lock.waitLock(20000);
  let effets = [];
  try {
    if (!(opId && cache.get('op:' + opId))) {   // sinon, le premier essai a abouti pendant l'attente du verrou
      const docs = lireDocs_();
      effets = appliquer_(docs, moi, String(chemin || ''), op, data || {});
      SpreadsheetApp.flush();
      if (opId) cache.put('op:' + opId, '1', 21600);
    }
  } finally { lock.releaseLock(); }
  effets.forEach(function (f) { try { f(); } catch (e) { Logger.log(e); } });

}

/* ================================================================
 * 4 bis. LICENCE (conditions générales d'abonnement, article 11)
 * L'abonnement est vérifié une fois par jour dans le fichier des licences publié par SoluGis.
 * Si la vérification échoue (réseau, fichier absent), l'application continue de fonctionner :
 * seul un abonnement connu comme non payé depuis plus de 60 jours la fait passer en mode consultation.
 * ================================================================ */
const MSG_CONSULTATION = 'L’application est en mode consultation : l’abonnement du groupe est suspendu. Tout reste consultable et exportable ; l’administrateur peut réactiver l’abonnement auprès de SoluGis.';
function verifierLicence_() {
  const L = PARAMETRES.LICENCE || {};
  if (L.TYPE === 'definitive' || !L.URL || !L.ID) return null;
  let rep;
  try { rep = UrlFetchApp.fetch(L.URL + (L.URL.indexOf('?') >= 0 ? '&' : '?') + 't=' + Date.now(), { muteHttpExceptions: true, followRedirects: true }); } catch (e) { return null; }
  if (rep.getResponseCode() !== 200) return null;
  let j = null;
  try { j = JSON.parse(rep.getContentText()); } catch (e) { return null; }
  const c = j && j.clients && j.clients[L.ID];
  if (!c) return null;   // groupe absent du fichier : on garde le dernier état connu
  const etat = { type: c.type === 'definitive' ? 'definitive' : 'abonnement', payeJusqua: estDate_(c.payeJusqua) ? c.payeJusqua : null, verifieLe: Date.now() };
  PropertiesService.getScriptProperties().setProperty('LICENCE', JSON.stringify(etat));
  return etat;
}
/** actif : tout fonctionne · grace : tout fonctionne, rappel à l'administrateur · consultation : lecture et export seulement. */
function etatLicence_() {
  if (groupe_().licence === 'definitive') return { mode: 'actif', type: 'definitive' };
  let e = null;
  try { e = JSON.parse(PropertiesService.getScriptProperties().getProperty('LICENCE') || 'null'); } catch (x) { e = null; }
  if (!e || e.type === 'definitive' || !e.payeJusqua) return { mode: 'actif', type: e ? e.type : 'abonnement' };
  if (Date.now() - e.verifieLe > 90 * 864e5) return { mode: 'actif', type: e.type };   // plus de nouvelles de SoluGis depuis 90 jours : l'application reste ouverte
  const t = aujourdhui_();
  const finGrace = Utilities.formatDate(new Date(Date.parse(e.payeJusqua + 'T12:00:00Z') + CONFIG.JOURS_GRACE * 864e5), 'UTC', 'yyyy-MM-dd');
  return { mode: t <= e.payeJusqua ? 'actif' : t <= finGrace ? 'grace' : 'consultation', type: 'abonnement', payeJusqua: e.payeJusqua, finGrace: finGrace };
}
function exigerActif_() { if (etatLicence_().mode === 'consultation') throw refus_(MSG_CONSULTATION); }

/* ================================================================
 * 4 ter. MEMBRES : arrivées, départs, administrateurs (réservé à l'administrateur)

}
function apiMembres(jeton, action, d) {
  const moi = session_(jeton);

  let res = {};

    const docs = lireDocs_(), cfg = JSON.parse(JSON.stringify(docs['config/app'].data));

    const props = PropertiesService.getScriptProperties();
    const mois = function (v) { return /^\d{4}-\d{2}$/.test(String(v || '')) ? String(v) : null; };
    const plein = function () { if (actifs_(cfg).length >= G.maxMembres) throw refus_('Le groupe compte déjà ' + G.maxMembres + ' membres : contactez SoluGis pour aller au-delà.'); };
    const nouveauCode = function (id) { const code = codeAleatoire_(); props.setProperty('code:' + id, hacher_(code)); props.setProperty('changer:' + id, '1'); return code; };
    const id = String(d.id || ''), m = cfg.membres[id];
    if (action === 'ajouter') {

      if (!nom) throw refus_('Indiquez le nom du membre.');
      plein();
      if (actifs_(cfg).some(function (k) { return cfg.membres[k].nom.toLowerCase() === nom.toLowerCase(); })) throw refus_('Un membre porte déjà ce nom.');
      const nid = 'm' + (Math.max.apply(null, cfg.ordre.map(function (k) { return +k.slice(1) || 0; })) + 1);
      cfg.ordre.push(nid);
      cfg.membres[nid] = nouveauMembre_(nid, nom, /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email) ? email : '', mois(d.entree));
      res = { id: nid, code: nouveauCode(nid) };
      journal_(moi, 'Membre ajouté', nom);
    } else if (action === 'modifier') {
      if (!m) throw refus_('Membre inconnu.');

      if ('entree' in d) m.entree = mois(d.entree);

      const tres = (cfg.tresoriers || []).filter(function (t) { return !t.au; })[0];
      if (tres && tres.membre === id) throw refus_('Désignez d’abord une autre personne à la trésorerie.');
      if (cfg.admins.length === 1 && cfg.admins[0] === id) throw refus_('Désignez d’abord un autre administrateur.');

      else {

    poserDoc_(docs, 'config/app', cfg, moi);
    SpreadsheetApp.flush();
  } finally { lock.releaseLock(); }
  NOMS_CACHE = null;
  const etat = apiEtat(jeton);
  etat.resultat = res;
  return etat;
}

/* ================================================================
 * 5. RÈGLES : qui peut écrire quoi (contrôlé ici, côté serveur)

function appliquer_(docs, moi, chemin, op, data) {

  const effets = [];
  const exiger = function (cond, msg) { if (!cond) throw refus_(msg); };

  if (s[0] === 'config') {
    exiger(admin && (chemin === 'config/app' || chemin === 'config/charte') && op === 'set', 'Réservé à l’administrateur.');

      exiger(ch.texte || ch.resume.length, 'Collez le texte de la charte ou ses points clés.');

      d.droitVote = src.droitVote !== false;
      d.motifVote = d.droitVote ? '' : txt_(src.motifVote, 200);
      d.uid = id;
    });
    r.tresoriers = (n.tresoriers || []).filter(function (t) { return r.membres[t.membre] && estDate_(t.du); })
      .map(function (t) { return { membre: t.membre, uid: t.membre, du: t.du, au: estDate_(t.au) ? t.au : null, titre: t.titre === 'trésorière' ? 'trésorière' : t.titre === 'trésorier' ? 'trésorier' : groupe_().tresorier }; });
    exiger(r.tresoriers.filter(function (t) { return !t.au; }).length <= 1, 'Une seule personne à la trésorerie à la fois.');
    r.tresoriers.forEach(function (t) { if (!t.au) exiger(!r.membres[t.membre].sortie, 'Ce membre a quitté le groupe.'); });

    const dr = n.droits || {}; r.droits = {};
    ['nouvelles', 'agenda', 'votes', 'projets'].forEach(function (k) { r.droits[k] = dr[k] === 'admin' ? 'admin' : 'tous'; });
    r.reglagesVote = { modification: !!(n.reglagesVote || {}).modification, choixVisibles: !!(n.reglagesVote || {}).choixVisibles };
    const fi = n.finances || {};
    r.finances = { montant: Math.max(1, Math.round(+fi.montant || 10000)), jour: Math.min(28, Math.max(1, Math.round(+fi.jour || 15))) };
    const rp = n.rappels || {};

    r.journalVote = (n.journalVote || []).slice(0, 500);
    exiger(r.journalVote.length >= (cfg.journalVote || []).length, 'Le journal des décisions ne peut pas être effacé.');

    const MCf = moteurCalcul(), avant = MCf.listeFonds(cfg), ecr = Object.keys(docs).filter(function (k) { return /^tresorerie\/[^/]+\/ecritures\//.test(k); }).map(function (k) { return docs[k].data; });
    const nf = (Array.isArray(n.fonds) && n.fonds.length ? n.fonds : avant).slice(0, 12).map(function (f, i) { return { id: /^[a-z0-9-]{2,30}$/.test(String(f.id || '')) ? String(f.id) : 'fonds-' + (i + 1), nom: txt_(f.nom, 60) || 'Fonds ' + (i + 1), capital: !!f.capital }; });

    const utilises = {}; ecr.forEach(function (e) { Object.keys(e.fonds && typeof e.fonds === 'object' ? e.fonds : {}).forEach(function (k) { utilises[k] = 1; }); if (typeof e.fonds === 'string') utilises[e.fonds] = 1; if (e.de) utilises[e.de] = 1; if (e.vers) utilises[e.vers] = 1; });

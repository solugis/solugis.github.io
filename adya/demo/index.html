    r.seuilCharte = ['2/3', '3/4', 'majorite', 'unanimite', 'aucun'].indexOf(n.seuilCharte) >= 0 ? n.seuilCharte : (cfg.seuilCharte || '2/3');
    delete r.groupe;   // le nom et le type du groupe viennent des paramètres d'installation
    poserDoc_(docs, chemin, r, moi);
    if (r.rappels.heure !== (cfg.rappels || {}).heure) effets.push(function () { reprogrammer_(r.rappels.heure); });
    journal_(moi, 'Réglages modifiés', '');
    return effets;
  }

  if (s[0] === 'appels') {
    // Cotisations exceptionnelles (funérailles, mariage…) : lancées par l'administrateur ou la trésorerie.
    const tres = (cfg.tresoriers || []).filter(function (t) { return !t.au; })[0];
    exiger(admin || (tres && tres.membre === moi), 'Réservé à l’administrateur et à la trésorerie.');
    exiger(s.length === 2, 'Chemin invalide.');
    const ancien = docs[chemin] ? docs[chemin].data : null;
    const lies = Object.keys(docs).filter(function (k) { return /^tresorerie\/[^/]+\/ecritures\//.test(k) && docs[k].data.appel === s[1]; });
    if (op === 'delete') { exiger(ancien && !lies.length, 'Des versements sont déjà enregistrés : clôturez la cotisation au lieu de la supprimer.'); retirerDoc_(docs, chemin); journal_(moi, 'Cotisation exceptionnelle supprimée', ancien.titre); return effets; }
    const mode = data.mode === 'libre' ? 'libre' : 'fixe';
    const a = { titre: txt_(data.titre, 120), description: txt_(data.description, 1000), mode: ancien ? ancien.mode : mode,
      montant: ancien ? ancien.montant : (mode === 'fixe' ? Math.round(+data.montant || 0) : 0), minimum: ancien ? ancien.minimum : (mode === 'libre' ? Math.max(0, Math.round(+data.minimum || 0)) : 0),
      objectif: Math.max(0, Math.round(+data.objectif || 0)), dateLimite: estDate_(data.dateLimite) ? data.dateLimite : null,
      exclus: (Array.isArray(data.exclus) ? data.exclus : []).filter(function (m) { return cfg.membres[m]; }).slice(0, 200),
      fonds: ancien ? ancien.fonds || null : (moteurCalcul().listeFonds(cfg).some(function (f) { return f.id === data.fonds; }) ? data.fonds : null),
      creeLe: ancien ? ancien.creeLe : maintenant, creePar: ancien ? ancien.creePar : moi, clos: data.clos ? (ancien && ancien.clos) || aujourdhui_() : null };
    exiger(a.titre, 'Indiquez l’objet de la cotisation (ex. Funérailles de…).');
    exiger(a.mode === 'libre' || a.montant > 0, 'Indiquez le montant demandé à chaque membre.');
    poserDoc_(docs, chemin, a, moi);
    journal_(moi, ancien ? (a.clos && !ancien.clos ? 'Cotisation exceptionnelle close' : 'Cotisation exceptionnelle modifiée') : 'Cotisation exceptionnelle lancée', a.titre);
    if (!ancien) effets.push(function () { notifier_('appels', 'Cotisation exceptionnelle : ' + a.titre, 'Une cotisation exceptionnelle est ouverte : « ' + a.titre + ' ».\n' + (a.mode === 'fixe' ? 'Montant demandé à chaque membre : ' + moteurCalcul().enLettres(a.montant) + ' francs CFA (' + a.montant + ' FCFA).' : 'Participation libre' + (a.minimum ? ', à partir de ' + a.minimum + ' FCFA.' : '.')) + (a.dateLimite ? '\nDate limite : ' + a.dateLimite.split('-').reverse().join('/') + '.' : '') + (a.description ? '\n\n' + a.description : '')); });
    return effets;
  }

  exiger(proprio === moi, 'Vous ne pouvez modifier que vos propres informations.');

  if (s[0] === 'prefs') {
    exiger(s.length === 2 && op === 'set', 'Chemin invalide.');
    const c = data.cats || {}, cats = {};
    ['anniv', 'agenda', 'bilan', 'cotis', 'appels', 'votes', 'nouv', 'voeux', 'projets', 'recus'].forEach(function (k) { cats[k] = c[k] !== false; });
    const vus = {};
    ['famille', 'projets', 'cotisations', 'espace'].forEach(function (k) { const v = txt_((data.vus || {})[k], 30); if (v) vus[k] = v; });
    poserDoc_(docs, chemin, { toutes: data.toutes !== false, cats: cats, vuLe: txt_(data.vuLe, 30) || null, vus: vus, email: txt_(data.email, 120), emailActif: !!data.emailActif }, moi);
    return effets;
  }

  if (s[0] === 'profils') {
    if (s.length === 2) {
      exiger(op === 'set', 'Opération invalide.');
      poserDoc_(docs, chemin, { nom: txt_(data.nom, 60), presentation: txt_(data.presentation, 600), anniv: anniv_(data.anniv), photo: photo_(data.photo), majLe: maintenant }, moi);
      return effets;
    }
    exiger(s[2] === 'enfants' && s.length === 4, 'Chemin invalide.');
    if (op === 'delete') { retirerDoc_(docs, chemin); journal_(moi, 'Fiche enfant supprimée', ''); return effets; }
    exiger(txt_(data.prenom, 60), 'Indiquez le prénom.');
    poserDoc_(docs, chemin, { prenom: txt_(data.prenom, 60), anniv: anniv_(data.anniv), presentation: txt_(data.presentation, 600), photo: photo_(data.photo), majLe: maintenant }, moi);
    return effets;
  }

  if (s[0] === 'contenus') {
    exiger(s[2] === 'items' && s.length === 4, 'Chemin invalide.');
    const ancien = docs[chemin] ? docs[chemin].data : null;
    if (op === 'delete') {
      if (ancien && ancien.type === 'vote') exiger(!Object.keys(docs).some(function (k) { return /^bulletins\/[^/]+\/votes\//.test(k) && k.split('/')[3] === moi + '~' + s[3]; }), 'Un vote qui a déjà reçu des voix ne peut pas être supprimé.');
      retirerDoc_(docs, chemin); if (ancien) pjRattacher_(docs, moi, chemin, [], ancien.pj, effets); journal_(moi, 'Suppression', chemin); return effets;
    }
    const type = ancien ? ancien.type : data.type;
    exiger(['nouvelle', 'evenement', 'vote', 'projet'].indexOf(type) >= 0, 'Type inconnu.');
    const droitKey = { nouvelle: 'nouvelles', evenement: 'agenda', vote: 'votes', projet: 'projets' }[type];
    if (!ancien) exiger((cfg.droits || {})[droitKey] !== 'admin' || admin, 'Publication réservée à l’administrateur.');
    let v;
    if (type === 'nouvelle') { exiger(!ancien, 'Modification impossible.'); v = { type: type, genre: ['nouvelle', 'annonce', 'information', 'voeux'].indexOf(data.genre) >= 0 ? data.genre : 'nouvelle', titre: txt_(data.titre, 120), texte: txt_(data.texte, 4000), pj: pjPublication_(docs, moi, chemin, data.pj) }; exiger(v.titre && v.texte, 'Titre et message obligatoires.'); }
    else if (type === 'evenement') { exiger(!ancien, 'Modification impossible.'); v = { type: type, titre: txt_(data.titre, 120), date: data.date, heure: /^\d{2}:\d{2}$/.test(data.heure || '') ? data.heure : '', lieu: txt_(data.lieu, 160), description: txt_(data.description, 1000) }; exiger(v.titre && estDate_(v.date), 'Titre et date obligatoires.'); }
    else if (type === 'vote') {
      exiger(!ancien, 'Un vote ouvert ne peut plus être modifié.');
      let cl = null;
      if (data.cloture) { cl = new Date(data.cloture); exiger(!isNaN(cl) && cl.getTime() > Date.now(), 'La clôture doit être dans le futur.'); cl = cl.toISOString(); }
      v = { type: type, titre: txt_(data.titre, 160), description: txt_(data.description, 2000), categorie: ['ordinaire', 'pret', 'investissement', 'statuts', 'autre'].indexOf(data.categorie) >= 0 ? data.categorie : 'autre', cloture: cl };
      exiger(v.titre, 'Indiquez la question soumise au vote.');
      effets.push(function () { notifier_('votes', 'Nouveau vote : ' + v.titre, 'Un vote est ouvert dans Adya : « ' + v.titre + ' ».' + (cl ? '\nClôture : ' + Utilities.formatDate(new Date(cl), CONFIG.FUSEAU, 'dd/MM/yyyy à HH:mm') + ' (heure d’Abidjan).' : '\nSans date limite.')); });
    }
    else {
      const et = (data.etapes || []).slice(0, 40).map(function (e) { return { id: txt_(e.id, 40), nom: txt_(e.nom, 120), poids: Math.max(1, Math.round(+e.poids || 1)), faiteLe: estDate_(e.faiteLe) ? e.faiteLe : null, validePar: e.faiteLe ? (e.validePar || moi) : null }; });
      v = { type: type, titre: txt_(data.titre, 140), description: txt_(data.description, 2000), responsable: cfg.membres[data.responsable] ? data.responsable : moi, provenance: ['plateforme', 'whatsapp', 'assemblee', 'autre'].indexOf(data.provenance) >= 0 ? data.provenance : 'autre', dateDecision: estDate_(data.dateDecision) ? data.dateDecision : aujourdhui_(), mode: et.length ? 'etapes' : 'valide', etapes: et, valide: data.valide ? { pct: Math.max(0, Math.min(100, Math.round(+data.valide.pct || 0))), le: estDate_(data.valide.le) ? data.valide.le : aujourdhui_(), par: moi } : null, journal: (data.journal || []).slice(0, 300).map(function (j) { return { le: estDate_(j.le) ? j.le : aujourdhui_(), texte: txt_(j.texte, 300) }; }), pj: pjPublication_(docs, moi, chemin, data.pj) };
      exiger(v.titre, 'Indiquez le nom du projet.');
      if (ancien) exiger(v.journal.length >= (ancien.journal || []).length, 'L’historique du projet ne peut pas être effacé.');
    }
    v.creeLe = ancien ? ancien.creeLe : maintenant;
    if (ancien) v.majLe = maintenant;
    poserDoc_(docs, chemin, v, moi);
    if (v.pj) pjRattacher_(docs, moi, chemin, v.pj, ancien ? ancien.pj : [], effets);
    journal_(moi, ancien ? 'Mise à jour' : 'Publication', type + ' : ' + (v.titre || ''));
    return effets;
  }

  if (s[0] === 'voeux') {
    exiger(s.length === 4 && (s[2] === 'messages' || s[2] === 'reactions'), 'Chemin invalide.');
    if (op === 'delete') { const anc = docs[chemin] ? docs[chemin].data : null; retirerDoc_(docs, chemin); if (anc && anc.pj) pjRattacher_(docs, moi, chemin, [], anc.pj, effets); return effets; }
    if (s[2] === 'reactions') { exiger(['❤️', '🎉', '🥳', '🙏', '😍'].indexOf(data.e) >= 0, 'Réaction inconnue.'); poserDoc_(docs, chemin, { e: data.e, le: maintenant }, moi); return effets; }
    exiger(!docs[chemin], 'Ce message existe déjà.');
    const m = { cible: txt_(data.cible, 120), annee: Math.round(+data.annee) || new Date().getFullYear(), texte: txt_(data.texte, 2000), le: maintenant };
    if (data.recuDe) m.recuDe = txt_(data.recuDe, 80);
    exiger(m.texte && /^(m:m\d+|e:m\d+:[\w-]+)$/.test(m.cible), 'Message invalide.');
    m.pj = pjPublication_(docs, moi, chemin, data.pj);
    poserDoc_(docs, chemin, m, moi);
    pjRattacher_(docs, moi, chemin, m.pj, [], effets);
    return effets;
  }

  if (s[0] === 'bulletins') {
    exiger(s.length === 4 && s[2] === 'votes' && op === 'set', 'Chemin invalide.');
    const k = s[3], i = k.lastIndexOf('~');
    const vote = docs['contenus/' + k.slice(0, i) + '/items/' + k.slice(i + 1)];
    exiger(vote && vote.data.type === 'vote', 'Ce vote n’existe plus.');
    exiger(!vote.data.cloture || Date.now() < new Date(vote.data.cloture).getTime(), 'Vote clos : votre choix n’a pas été enregistré.');
    exiger(cfg.membres[moi].droitVote !== false && !cfg.membres[moi].sortie, 'Votre droit de vote est suspendu.');
    exiger(!docs[chemin] || (cfg.reglagesVote || {}).modification, 'Vous avez déjà voté.');
    exiger(['pour', 'contre', 'abstention'].indexOf(data.choix) >= 0, 'Choix invalide.');
    poserDoc_(docs, chemin, { choix: data.choix, le: maintenant }, moi);
    journal_(moi, 'Vote', vote.data.titre);
    return effets;
  }

  if (s[0] === 'tresorerie') {
    const actuelle = (cfg.tresoriers || []).filter(function (t) { return !t.au; })[0];
    exiger(actuelle && actuelle.membre === moi, 'Réservé à la personne désignée à la trésorerie.');
    exiger(op === 'set', 'Une écriture ne s’efface pas : enregistrez une correction.');
    if (s.length === 2) {
      exiger(/^\d{4}-\d{2}$/.test(data.debutSuivi || ''), 'Mois invalide.');
      poserDoc_(docs, chemin, { debutSuivi: data.debutSuivi, majLe: maintenant }, moi);
      journal_(moi, 'Début du suivi', data.debutSuivi);
      effets.push(exporterRegistre_);
      return effets;
    }
    if (s[2] === 'ecritures') {
      if (docs[chemin]) return effets;   // déjà enregistrée (nouvel essai)
      const t = data.type, e = { type: t, saisiLe: maintenant, par: moi };
      const montant = Math.round(+data.montant);
      if (t === 'annulation') {
        const cible = Object.keys(docs).filter(function (k) { return /^tresorerie\/[^/]+\/ecritures\//.test(k) && k.split('/')[3] === data.cible; })[0];
        exiger(cible && docs[cible].data.type !== 'annulation', 'Écriture introuvable.');
        exiger(!Object.keys(docs).some(function (k) { return /^tresorerie\/[^/]+\/ecritures\//.test(k) && docs[k].data.type === 'annulation' && docs[k].data.cible === data.cible; }), 'Cette écriture est déjà annulée.');
        e.cible = data.cible; e.motif = txt_(data.motif, 200); e.date = aujourdhui_();
        exiger(e.motif, 'Indiquez le motif de la correction.');
      } else {
        exiger(estDate_(data.date) && data.date <= aujourdhui_(), 'Date invalide ou future.');
        e.date = data.date;
        if (t === 'versement') {
          const rub = ['mensuelle', 'adhesion', 'appel', 'don'].indexOf(data.rubrique) >= 0 ? data.rubrique : 'mensuelle';
          exiger(montant > 0, 'Montant invalide.');
          if (rub === 'don' && !data.membre) { e.donateur = txt_(data.donateur, 80); exiger(e.donateur, 'Indiquez le nom du donateur.'); }
          else exiger(cfg.membres[data.membre], 'Membre invalide.');
          const aff = {}; let somme = 0;
          if (rub === 'mensuelle') {
            Object.keys(data.affectations || {}).forEach(function (k) { const x = Math.round(+data.affectations[k]); if (/^\d{4}-\d{2}$/.test(k) && x > 0) { aff[k] = x; somme += x; } });
            exiger(somme === montant, 'L’affectation ne correspond pas au montant.');
          } else {
            e.rubrique = rub;
            if (rub === 'appel') {
              const ap = docs['appels/' + txt_(data.appel, 60)];
              exiger(ap, 'Cotisation exceptionnelle introuvable.');
              exiger(!ap.data.clos, 'Cette cotisation exceptionnelle est close.');
              e.appel = txt_(data.appel, 60);
            }
            if (rub === 'don') e.objet = txt_(data.objet, 120);
          }
          e.rubrique = rub === 'mensuelle' ? undefined : rub;
          e.membre = data.membre && cfg.membres[data.membre] ? data.membre : null; e.montant = montant; e.moyen = moteurCalcul().MOYEN[data.moyen] ? data.moyen : 'autre'; e.affectations = aff; e.note = txt_(data.note, 200);
          if (txt_(data.reference, 60)) e.reference = txt_(data.reference, 60);
          if (rub === 'mensuelle') delete e.rubrique;
          const Pf = parametresFonds_(docs, cfg);
          if (rub === 'don' && data.fondsChoisi) exiger(Pf.fonds.some(function (f) { return f.id === data.fondsChoisi; }), 'Fonds inconnu.');
          e.fonds = moteurCalcul().repartir(Pf, { rubrique: rub, montant: montant, affectations: aff, appel: e.appel, fondsChoisi: rub === 'don' ? data.fondsChoisi || null : null });
          if (s[3].indexOf('imp-') !== 0) effets.push(function () { envoyerRecu_(s[3]); });
        } else if (t === 'mouvement') {
          exiger(montant > 0, 'Montant invalide.');
          e.sens = data.sens === 'entree' ? 'entree' : 'sortie'; e.categorie = ['pret', 'remboursement', 'investissement', 'gain', 'frais', 'aide', 'autre'].indexOf(data.categorie) >= 0 ? data.categorie : 'autre'; e.montant = montant; e.libelle = txt_(data.libelle, 200);
          exiger(e.libelle, 'Indiquez le libellé.');
          if (data.appel) { exiger(docs['appels/' + txt_(data.appel, 60)], 'Cotisation exceptionnelle introuvable.'); e.appel = txt_(data.appel, 60); }
          const Pm = parametresFonds_(docs, cfg);
          e.fonds = Pm.fonds.some(function (f) { return f.id === data.fonds; }) ? data.fonds
            : e.appel ? docs['appels/' + e.appel].data.fonds || Pm.repartition.appel.principal
            : e.categorie === 'aide' ? Pm.repartition.appel.principal : Pm.capital;
        } else if (t === 'virement') {
          const Pv = parametresFonds_(docs, cfg), ok = function (id) { return Pv.fonds.some(function (f) { return f.id === id; }); };
          exiger(montant > 0 && ok(data.de) && ok(data.vers) && data.de !== data.vers, 'Choisissez deux fonds différents et un montant.');
          e.de = data.de; e.vers = data.vers; e.montant = montant; e.libelle = txt_(data.libelle, 200);
          exiger(e.libelle, 'Indiquez le motif du virement (décision du…).');
        } else if (t === 'ouverture') {
          exiger(montant >= 0, 'Montant invalide.');
          e.cible = data.cible === 'membre' ? 'membre' : 'caisse'; e.membre = e.cible === 'membre' ? data.membre : null; e.montant = montant; e.note = txt_(data.note, 200);
          if (e.cible === 'caisse') { const Po = parametresFonds_(docs, cfg); e.fonds = Po.fonds.some(function (f) { return f.id === data.fonds; }) ? data.fonds : Po.capital; }
          if (e.cible === 'membre') exiger(cfg.membres[e.membre], 'Membre inconnu.');
        } else throw refus_('Type d’écriture inconnu.');
      }
      poserDoc_(docs, chemin, e, moi);
      journal_(moi, 'Écriture ' + t, (e.membre ? nom(e.membre) + ' · ' : '') + (e.montant != null ? e.montant + ' FCFA' : '') + (e.motif ? ' · ' + e.motif : ''));
      effets.push(exporterRegistre_);
      return effets;
    }
    if (s[2] === 'bilans') {
      const cle = String(data.cle || '');
      const MC = moteurCalcul();
      let du, au, libelle;
      const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
      if (/^M-\d{4}-\d{2}$/.test(cle)) { const ym = cle.slice(2); du = ym + '-01'; au = MC.lastDay(ym); libelle = 'Bilan de ' + MOIS[+ym.slice(5, 7) - 1] + ' ' + ym.slice(0, 4); }
      else if (/^A-\d{4}$/.test(cle)) { du = cle.slice(2) + '-01-01'; au = cle.slice(2) + '-12-31'; libelle = 'Bilan annuel ' + cle.slice(2); }
      else throw refus_('Bilan invalide.');
      const t = aujourdhui_();
      exiger(du <= t, 'Cette période n’a pas commencé.');
      const versions = Object.keys(docs).filter(function (k) { return /^tresorerie\/[^/]+\/bilans\//.test(k) && docs[k].data.cle === cle; });
      const n = versions.length + 1;
      exiger(s[3] === cle + '-v' + n, 'Un autre bilan vient d’être publié pour cette période. Actualisez la page.');
      if (n > 1) exiger(txt_(data.motif, 300), 'Indiquez le motif du rectificatif.');
      const fin = au < t ? au : t;
      const S = etat_(docs, moi);
      const ctx = MC.contexte(S);
      const chiffres = MC.calculer(ctx, du, fin);
      chiffres.au = fin;
      const b = { cle: cle, version: n, libelle: libelle, du: du, au: au, fin: fin, chiffres: chiffres, empreinte: MC.empreinte(chiffres), publieLe: maintenant, publiePar: moi, commentaire: txt_(data.commentaire, 300), motif: txt_(data.motif, 300), remplace: n > 1 ? versions.map(function (k) { return k.split('/')[3]; }).sort().pop() : null };
      poserDoc_(docs, chemin, b, moi);
      journal_(moi, n > 1 ? 'Rectificatif publié' : 'Bilan publié', libelle);
      effets.push(exporterRegistre_);
      effets.push(function () { notifier_('bilan', (n > 1 ? 'Rectificatif : ' : 'Nouveau bilan : ') + libelle, titreTresorerie_(cfg, true) + ' a publié « ' + libelle + ' »' + (n > 1 ? ' (rectificatif)' : '') + '. Consultez-le dans la rubrique Cotisations et parts.'); });
      return effets;
    }
  }
  throw refus_('Action non autorisée.');
}

/** Paramètres de répartition (fonds, clés, cotisations exceptionnelles) à partir des documents du classeur. */
function parametresFonds_(docs, cfg) {
  const appels = {};
  Object.keys(docs).forEach(function (k) { const x = k.split('/'); if (x[0] === 'appels' && x.length === 2) appels[x[1]] = docs[k].data; });
  return moteurCalcul().parametres(cfg, null, appels);
}

/* ================================================================
 * 5 bis. PIÈCES JOINTES (dossier Drive « Adya – … – Pièces jointes », privé)
 * Les membres n'ont pas accès au dossier : les fichiers passent par l'application, avec leur code.
 * ================================================================ */
const PJ_TYPES = {
  'image/jpeg': 'photo',
  'application/pdf': 'pdf',
  'application/msword': 'word',
  'application/vnd.openxmlformats-officedocument.wordprocessingml.document': 'word',
  'application/vnd.ms-excel': 'excel',
  'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': 'excel'
};
const PJ_MAX_PHOTO = 1500000, PJ_MAX_DOC = 5 * 1024 * 1024, PJ_PAR_PUBLICATION = 4;

function dossierPJ_() { return dossier_('DOSSIER_PJ', CONFIG.NOM_DOSSIER_PJ); }

/** Reçoit un fichier (photo déjà réduite par le téléphone, ou document) et le range dans le dossier Drive. */
function apiDeposerPJ(jeton, nom, type, b64) {
  const moi = session_(jeton);
  exigerActif_();
  type = String(type || '');
  const genre = PJ_TYPES[type];
  if (!genre) throw refus_('Type de fichier non accepté : photo, PDF, Word ou Excel seulement.');
  let octets;
  try { octets = Utilities.base64Decode(String(b64 || '')); } catch (e) { throw refus_('Fichier illisible.'); }
  if (!octets.length || octets.length > (genre === 'photo' ? PJ_MAX_PHOTO : PJ_MAX_DOC)) throw refus_(genre === 'photo' ? 'Photo trop lourde.' : 'Document trop lourd : 5 Mo au plus.');
  const o = function (i) { return (octets[i] + 256) % 256; };
  const signature = genre === 'photo' ? o(0) === 0xFF && o(1) === 0xD8
    : genre === 'pdf' ? o(0) === 0x25 && o(1) === 0x50 && o(2) === 0x44 && o(3) === 0x46
    : (o(0) === 0x50 && o(1) === 0x4B) || (o(0) === 0xD0 && o(1) === 0xCF);
  if (!signature) throw refus_('Le contenu du fichier ne correspond pas à son type.');
  nom = txt_(nom, 100).replace(/[\\/:*?"<>|\u0000-\u001f]/g, '_') || 'fichier';
  const fichier = dossierPJ_().createFile(Utilities.newBlob(octets, type, nom));
  const id = Utilities.getUuid().replace(/-/g, '').slice(0, 20);
  const effets = [];
  const lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    const docs = lireDocs_();
    // Ménage : pièces envoyées mais jamais publiées (formulaire abandonné) depuis plus de deux jours.
    const limite = Date.now() - 2 * 864e5;
    Object.keys(docs).forEach(function (k) { if (k.indexOf('pj/') === 0 && !docs[k].data.lien && new Date(docs[k].data.le).getTime() < limite) pjSupprimer_(docs, k, effets); });
    poserDoc_(docs, 'pj/' + moi + '/' + id, { nom: nom, type: type, taille: octets.length, fichier: fichier.getId(), le: new Date().toISOString(), lien: null }, moi);
    SpreadsheetApp.flush();
  } finally { lock.releaseLock(); }
  effets.forEach(function (f) { try { f(); } catch (e) { Logger.log(e); } });
  return { id: id, nom: nom, type: type, taille: octets.length };
}

/** Renvoie le contenu d'une pièce jointe à un membre connecté (clé « m4/identifiant »). */
function apiLirePJ(jeton, cle) {
  session_(jeton);
  cle = String(cle || '');
  if (!/^m\d+\/\w{8,40}$/.test(cle)) throw refus_('Pièce jointe introuvable.');
  const d = lireDocs_()['pj/' + cle];
  if (!d) throw refus_('Cette pièce jointe a été supprimée.');
  return { nom: d.data.nom, type: d.data.type, b64: Utilities.base64Encode(DriveApp.getFileById(d.data.fichier).getBlob().getBytes()) };
}

/** Vérifie les pièces jointes d'une publication ; leur description vient du registre, jamais du téléphone. */
function pjPublication_(docs, moi, chemin, liste) {
  liste = Array.isArray(liste) ? liste : [];
  if (liste.length > PJ_PAR_PUBLICATION) throw refus_(PJ_PAR_PUBLICATION + ' pièces jointes au plus par publication.');
  const vus = {};
  return liste.map(function (x) {
    const id = String((x && x.id) || x || '');
    const d = docs['pj/' + moi + '/' + id];
    if (!/^\w{8,40}$/.test(id) || !d || vus[id] || (d.data.lien && d.data.lien !== chemin)) throw refus_('Pièce jointe introuvable : joignez-la de nouveau.');
    vus[id] = 1;
    return { id: id, nom: d.data.nom, type: d.data.type, taille: d.data.taille };
  });
}
/** Rattache les pièces à leur publication ; celles qui n'y figurent plus partent à la corbeille du Drive. */
function pjRattacher_(docs, moi, chemin, nouvelles, anciennes, effets) {
  const garder = {};
  (nouvelles || []).forEach(function (p) {
    garder[p.id] = 1;
    const k = 'pj/' + moi + '/' + p.id, d = docs[k];
    if (d && d.data.lien !== chemin) { d.data.lien = chemin; poserDoc_(docs, k, d.data, moi); }
  });
  (anciennes || []).forEach(function (p) { if (!garder[p.id]) pjSupprimer_(docs, 'pj/' + moi + '/' + p.id, effets); });
}
function pjSupprimer_(docs, cle, effets) {
  const d = docs[cle];
  if (!d) return;
  const fichier = d.data.fichier;
  retirerDoc_(docs, cle);
  effets.push(function () { DriveApp.getFileById(fichier).setTrashed(true); });
}

function cleRecus_() {
  const props = PropertiesService.getScriptProperties();
  let k = props.getProperty('SECRET_RECUS');
  if (!k) { k = Utilities.getUuid() + Utilities.getUuid(); props.setProperty('SECRET_RECUS', k); }
  return k;
}
function codeRecu_(v, cle) {
  const a = v.affectations || {};
  let texte = [v._id, v.membre, v.montant, v.date, Object.keys(a).sort().map(function (k) { return k + ':' + a[k]; }).join(',')].join('|');
  if (v.rubrique && v.rubrique !== 'mensuelle') texte += '|' + v.rubrique + ':' + (v.appel || v.objet || '') + ':' + (v.donateur || '');
  const h = Utilities.computeHmacSha256Signature(texte, cle || cleRecus_()).map(function (x) { return ('0' + ((x + 256) % 256).toString(16)).slice(-2); }).join('').toUpperCase();
  return h.slice(0, 4) + '-' + h.slice(4, 8) + '-' + h.slice(8, 12);
}
function versementsDocs_(docs) {
  return Object.keys(docs).filter(function (k) { return /^tresorerie\/[^/]+\/ecritures\//.test(k) && docs[k].data.type === 'versement'; })
    .map(function (k) { return Object.assign({ _id: k.split('/')[3] }, docs[k].data); });
}
function voitTousLesRecus_(cfg, moi) {
  const t = (cfg.tresoriers || []).filter(function (x) { return !x.au; })[0];
  return cfg.admins.indexOf(moi) >= 0 || !!(t && t.membre === moi);
}
/** Codes d'authenticité des reçus visibles par ce membre : les siens (tous pour la trésorerie et l'administrateur). */
function codesRecus_(docs, moi) {
  const cfg = docs['config/app'].data, tous = voitTousLesRecus_(cfg, moi), cle = cleRecus_(), out = {};
  versementsDocs_(docs).forEach(function (v) { if (tous || v.membre === moi) out[v._id] = codeRecu_(v, cle); });
  return out;
}
function dossierRecus_() { return dossier_('DOSSIER_RECUS', CONFIG.NOM_DOSSIER_RECUS); }
/** Construit (ou reprend dans le Drive) le PDF d'un reçu. */
function pdfRecu_(docs, id) {
  const S = etat_(docs, CONFIG.ADMIN), MC = moteurCalcul(), c = MC.contexte(S);
  const r = MC.recu(c.L, c.P, S.config, id);
  if (!r) throw refus_('Reçu introuvable.');
  r.code = codeRecu_(c.L.all.filter(function (x) { return x._id === id; })[0]);
  const nom = r.numero + (r.annule ? ' (annulé)' : '') + '.pdf';
  const cle = 'recus/' + r.membre + '/' + id, empreinte = 'm' + RECU_MODELE_ + '-' + r.code + (r.annule ? '-A' : '');
  const deja = docs[cle] && docs[cle].data.empreinte === empreinte ? docs[cle].data.fichier : null;
  if (deja) { try { return { r: r, nom: nom, blob: DriveApp.getFileById(deja).getBlob() }; } catch (e) {} }
  const html = '<html><head><meta charset="utf-8"></head><body style="margin:24px 0;background:#ffffff;">' + MC.recuHTML(r, { banniere: BANNIERE_RECU_ }) + '</body></html>';
  const blob = Utilities.newBlob(html, 'text/html', 'recu.html').getAs('application/pdf').setName(nom);
  try {
    const f = dossierRecus_().createFile(blob);
    const lock = LockService.getScriptLock(); lock.waitLock(20000);
    try { const d2 = lireDocs_(); poserDoc_(d2, cle, { fichier: f.getId(), empreinte: empreinte, le: new Date().toISOString() }, r.membre); } finally { lock.releaseLock(); }
  } catch (e) { Logger.log(e); }
  return { r: r, nom: nom, blob: blob };
}
/** Téléchargement du PDF : le membre concerné, la trésorerie et l'administrateur. */
function apiRecuPDF(jeton, id) {
  const moi = session_(jeton);
  const docs = lireDocs_();
  const v = versementsDocs_(docs).filter(function (x) { return x._id === String(id || ''); })[0];
  if (!v) throw refus_('Reçu introuvable.');
  if (v.membre !== moi && !voitTousLesRecus_(docs['config/app'].data, moi)) throw refus_('Ce reçu ne vous concerne pas.');
  const p = pdfRecu_(docs, v._id);
  journal_(moi, 'Reçu téléchargé', p.r.numero);
  return { nom: p.nom, b64: Utilities.base64Encode(p.blob.getBytes()) };
}
/** Vérification d'un reçu présenté par quelqu'un : numéro + code d'authenticité. */
function apiVerifierRecu(jeton, numero, code) {
  session_(jeton);
  numero = String(numero || '').trim().toUpperCase(); code = String(code || '').trim().toUpperCase().replace(/[^0-9A-F]/g, '');
  const docs = lireDocs_(), S = etat_(docs, CONFIG.ADMIN), MC = moteurCalcul(), c = MC.contexte(S), nums = MC.numerosRecus(c.L, groupe_().sigle);
  const id = Object.keys(nums).filter(function (k) { return nums[k] === numero; })[0];
  if (!id) return { valide: false, message: 'Aucun reçu ne porte ce numéro.' };
  const v = c.L.all.filter(function (x) { return x._id === id; })[0];
  if (codeRecu_(v).replace(/-/g, '') !== code) return { valide: false, message: 'Le code ne correspond pas à ce reçu : il a pu être modifié.' };
  const r = MC.recu(c.L, c.P, S.config, id);
  return { valide: !r.annule, annule: r.annule, numero: r.numero, membre: r.nomMembre, montant: r.montant, date: r.date, mois: r.mois.map(function (m) { return m.lib; }) };
}

let NOMS_CACHE = null;

/** Lignes lisibles du registre et des bilans (onglets du classeur et export Excel). */
function lignesRegistre_(S, c) {
  const nom = function (m) { return S.config.membres[m] ? S.config.membres[m].nom : ''; };
  const TYPES = { versement: 'Versement', mouvement: 'Mouvement de caisse', ouverture: 'Solde d’ouverture', annulation: 'Correction (annulation)' };
  const lignes = c.L.all.slice().reverse().map(function (e) {
    const ann = c.L.annul[e._id];
    const MC = moteurCalcul(), ap = e.appel && c.P.appels[e.appel] ? ' (' + c.P.appels[e.appel].titre + ')' : '';
    const detail = e.type === 'mouvement' ? (e.sens === 'entree' ? 'Entrée · ' : 'Sortie · ') + e.categorie + ap + ' · ' + (e.libelle || '') : e.type === 'annulation' ? 'Annule ' + e.cible + ' · ' + e.motif
      : e.type === 'versement' ? MC.objetVersement(e, c.P) + ' · ' + (MC.MOYEN[e.moyen] || 'autre') + (e.note ? ' · ' + e.note : '') : (e.note || e.cible || '');
    const aff = Object.keys(e.affectations || {}).sort().map(function (k) { return k + ' : ' + e.affectations[k]; }).join(' ; ');
    return [e.date || '', TYPES[e.type] || e.type, nom(e.membre) || e.donateur || '', e.montant == null ? '' : e.montant, detail, aff, e.saisiLe ? new Date(e.saisiLe) : '', nom(e.par), ann ? 'Annulée le ' + String(ann.saisiLe).slice(0, 10) : (e.type === 'annulation' ? '' : 'Valide')];
  });
  const b = [];
  c.tresUids.forEach(function (u) { const x = S.bilans[u] || {}; Object.keys(x).forEach(function (id) { const v = x[id]; b.push([v.libelle, v.version, v.du + ' → ' + v.fin, new Date(v.publieLe), nom(v.publiePar), v.chiffres.totaux.totalRecu, v.chiffres.totaux.solde, v.empreinte, v.motif || '']); }); });
  b.sort(function (x, y) { return x[3] - y[3]; });
  return { ecritures: lignes, bilans: b };
}
function exporterRegistre_() {
  const docs = lireDocs_();
  const S = etat_(docs, CONFIG.ADMIN);
  const c = moteurCalcul().contexte(S);
  const reg = lignesRegistre_(S, c), lignes = reg.ecritures, b = reg.bilans;
  const sh = ss_().getSheetByName(F_REGISTRE);
  if (sh.getLastRow() > 1) sh.getRange(2, 1, sh.getLastRow() - 1, 9).clearContent();
  if (lignes.length) sh.getRange(2, 1, lignes.length, 9).setValues(lignes);
  const sb = ss_().getSheetByName(F_BILANS);
  if (sb.getLastRow() > 1) sb.getRange(2, 1, sb.getLastRow() - 1, 9).clearContent();
  if (b.length) sb.getRange(2, 1, b.length, 9).setValues(b);
}

/** Envoie un e-mail aux membres qui ont activé cette catégorie (ou à la liste donnée). */
function notifier_(cat, objet, corps, ids) {
  const docs = lireDocs_();
  const cfg = docs['config/app'].data;
  if (etatLicence_().mode === 'consultation') return;   // e-mails suspendus en mode consultation
  (ids || actifs_(cfg)).forEach(function (m) {
    if (!cfg.membres[m] || cfg.membres[m].sortie) return;
    const p = docs['prefs/' + m] ? docs['prefs/' + m].data : null;
    if (!p || !p.emailActif || p.toutes === false || (p.cats && p.cats[cat] === false)) return;
    const to = emailDe_(docs, m);
    if (!to) return;
    try {
      MailApp.sendEmail({ to: to, name: nomApp_(), subject: nomApp_() + ' – ' + objet,
        body: corps + '\n\nOuvrir l’application : ' + lienApp_() + '\n\nVous recevez ce message parce que vous avez activé les notifications par e-mail dans Mon espace. Vous pouvez les désactiver à tout moment.' });
      ss_().getSheetByName(F_ENVOIS).appendRow([new Date(), cfg.membres[m].nom, cat, objet]);
    } catch (e) { Logger.log(e); }
  });
}

function apiEmailTest(jeton) {
  const moi = session_(jeton);

  const to = emailDe_(docs, moi);

  return true;
}

/** Déclencheur quotidien : nettoyage des connexions expirées et rappels (seulement si l'administrateur les a activés). */
function tacheQuotidienne() {
  const props = PropertiesService.getScriptProperties();
  const tout = props.getProperties();
  Object.keys(tout).forEach(function (k) { if (k.indexOf('sess:') === 0) { try { if (JSON.parse(tout[k]).exp < Date.now()) props.deleteProperty(k); } catch (e) { props.deleteProperty(k); } } });
  try { verifierLicence_(); } catch (e) { Logger.log(e); }
  vidageActivite_();
  const docs = lireDocs_();
  const cfg = docs['config/app'].data;
  if (!cfg.rappels || !cfg.rappels.actifs) return;
  const S = etat_(docs, CONFIG.ADMIN);
  const presents = actifs_(cfg);
  const t = aujourdhui_(), demain = Utilities.formatDate(new Date(Date.now() + 864e5), CONFIG.FUSEAU, 'yyyy-MM-dd');
  const jm = function (d) { return +d.slice(8, 10) + '/' + +d.slice(5, 7); };
  // Anniversaires du jour (membres et enfants)
  const fetes = [];
  presents.forEach(function (m) { const p = S.profils[m]; if (p && p.anniv && p.anniv.j + '/' + p.anniv.m === jm(t)) fetes.push(p.nom || cfg.membres[m].nom); });
  Object.keys(S.enfants).filter(function (m) { return presents.indexOf(m) >= 0; }).forEach(function (m) { Object.keys(S.enfants[m]).forEach(function (c) { const e = S.enfants[m][c]; if (e.anniv && e.anniv.j + '/' + e.anniv.m === jm(t)) fetes.push(e.prenom + ' (enfant de ' + ((S.profils[m] || {}).nom || cfg.membres[m].nom) + ')'); }); });
  if (fetes.length) notifier_('anniv', 'Anniversaire aujourd’hui', 'Aujourd’hui, on fête : ' + fetes.join(', ') + '.\nLaissez un mot sur le mur de vœux.');
  // Rendez-vous de demain
  const evts = [], votes = [];
  Object.keys(S.contenus).forEach(function (m) { Object.keys(S.contenus[m]).forEach(function (id) { const x = S.contenus[m][id]; x._key = m + '~' + id; if (x.type === 'evenement' && x.date === demain) evts.push(x); if (x.type === 'vote' && x.cloture) votes.push(x); }); });
  if (evts.length) notifier_('agenda', 'Rendez-vous demain', evts.map(function (e) { return '• ' + e.titre + (e.heure ? ' à ' + e.heure : '') + (e.lieu ? ' – ' + e.lieu : ''); }).join('\n'));
  // Votes qui ferment dans les 24 h : rappel aux membres qui n'ont pas voté
  votes.forEach(function (v) {
    const reste = new Date(v.cloture).getTime() - Date.now();
    if (reste <= 0 || reste > 864e5) return;
    const sans = presents.filter(function (m) { return cfg.membres[m].droitVote !== false && !((S.bulletins[m] || {}).votes || {})[v._key]; });
    if (sans.length) notifier_('votes', 'Vote bientôt clos', 'Le vote « ' + v.titre + ' » se termine le ' + Utilities.formatDate(new Date(v.cloture), CONFIG.FUSEAU, 'dd/MM/yyyy à HH:mm') + '. Vous n’avez pas encore voté.', sans);
  });
  // Rappel de cotisation : le lendemain de l'échéance, uniquement au membre concerné, sans montant
  if (+t.slice(8, 10) === cfg.finances.jour + 1) {
    const MC = moteurCalcul(), c = MC.contexte(S);
    presents.forEach(function (m) { const a = MC.arrieres(c.L, m, t, c.P); if (a && a.mois.length) notifier_('cotis', 'Rappel de cotisation', 'Un rappel concernant votre cotisation vous attend dans l’application (rubrique Cotisations et parts).', [m]); });
  }
}

function reprogrammer_(heure) {
  ScriptApp.getProjectTriggers().forEach(function (t) { if (t.getHandlerFunction() === 'tacheQuotidienne') ScriptApp.deleteTrigger(t); });
  ScriptApp.newTrigger('tacheQuotidienne').timeBased().everyDays(1).atHour(heure).inTimezone(CONFIG.FUSEAU).create();
}

/** Ouverture de l'application : notée dans les propriétés du script, sans verrou ni écriture dans le classeur
 *  (l'ouverture reste rapide). Le report dans l'onglet « Activité » se fait par vidageActivite_(). */
function noterActivite_(m) {
  try {
    const jour = aujourdhui_(), heure = Utilities.formatDate(new Date(), CONFIG.FUSEAU, 'HH:mm');
    const props = PropertiesService.getScriptProperties(), k = 'act:' + jour + ':' + m;
    let v = null; try { v = JSON.parse(props.getProperty(k) || 'null'); } catch (e) { v = null; }
    v = v ? { p: v.p, d: heure, n: (Number(v.n) || 0) + 1 } : { p: heure, d: heure, n: 1 };
    props.setProperty(k, JSON.stringify(v));
  } catch (e) { Logger.log(e); }
}
/** Reporte les ouvertures notées dans l'onglet « Activité » (statistiques de l'administrateur, tâche quotidienne). */
function vidageActivite_() {
  const props = PropertiesService.getScriptProperties(), tout = props.getProperties();
  const cles = Object.keys(tout).filter(function (k) { return k.indexOf('act:') === 0; }).sort();
  if (!cles.length) return;
  const lock = LockService.getScriptLock();
  if (!lock.tryLock(20000)) return;
  try {
    const sh = feuilleActivite_(), cfg = lireDocs_()['config/app'].data;
    const n = sh.getLastRow(), deb = Math.max(2, n - 400);
    const vals = n > 1 ? sh.getRange(deb, 1, n - deb + 1, 6).getDisplayValues() : [];
    cles.forEach(function (k) {
      const p = k.split(':'), jour = p[1], m = p[2];
      let v = null; try { v = JSON.parse(tout[k]); } catch (e) { v = null; }
      if (v) {
        let ligne = 0;
        for (let i = vals.length - 1; i >= 0; i--) if (vals[i][0] === jour && vals[i][2] === m) { ligne = deb + i; break; }
        if (ligne) { const c = sh.getRange(ligne, 5, 1, 2); const ex = c.getValues()[0]; c.setValues([["'" + v.d, (Number(ex[1]) || 0) + v.n]]); }
        else sh.appendRow(["'" + jour, cfg.membres[m] ? cfg.membres[m].nom : m, m, "'" + v.p, "'" + v.d, v.n]);
      }
      props.deleteProperty(k);
    });
  } catch (e) { Logger.log(e); } finally { lock.releaseLock(); }
}

function apiStatistiques(jeton) {

  }).filter(function (x) { return x.le && x.le.slice(0, 10) >= limite && x.m; }) : [];
  // Profil et réglages de chaque membre
  const votes = Object.keys(docs).filter(function (k) { return /^contenus\/[^/]+\/items\//.test(k) && docs[k].data.type === 'vote'; }).map(function (k) { const s = k.split('/'); return s[1] + '~' + s[3]; });
  const membres = actifs_(cfg).map(function (id) {

    return {
      id: id, nom: cfg.membres[id].nom,
      codePerso: props.getProperty('changer:' + id) !== '1',
      email: !!emailDe_(docs, id), emailActif: !!pf.emailActif,
      faceid: faceIdDocs_(docs, id).length,
      photo: !!pr.photo, anniv: !!(pr.anniv && pr.anniv.j), presentation: !!pr.presentation,
      enfants: compte(new RegExp('^profils/' + id + '/enfants/')).length,
      votes: votes.filter(function (v) { return !!docs['bulletins/' + id + '/votes/' + v]; }).length,
      nouvelles: compte(new RegExp('^contenus/' + id + '/items/')).filter(function (k) { return docs[k].data.type === 'nouvelle'; }).length,
      voeux: compte(new RegExp('^voeux/' + id + '/messages/')).length
    };
  });
  const debut = activite.length ? activite.map(function (a) { return a.jour; }).sort()[0] : null;
  return { genereLe: new Date().toISOString(), aujourdhui: aujourdhui_(), debutSuivi: debut, activite: activite, journal: journal, membres: membres, votesTotal: votes.length };

const IMPORTS = {

  'Import – Anniversaires': ['Membre (parent pour un enfant)', 'Prénom de l’enfant (vide pour le membre)', 'Jour', 'Mois', 'Année (facultatif)', 'Statut de l’import']
};
function preparerImport_(ss, membres, ordre) {
  const noms = ordre.map(function (id) { return membres[id].nom; });
  const liste = function (v) { return SpreadsheetApp.newDataValidation().requireValueInList(v, true).setAllowInvalid(true).build(); };
  Object.keys(IMPORTS).forEach(function (nom) {
    if (ss.getSheetByName(nom)) return;
    const sh = ss.insertSheet(nom);
    entetes_(sh, IMPORTS[nom]);
    try {
      if (nom === 'Import – Versements') { sh.getRange(2, 2, 500, 1).setDataValidation(liste(noms)); sh.getRange(2, 5, 500, 1).setDataValidation(liste(['Mobile money', 'Espèces', 'Virement bancaire', 'Autre'])); }
      if (nom === 'Import – Caisse') { sh.getRange(2, 2, 500, 1).setDataValidation(liste(['Entrée', 'Sortie'])); sh.getRange(2, 3, 500, 1).setDataValidation(liste(['Prêt interne accordé', 'Remboursement de prêt', 'Investissement', 'Gain d’investissement', 'Frais', 'Autre'])); }
      if (nom === 'Import – Soldes d’ouverture') sh.getRange(2, 2, 500, 1).setDataValidation(liste(['Caisse'].concat(noms)));
      if (nom === 'Import – Anniversaires') sh.getRange(2, 1, 500, 1).setDataValidation(liste(noms));

function texteDate_(v) {
  if (v instanceof Date) return Utilities.formatDate(v, CONFIG.FUSEAU, 'yyyy-MM-dd');
  const s = String(v || '').trim();
  let m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);
  if (m) return m[3] + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[1]).slice(-2);
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? s : '';
}
function texteMois_(v) {
  if (v instanceof Date) return Utilities.formatDate(v, CONFIG.FUSEAU, 'yyyy-MM');
  const s = String(v || '').trim().toLowerCase();
  let m = s.match(/^(\d{1,2})[\/.-](\d{4})$/); if (m) return m[2] + '-' + ('0' + m[1]).slice(-2);
  m = s.match(/^(\d{4})-(\d{2})/); if (m) return m[1] + '-' + m[2];
  const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  m = s.match(/^([a-zéû]+)\s+(\d{4})$/); if (m && MOIS.indexOf(m[1]) >= 0) return m[2] + '-' + ('0' + (MOIS.indexOf(m[1]) + 1)).slice(-2);
  return '';
}

/** Mode de paiement écrit en toutes lettres dans l'onglet d'import (« Orange Money », « Wave », « espèces »…). */

    const src = cfg.membres[id]; if (!src) return;
    const m = Object.assign({ id, i }, src);

  c.P = MC.parametres(cfg, debut, D.appels || {});
  c.L = ledger(c);

  Object.keys(c.uidToM).forEach(u => {

    Object.keys(it).forEach(id => { const x = Object.assign({}, it[id]); x._uid = u; x._key = u + '~' + id; x._auteur = c.uidToM[u]; c.items.push(x); });
  });
  // Personnes (anniversaires) : membres puis enfants

/** Délai maximal par fonction : sur le réseau mobile, un appel à Google peut rester sans réponse. */
const DELAIS = { apiEtat: 12000, apiListeConnexion: 12000, apiEcrire: 45000, apiRecuPDF: 90000, apiDeposerPJ: 90000, apiLirePJ: 60000, apiStatistiques: 60000, apiImporter: 300000, apiExporter: 120000, apiMembres: 45000 };
function appel(fn) {
  const args = Array.prototype.slice.call(arguments, 1);

    if (!(window.google && google.script && google.script.run)) { rej(new Error('HORS_APPS_SCRIPT')); return; }
    let fini = false;
    const t = setTimeout(() => { if (!fini) { fini = true; rej(new Error('DELAI')); } }, DELAIS[fn] || 30000);
    const r = google.script.run
      .withSuccessHandler(v => { if (fini) return; fini = true; clearTimeout(t); res(v); })
      .withFailureHandler(e => { if (fini) return; fini = true; clearTimeout(t); rej(e); });

}
/** Lecture : jusqu'à trois essais, avec une courte attente entre deux (jamais pour un refus ou une session expirée). */

function natureVersement(form) { const v = (form.querySelector('#tv-rub') || {}).value || 'mensuelle'; return v.indexOf('appel|') === 0 ? { rubrique: 'appel', appel: v.slice(6) } : { rubrique: v, appel: null }; }
function apercuAffectation(form) {

  if (montant > 0) {
    const plan = n.rubrique === 'mensuelle' ? planAffectation(form) : null, aff = {}; if (plan) plan.liste.forEach(x => { aff[x[0]] = x[1]; });
    const rep = MC.repartir(C.P, { rubrique: n.rubrique, montant, affectations: aff, appel: n.appel, fondsChoisi: n.rubrique === 'don' ? form.querySelector('#tv-fonds').value : null });
    lignes.push('Répartition : ' + Object.keys(rep).map(k => nomFonds(k) + ' ' + F(rep[k])).join(', ') + '.');

function planAffectation(form) {
  const m = form.querySelector('#tv-membre').value; let montant = Math.round(+form.querySelector('#tv-montant').value || 0); if (!m || montant <= 0) return null;
  const Pp = C.P; let depart = form.querySelector('#tv-mois').value;

}

/* ============ Lecture à voix haute (voix française du téléphone, sans Internet) ============ */
const VOIX_OK = (() => { try { return 'speechSynthesis' in window && typeof SpeechSynthesisUtterance === 'function'; } catch (e) { return false; } })();

function voixFr() {
  try {
    const vs = speechSynthesis.getVoices().filter(v => /^fr([-_]|$)/i.test(v.lang));
    const fr = vs.filter(v => /^fr[-_]FR/i.test(v.lang));
    return fr.find(v => /premium|enhanced|améliorée|natural/i.test(v.name)) || fr.find(v => v.localService) || fr[0] || vs[0] || null;
  } catch (e) { return null; }

/** Découpe un texte en morceaux courts (certains téléphones coupent les phrases trop longues). */
function decouper(txt) {

}
function zoneLecture(k) { return Array.from(document.querySelectorAll('[data-lz]')).find(e => e.dataset.lz === k) || null; }
function blocsLecture(zone) { const b = Array.from(zone.querySelectorAll('[data-lb]')); return b.length ? b : [zone]; }

/** Propose un fichier reçu du serveur : partage sur téléphone, téléchargement sinon. */
async function offrirFichier(b64, nom, type) {
  const bin = atob(b64); const buf = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  const blob = new Blob([buf], { type });
  try { const f = new File([blob], nom, { type }); if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: nom }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = nom; a.target = '_blank'; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 60000);
}

/* ============ Démarrage ============ */
function lireRoute() { const h = (location.hash || '').slice(1); ui.route = ROUTES.indexOf(h) >= 0 ? h : 'accueil'; }
function naviguer(r) { const avant = ui.route; ui.route = ROUTES.indexOf(r) >= 0 ? r : 'accueil'; if (ui.route !== avant) { ui.personne = null; ui.confirm = null; arreterLecture(); } try { history.replaceState(null, '', '#' + ui.route); } catch (e) {} planifier(); scrollTo(0, 0); }
function brancher() {
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-a]'); if (!el) return;
    const a = el.dataset.a; if (!A[a]) return;
    if (el.tagName === 'A') e.preventDefault();
    Promise.resolve(A[a](el)).catch(err => { console.error(err); toast('Une erreur est survenue.'); });
  });
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset && el.dataset.photo) { const f = el.files && el.files[0]; const cible = el.dataset.photo; el.value = ''; if (!f) return; preparerCadrage(f, cible).catch(() => toast('Cette image n’a pas pu être lue. Essayez une photo JPEG ou PNG.')); return; }
    if (el.dataset && el.dataset.pj) { const fs = Array.from(el.files || []); const z = el.dataset.pj; el.value = ''; if (fs.length) ajouterPJ(z, fs); return; }
    const k = el.dataset && el.dataset.aChange; if (k && CH[k]) CH[k](el);
  });
  document.addEventListener('input', e => { const el = e.target; if (el.dataset && el.dataset.aChange === 'tv') CH.tv(el); if (el.id === 'cad-zoom' && ui.cadrage) { ui.cadrage.zoom = +el.value; appliquerCadrage(); } });
  brancherCadrage();
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !document.getElementById('visionneuse').hidden) fermerPhoto(); });
  document.getElementById('visionneuse').addEventListener('click', e => { if (e.target.id === 'visionneuse') fermerPhoto(); });
  document.addEventListener('submit', e => {
    const f = e.target.closest('form[data-f]'); if (!f) return; e.preventDefault();
    const fn = FORMS[f.dataset.f]; if (!fn) return;
    if (ui.demo) { toast('Exemple : rien n’est enregistré.'); return; }
    const btn = f.querySelector('button:not([type=button])'); if (btn) btn.disabled = true;
    Promise.resolve(fn(f, valeurs(f))).catch(err => { console.error(err); toast('Une erreur est survenue.'); }).then(() => { if (btn) btn.disabled = false; });
  });
  // Navigation interne sans changer l'adresse de la page (l'application tourne dans un cadre Google).
  document.addEventListener('click', e => { const a = e.target.closest('a[href^="#"]'); if (!a || a.dataset.a) return; e.preventDefault(); const r = a.getAttribute('href').slice(1); if (r === ui.route) { ui.personne = null; planifier(); } else naviguer(r); }, true);
  setInterval(() => { if (document.visibilityState === 'visible' && !document.querySelector('#vue :focus')) planifier(); }, 60000);
}
async function demarrer() {
  lireRoute(); brancher();
  const dm = document.getElementById('demarrage'); if (dm) dm.remove();
  planifier();
  if (!(window.google && google.script && google.script.run)) { ui.horsAppsScript = true; ui.liste = []; planifier(); return; }
  if (SESSION.jeton) { const g = etatGarde(); if (g) { ui.depuisCache = g.le; appliquerEtat(g.s, true); } await actualiser(true); } else chargerListe();
  setInterval(() => { if (document.visibilityState === 'visible' && !document.querySelector('#vue :focus')) actualiser(); }, 120000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') actualiser(true); });
}
demarrer().catch(e => { const v = document.getElementById('vue'); if (v) v.innerHTML = '<div class="erreur-boot">Démarrage impossible : ' + esc(e && e.message) + '</div>'; });
})();

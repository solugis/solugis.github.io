function seed(){const base=TODAY;return {theme:'romance',screen:'home',couple:{first:'Alex',second:'Camille',stage:'construction'},privacy:{showIntimacy:true},budget:500000,events:[{id:'e1',date:addDay(base,-4),type:'intime',title:'Notre moment'},{id:'e2',date:addDay(base,2),type:'rdv',title:'Dîner en amoureux'},{id:'e3',date:addDay(base,6),type:'intime',title:'Notre moment'},{id:'e4',date:addDay(base,10),type:'special',title:'Notre rendez-vous préféré'},{id:'e5',date:addDay(base,14),type:'anniversaire',title:'Une date à célébrer'}],moods:[{id:'m1',date:addDay(base,-3),personal:4,relation:5,note:''},{id:'m2',date:addDay(base,-2),personal:3,relation:4,note:''},{id:'m3',date:addDay(base,-1),personal:5,relation:4,note:''}],projects:[{id:'p1',name:'Notre escapade à Assinie',emoji:'🌴',due:addDay(base,40),tasks:[{id:'t1',name:'Choisir les dates',done:true},{id:'t2',name:'Réserver le logement',done:false},{id:'t3',name:'Organiser le transport',done:false}]},{id:'p2',name:'Aménager notre cocon',emoji:'🏡',due:addDay(base,55),tasks:[{id:'t4',name:'Définir notre budget',done:true},{id:'t5',name:'Faire la liste des achats',done:true},{id:'t6',name:'Choisir la décoration',done:false}]}],expenses:[{id:'x1',name:'Courses de la semaine',amount:92000,date:addDay(base,-3),category:'Alimentation',paidBy:'Commun',visibility:'partage'},{id:'x2',name:'Maison',amount:150000,date:addDay(base,-2),category:'Logement',paidBy:'Alex',visibility:'partage'},{id:'x3',name:'Sortie à deux',amount:44000,date:addDay(base,-1),category:'Loisirs',paidBy:'Camille',visibility:'partage'}],goals:[{id:'g1',name:'Vacances à deux',target:2000000,saved:800000}],expectations:[{id:'a1',title:'Notre temps à deux',body:'J’aimerais que nous gardions un moment privilégié chaque semaine.'}],rules:[{id:'r1',category:'Communication',body:'Nous choisissons un moment calme pour discuter lorsque nous ne sommes pas d’accord.',status:'example'},{id:'r2',category:'Finances',body:'Nous décidons ensemble des dépenses importantes concernant nos projets communs.',status:'example'}],memories:[{id:'s1',date:addDay(base,-20),title:'Notre beau dimanche',emoji:'🌅',note:'Un moment simple à garder dans notre histoire.'}],demo:true}}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&x.events&&x.projects){if(!x.emotionSchemaVersion&&!localStorage.getItem(KEY+':before-emotions-v2')){try{localStorage.setItem(KEY+':before-emotions-v2',JSON.stringify(x))}catch(e){}}return x}}catch(e){}return window.ENTRE_NOUS_CONFIG&&window.ENTRE_NOUS_CONFIG.api?emptyState():seed()}
let S=EmotionCore.migrate(load()),page='home',sub='overview',month=monthKey(TODAY),selected=TODAY,calView='month',modal=null,noticeTimer=null;
function persist(){syncAfterPersist();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Stockage indisponible : vos changements peuvent ne pas être conservés.')}}
function id(){return Math.random().toString(36).slice(2,10)}
const el=(tag,cls,html)=>`<${tag}${cls?` class="${cls}"`:''}>${html}</${tag}>`;
const button=(title,action='noop',cls='btn')=>`<button type="button" class="${cls}" data-action="${esc(action)}">${title}</button>`;
function toast(msg){document.querySelector('.toast')?.remove();const n=document.createElement('div');n.className='toast';n.textContent=msg;document.body.append(n);clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>n.remove(),3300)}
function iconBtn(name,action,label='Action'){return `<button type="button" class="small-icon" data-action="${esc(action)}" aria-label="${esc(label)}">${svg(name)}</button>`}
const NAV=[['home','Accueil','house'],['calendar','Calendrier','calendar'],['projects','Projets','projects'],['finance','Finances','wallet'],['us','Nous','heart']];
function shell(){return `<div class="app"><aside class="sidebar"><div class="brand"><div class="logo">e.</div><div><div class="brand-name">Entre Nous</div><div class="brand-sub">Un univers à deux</div></div></div><div class="side-label">Votre espace</div><nav class="nav">${NAV.map(x=>`<button class="nav-button ${page===x[0]?'active':''}" data-action="nav:${x[0]}">${svg(x[2])}${x[1]}</button>`).join('')}</nav><div class="side-spacer"></div><div class="side-note"><strong>Une histoire, à votre rythme ♡</strong>${syncConnected()?'Vos saisies sont partagées avec votre partenaire et gardées sur cet appareil.':"Ce prototype conserve vos saisies dans ce navigateur uniquement. Aucun partenaire n'y est connecté."}</div><div class="side-bottom"><div class="mini-profile"><div class="avatar">${esc(personName(emotionViewer).slice(0,1))}</div><span>${esc(personName(emotionViewer))}</span></div>${iconBtn('gear','settings','Personnaliser')}</div></aside><main class="main"><header class="topbar"><div><div class="eyebrow">ENTRE NOUS${syncConnected()?'':'<span style="opacity:.42;margin:0 5px">/</span> VERSION DÉCOUVERTE'}</div><div class="tiny quiet" style="margin-top:8px">Votre histoire, votre rythme.</div></div><div class="top-actions"><span class="topdate">${new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</span>${iconBtn('gear','settings','Réglages')}<div class="avatars"><div class="avatar">${esc(S.couple.first.slice(0,1))}</div><div class="avatar">${esc(S.couple.second.slice(0,1))}</div></div></div></header>${simulationBanner()}<div class="page">${renderPage()}</div></main><nav class="mobile-nav">${NAV.map(x=>`<button data-action="nav:${x[0]}" class="${page===x[0]?'active':''}">${svg(x[2])}<span>${x[1]}</span></button>`).join('')}</nav></div>${modal?renderModal():''}`}
function render(){document.documentElement.dataset.theme=S.theme;const a=$('#app');a.innerHTML=shell();fillEdit();albumApresRendu()}
function pageHead(kicker,title,desc,actions=''){return `<div class="welcome"><div><div class="eyebrow">${kicker}</div><h1 class="display">${title}</h1><p class="lede">${desc}</p></div>${actions}</div>`}
function renderPage(){switch(page){case'calendar':return emotionCalendar();case'projects':return projects();case'finance':return finance();case'us':return us();default:return home()}}
function evList(evs,withRemove=false){evs=visibleEvents(evs);return evs.length?evs.map(e=>`<div class="event-line"><div class="date-chip"><b>${Number(e.date.slice(-2))}</b><span>${new Date(e.date+'T12:00').toLocaleDateString('fr-FR',{month:'short'})}</span></div><span class="event-symbol">${e.type==='intime'&&!S.privacy.showIntimacy?'🔒':TYPES[e.type]?.emoji||'📅'}</span><div class="event-desc"><b>${e.type==='intime'&&!S.privacy.showIntimacy?'Moment privé':esc(e.title)}</b><small>${TYPES[e.type]?.name||'Événement'} · ${fullDate(e.date)}</small></div>${withRemove?`${e.type==='intime'&&!S.privacy.showIntimacy?'':editButton('event',e,'Modifier l’événement')}<button class="remove" title="Supprimer" data-action="delete-event:${e.id}">×</button>`:''}</div>`).join(''):`<div class="empty">Aucun événement pour le moment.<br>Ajoutez une date importante pour commencer.</div>`}
function upcoming(n=3){return visibleEvents([...S.events]).filter(e=>e.date>=TODAY).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,n)}
function monthlyExpenses(){return S.expenses.filter(e=>monthKey(e.date)===monthKey(TODAY)).reduce((a,e)=>a+Number(e.amount),0)}
function taskCount(){const all=S.projects.flatMap(p=>p.tasks);return [all.filter(t=>t.done).length,all.length]}
function moodToday(){return S.moods.find(m=>m.date===TODAY)||{personal:0,relation:0,note:''}}
const moodSet=[['😔','Bas'],['😕','Mitigé'],['😐','Neutre'],['😊','Bien'],['🥰','Super']];
function moodPicker(label,mode,value){return `<div><div class="section-hint"><span>${label}</span><small class="quiet">${value?'Enregistré aujourd’hui':'À renseigner si vous le souhaitez'}</small></div><div class="mood-options">${moodSet.map((m,i)=>`<button class="mood ${Number(value)===i+1?'selected':''}" data-action="mood:${mode}:${i+1}" aria-label="${m[1]}"><span class="emoji">${m[0]}</span><span>${m[1]}</span></button>`).join('')}</div></div>`}
function home(){const t=moodToday(),up=upcoming(),spent=monthlyExpenses(),[done,total]=taskCount();return `${pageHead('Votre cocon digital',`Bonjour, <em>${esc(personName(emotionViewer))}</em> ♡`,'Un endroit à vous, pour prendre soin de votre relation et de votre quotidien.',button(`${svg('plus')} Ajouter un événement`,'new-event','btn primary'))}<div class="grid-2"><div class="stack"><section class="hero"><div class="hero-main"><div class="smallcaps">NOTRE PETIT UNIVERS</div><div class="h-title">De belles choses<br>se vivent <em>à deux.</em></div><p>Les instants précieux, les projets de demain, les mots du cœur. Tout trouve sa place ici.</p>${button('Voir notre calendrier '+svg('arrow'),'nav:calendar','btn soft')}</div><div class="hero-ornament">♡</div></section>${penseeAccueil()}<section class="card">${emotionEditor()}</section><section class="card"><div class="card-title"><h3>Nos prochains moments</h3>${button('Calendrier '+svg('arrow'),'nav:calendar','btn ghost sm')}</div>${evList(up)}${button(`${svg('plus')} Ajouter une date`,'new-event','btn soft sm')}</section></div><div class="stack"><section class="card"><div class="card-title"><h3>En un regard</h3><span class="smallcaps">Ce mois-ci</span></div><div class="two-mini"><div class="stat-tile"><div class="smallcaps">${S.privacy.showIntimacy?'Moments 🔞':'Moments privés'}</div><div class="stat-number">${S.privacy.showIntimacy?S.events.filter(e=>e.type==='intime'&&monthKey(e.date)===monthKey(TODAY)).length:'—'}</div><div class="stat-label">Inscrits au calendrier</div></div><div class="stat-tile"><div class="smallcaps">Nos tâches</div><div class="stat-number">${done}<span class="quiet" style="font:17px var(--sans)"> / ${total}</span></div><div class="stat-label">Tâches accomplies</div></div><div class="stat-tile"><div class="smallcaps">Budget restant</div><div class="stat-number" style="font-size:24px">${fmt(S.budget-spent)}</div><div class="stat-label">FCFA ce mois-ci</div></div><div class="stat-tile"><div class="smallcaps">Notre relation</div><div class="stat-number">${EmotionCore.day(S,TODAY,emotionViewer).common === null ? '—' : EmotionCore.emoji(EmotionCore.day(S,TODAY,emotionViewer).common)}</div><div class="stat-label">Mood commun · deux réponses partagées</div></div></div></section><section class="card"><div class="card-title"><h3>Notre budget</h3>${button(svg('arrow'),'nav:finance','btn ghost sm')}</div><div class="section-hint"><span>Utilisé ce mois</span><b class="small">${fmt(spent)} / ${fmt(S.budget)} FCFA</b></div><div class="progress" style="margin:13px 0 10px"><div style="width:${Math.min(100,S.budget?spent/S.budget*100:0)}%"></div></div><p class="quiet small" style="line-height:1.6">Visualisez vos dépenses et faites grandir vos projets communs.</p></section><section class="card"><div class="card-title"><h3>Nos engagements</h3>${button(svg('arrow'),'sub:agreements','btn ghost sm')}</div><p class="quiet small" style="line-height:1.75">Exprimer nos attentes, construire des accords, évoluer sans jamais se juger.</p><div style="background:var(--bg);padding:14px;border-radius:13px;font:italic 17px/1.55 var(--serif)">« Écouter pour comprendre, pas seulement pour répondre. »</div>${button('Découvrir notre charte','sub:agreements','btn soft sm')}</section></div></div>`}
function calendar(){const year=Number(month.slice(0,4)),mo=Number(month.slice(5,7))-1,start=new Date(year,mo,1),offset=(start.getDay()+6)%7,days=new Date(year,mo+1,0).getDate(),gridN=Math.ceil((offset+days)/7)*7;
const cells=Array.from({length:gridN},(_,i)=>{let date=dstr(new Date(year,mo,i-offset+1)),d=Number(date.slice(-2)),isMonth=date.slice(0,7)===month,evs=S.events.filter(e=>e.date===date);return `<button class="day ${isMonth?'':'outside'} ${date===TODAY?'today':''} ${selected===date?'selected':''}" data-action="select-date:${date}" aria-label="${fullDate(date)}"><span class="day-number">${d}</span><div class="day-emojis">${evs.slice(0,4).map(e=>`<span title="${esc(e.type==='intime'?'Moment intime':e.title)}">${e.type==='intime'&&!S.privacy.showIntimacy?'🔒':TYPES[e.type]?.emoji||'📅'}</span>`).join('')}</div>${evs.length?`<div class="cal-chip">${evs.length} événement${evs.length>1?'s':''}</div>`:''}</button>`}).join('');
const dayEv=S.events.filter(e=>e.date===selected);let body='';if(calView==='month'){body=`<div class="cal-weekdays">${['LUN','MAR','MER','JEU','VEN','SAM','DIM'].map(s=>`<div>${s}</div>`).join('')}</div><div class="cal-grid">${cells}</div>`}else if(calView==='week'){const day=new Date(selected+'T12:00');const mon=addDay(selected,-(day.getDay()+6)%7);body=`<div class="grid-3" style="grid-template-columns:repeat(auto-fit,minmax(135px,1fr))">${Array.from({length:7},(_,i)=>{const dd=addDay(mon,i);let ev=S.events.filter(e=>e.date===dd);return `<button class="week-day ${selected===dd?'selected':''}" data-action="select-date:${dd}"><div class="smallcaps">${new Date(dd+'T12:00').toLocaleDateString('fr-FR',{weekday:'short'})}</div><b>${Number(dd.slice(-2))}</b><div style="font-size:22px">${ev.map(e=>e.type==='intime'&&!S.privacy.showIntimacy?'🔒':TYPES[e.type]?.emoji||'📅').join(' ')||'—'}</div></button>`}).join('')}</div>`}else{body=`<div class="date-banner">${fullDate(selected)}</div>${evList(dayEv,true)}`}
return `${pageHead('Tous nos instants','Notre <em>calendrier</em>','Rendez-vous, projets, souvenirs et moments intimes : l’histoire de votre quotidien.',button(`${svg('plus')} Nouvel événement`,'new-event','btn primary'))}<div class="card"><div class="calendar-head"><div class="month-title">${monthName(month+'-01').replace(/^./,c=>c.toUpperCase())}</div><div class="cal-controls"><div class="segmented">${['month','week','day'].map((v,i)=>`<button class="${calView===v?'active':''}" data-action="cal-view:${v}">${['Mois','Semaine','Jour'][i]}</button>`).join('')}</div>${iconBtn('back','cal-prev','Précédent')}${iconBtn('arrow','cal-next','Suivant')}${button('Aujourd’hui','cal-today','btn sm')}</div></div>${body}<div class="cal-legend"><span>🔞 Moments intimes</span><span>💝 Dates spéciales</span><span>📅 Rendez-vous</span><span>✅ Projets</span></div><div class="selected-date"><div class="selected-date-head"><b>${fullDate(selected)}</b>${button(`${svg('plus')} Ajouter`,'new-event','btn sm soft')}</div>${calView==='day'?'':evList(dayEv,true)}</div><div style="margin-top:13px" class="toggle-row"><div><b>Afficher les icônes 🔞</b><small>Visible par défaut dans les cases des jours concernés. À désactiver pour un affichage discret.</small></div><label class="switch"><input type="checkbox" data-change="intimacy" ${S.privacy.showIntimacy?'checked':''}/><span></span></label></div><div class="notice warning">Confidentialité : cette version enregistre localement les informations dans le navigateur, sans chiffrement spécifique ni synchronisation. Évitez les détails sensibles sur un appareil partagé.</div></div>`}
function projects(){const [done,total]=taskCount();return `${pageHead('Organiser demain','Nos <em>projets</em>','Des grandes ambitions aux petites tâches du quotidien, avançons ensemble.',button(`${svg('plus')} Nouveau projet`,'new-project','btn primary'))}<div class="grid-3" style="margin-bottom:20px"><div class="stat-tile"><div class="smallcaps">Projets actifs</div><div class="stat-number">${S.projects.length}</div><div class="stat-label">Objectifs partagés</div></div><div class="stat-tile"><div class="smallcaps">Tâches accomplies</div><div class="stat-number">${done} <span class="quiet" style="font:15px var(--sans)">/ ${total}</span></div><div class="stat-label">Étapes réalisées</div></div><div class="stat-tile"><div class="smallcaps">Progression globale</div><div class="stat-number">${total?Math.round(done/total*100):0}%</div><div class="progress"><div style="width:${total?done/total*100:0}%"></div></div></div></div><div class="grid-even">${S.projects.map(p=>{const done=p.tasks.filter(t=>t.done).length;return `<section class="project"><div class="project-head"><div><div class="proj-icon">${esc(p.emoji||'♡')}</div><h3>${esc(p.name)}</h3><div class="quiet tiny">Échéance : ${p.due?fullDate(p.due):'Non définie'}</div></div><div class="item-actions">${button('Modifier','edit-item:project:'+p.id,'btn ghost sm')}${button('Supprimer','delete-project:'+p.id,'btn ghost sm danger')}</div></div><div><div class="section-hint"><span class="small">Notre progression</span><span class="tiny quiet">${done} / ${p.tasks.length} étapes</span></div><div class="progress" style="margin-top:10px"><div style="width:${p.tasks.length?done/p.tasks.length*100:0}%"></div></div></div><div>${p.tasks.map(t=>`<div class="task ${t.done?'done':''}"><input type="checkbox" data-change="task:${p.id}:${t.id}" ${t.done?'checked':''} aria-label="Terminer ${esc(t.name)}"/><span class="task-text">${esc(t.name)}</span>${editButton('task',{id:p.id,name:t.name},'Renommer la tâche',':'+t.id)}<button data-action="delete-task:${p.id}:${t.id}" class="remove" title="Retirer la tâche">×</button></div>`).join('')||'<div class="quiet small">Aucune tâche pour le moment.</div>'}</div><div class="task-editor"><input id="task-${p.id}" placeholder="Ajouter une tâche…" aria-label="Nouvelle tâche"/><button data-action="add-task:${p.id}" aria-label="Ajouter une tâche">+</button></div></section>`}).join('')||'<div class="empty">Aucun projet encore. Créez votre premier projet commun.</div>'}</div>`}
function finance(){const spent=monthlyExpenses(),remaining=S.budget-spent,cat={};S.expenses.filter(x=>monthKey(x.date)===monthKey(TODAY)).forEach(e=>cat[e.category]=(cat[e.category]||0)+Number(e.amount));const max=Math.max(...Object.values(cat),1);return `${pageHead('Construire ensemble','Nos <em>finances</em>','Un espace simple pour suivre les dépenses communes et donner vie à vos projets.',button(`${svg('plus')} Ajouter une dépense`,'new-expense','btn primary'))}<div class="grid-2"><div class="stack"><section class="card budget-hero"><div class="finance-top"><div><div class="smallcaps">NOTRE BUDGET · ${monthName(TODAY).toUpperCase()}</div><div class="finance-amount">${fmt(remaining)} <span style="font:14px var(--sans)">FCFA</span></div><div class="finance-hero-note">Disponibles sur un budget mensuel de ${fmt(S.budget)} FCFA</div></div>${iconBtn('edit','edit-budget','Modifier le budget')}</div><div class="progress" style="margin:20px 0 10px"><div style="width:${Math.min(100,S.budget?spent/S.budget*100:0)}%"></div></div><div class="section-hint"><span class="small">${fmt(spent)} FCFA dépensés</span><span class="small">${S.budget?Math.round(spent/S.budget*100):0}% utilisés</span></div></section><section class="card"><div class="card-title"><h3>Nos dépenses</h3>${button(`${svg('plus')} Ajouter`,'new-expense','btn soft sm')}</div>${S.expenses.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10).map(e=>`<div class="finance-entry"><div class="finance-symbol">${({Alimentation:'🥑',Logement:'🏠',Loisirs:'🥂',Transport:'🚕',Santé:'🌿',Autre:'🧾'})[e.category]||'🧾'}</div><div class="entry-description"><b>${esc(e.name)}</b><small>${esc(e.category)} · ${fullDate(e.date)} · ${esc(e.paidBy)} · ${e.visibility==='prive'?'🔒 Privé':'Commun'}</small></div><div class="entry-amount">– ${fmt(e.amount)}</div>${editButton('expense',e,'Modifier la dépense')}<button class="remove" data-action="delete-expense:${e.id}" title="Supprimer">×</button></div>`).join('')||'<div class="empty">Ajoutez une dépense pour commencer.</div>'}</section></div><div class="stack"><section class="card"><div class="card-title"><h3>Répartition du mois</h3><span class="smallcaps">Dépenses</span></div>${Object.keys(cat).length?`<div class="bar-rows">${Object.entries(cat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="bar-row"><span>${esc(k)}</span><div class="progress"><div style="width:${Math.round(v/max*100)}%"></div></div><span>${fmt(v)}</span></div>`).join('')}</div>`:'<div class="empty">Pas de dépenses ce mois-ci.</div>'}</section><section class="card"><div class="card-title"><h3>Nos objectifs</h3>${button(`${svg('plus')} Nouvel objectif`,'new-goal','btn soft sm')}</div>${S.goals.map(g=>`<div class="goal"><div class="goal-top"><div class="goal-name">🎯 ${esc(g.name)}</div>${button('Ajouter','deposit:'+g.id,'btn sm soft')}</div><div class="progress"><div style="width:${Math.min(100,g.target?g.saved/g.target*100:0)}%"></div></div><div class="section-hint"><span class="quiet tiny">${fmt(g.saved)} / ${fmt(g.target)} FCFA</span><span class="tiny">${g.target&&g.saved>=g.target?'Atteint ✓':(g.target?Math.round(g.saved/g.target*100):0)+'%'}</span></div><div style="text-align:right;margin-top:8px">${button('Modifier','edit-item:goal:'+g.id,'btn ghost sm')}${button('Supprimer','delete-goal:'+g.id,'btn ghost sm danger')}</div></div>`).join('')||'<div class="empty">Votre premier objectif d’épargne vous attend.</div>'}<div class="notice">Les cagnottes sont des suivis virtuels : aucun argent n’est détenu ou transféré dans cette application.</div></section></div></div>`}

function stats(){const thisMonth=S.events.filter(e=>monthKey(e.date)===monthKey(TODAY)),intimes=thisMonth.filter(e=>e.type==='intime').length, outings=thisMonth.filter(e=>e.type==='sortie'||e.type==='special').length,mood=S.moods.filter(e=>monthKey(e.date)===monthKey(TODAY)),relation=mood.filter(m=>m.relation>0),positive=relation.filter(m=>m.relation>=4).length,[done,total]=taskCount(),spent=monthlyExpenses();let last7=Array.from({length:7},(_,i)=>{const d=addDay(TODAY,i-6),x=S.moods.find(m=>m.date===d);return {d,x}});return `<div class="grid-3" style="margin-bottom:20px"><div class="stat-tile"><div class="smallcaps">Moments 🔞 / mois</div><div class="stat-number">${intimes}</div><div class="stat-label">Dates enregistrées, sans jugement</div></div><div class="stat-tile"><div class="smallcaps">Ressentis positifs</div><div class="stat-number">${relation.length?Math.round(positive/relation.length*100)+' %':'—'}</div><div class="stat-label">Sur ${relation.length} jour(s) renseigné(s)</div></div><div class="stat-tile"><div class="smallcaps">Moments à deux</div><div class="stat-number">${outings}</div><div class="stat-label">Sorties et dates spéciales ce mois-ci</div></div><div class="stat-tile"><div class="smallcaps">Tâches achevées</div><div class="stat-number">${total?Math.round(done/total*100)+' %':'—'}</div><div class="stat-label">${done} tâche(s) sur ${total}</div></div><div class="stat-tile"><div class="smallcaps">Dépenses communes saisies</div><div class="stat-number" style="font-size:25px">${fmt(spent)}</div><div class="stat-label">FCFA ce mois-ci, toutes visibilités</div></div><div class="stat-tile"><div class="smallcaps">Souvenirs</div><div class="stat-number">${S.memories.length}</div><div class="stat-label">Moments précieux enregistrés</div></div></div><div class="grid-even"><section class="card"><div class="card-title"><h3>Ressenti relationnel</h3><span class="smallcaps">7 derniers jours</span></div><div class="chart">${last7.map(o=>`<div class="chart-column" function actions(e){const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='close-out'&&e.target!==b)return;sonsAction(a);if(emotionAction(a)||editAction(a)||syncAction(a)||albumAction(a)||notifAction(a)||penseeAction(a))return;if(a==='close'||a==='close-out'){close();return}if(a.startsWith('nav:')){page=a.split(':')[1];window.scrollTo(0,0);render();return}if(a.startsWith('sub:')){page='us';sub=a.split(':')[1];window.scrollTo(0,0);render();return}if(a.startsWith('tab:')){sub=a.split(':')[1];render();return}if(a.startsWith('cal-view:')){calView=a.split(':')[1];render();return}if(a==='cal-prev'||a==='cal-next'){if(calView==='month')changeMonth(a==='cal-prev'?-1:1);else{selected=addDay(selected,(a==='cal-prev'?-1:1)*(calView==='week'?7:1));month=monthKey(selected)}render();return}if(a==='cal-today'){month=monthKey(TODAY);selected=TODAY;render();return}if(a.startsWith('select-date:')){selected=a.split(':')[1];month=monthKey(selected);render();return}if(a.startsWith('theme:')){S.theme=a.split(':')[1];persist();render();modal={type:'settings'};render();return}if(a.startsWith('new-')||a==='edit-budget'||a==='settings'){modal={type:a};render();return}if(a.startsWith('delete-event:')){if(confirmDel('Supprimer cet événement ?')){S.events=S.events.filter(x=>x.id!==a.split(':')[1]);persist();render()}return}if(a.startsWith('delete-expense:')){if(confirmDel('Supprimer cette dépense ?')){S.expenses=S.expenses.filter(x=>x.id!==a.split(':')[1]);persist();render()}return}if(a.startsWith('delete-goal:')){if(confirmDel('Supprimer cet objectif ?')){S.goals=S.goals.filter(x=>x.id!==a.split(':')[1]);persist();render()}return}if(a.startsWith('delete-project:')){if(confirmDel('Supprimer le projet et toutes ses tâches ?')){S.projects=S.projects.filter(x=>x.id!==a.split(':')[1]);persist();render()}return}if(a.startsWith('delete-task:')){const [,pid,tid]=a.split(':');let p=S.projects.find(p=>p.id===pid);if(p)p.tasks=p.tasks.filter(t=>t.id!==tid);persist();rende // Connected mode: both partners share one Apps Script service (serveur/Code.gs). The phone keeps everything
// (immediate display, offline entries) and sends each change as soon as the network allows. Without
// window.ENTRE_NOUS_CONFIG.api, the app stays the local demonstration, untouched.
const SYNC_CFG = (typeof window !== 'undefined' && window.ENTRE_NOUS_CONFIG) || {};
const SYNC_MODE = !SYNC_CFG.api ? 'demo' : SYNC_CFG.api === 'banc' ? 'banc' : 'ligne';
const SYNC_PARAMS = new URLSearchParams(typeof location !== 'undefined' ? location.search : '');
const SYNC_KEY = KEY + ':sync';
const SYNC_COLS = ['events', 'projects', 'expenses', 'goals', 'expectations', 'rules', 'memories', 'media', 'documents', 'pensees', 'emotionEntries'];
const SYNC_EMPTY = { jeton: '', me: '', file: [], base: null, version: 0, maj: 0, partenaireActif: true, noms: {}, dernierProfil: 'partner-a' };
function syncRead() { try { return Object.assign({}, SYNC_EMPTY, JSON.parse(localStorage.getItem(SYNC_KEY)) || {}); } catch (e) { return Object.assign({}, SYNC_EMPTY); } }
let SY = syncRead();
const syncRun = { busy: false, again: false, etat: 'ok', timer: null, wrote: 0, polling: false };
function syncSave() { try { localStorage.setItem(SYNC_KEY, JSON.stringify(SY)); } catch (e) { /* stockage plein ou bloqué */ } }
function syncConnected() { return SYNC_MODE !== 'demo' && !!SY.jeton; }
const partnerOf = owner => owner === 'partner-a' ? 'partner-b' : 'partner-a';
const syncId = () => typeof crypto !== 'undefined' && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);
function syncError(message, code) { const e = new Error(message); e.code = code || ''; return e; }

// First opening of the connected app: no demo couple, only the example rules offered as ideas.
// A function declaration on purpose: load() calls it before this file's constants exist.
function emptyState() {
  const s = seed();
  return Object.assign(s, { couple: { ...s.couple, first: '', second: '' }, events: [], moods: [], projects: [], expenses: [], goals: [], expectations: [], memories: [], media: [], documents: [], pensees: [], emotionEntries: [], rules: s.rules.filter(r => r.status === 'example'), demo: false });
}

// Options: delai (ms, 12 s by default) and essais (3 by default; 1 for a file chunk, whose resumption is checked first).
function syncCall(fn, args, opts) {
  const delai = (opts && opts.delai) || 12000, essais = (opts && opts.essais) || 3;
  const body = JSON.stringify({ fn, args: Object.assign({ jeton: SY.jeton }, args || {}) });
  let sending;
  if (SYNC_MODE === 'banc') sending = new Promise((ok, ko) => {
    const go = () => {
      if (SYNC_PARAMS.get('horsligne') || window.ENTRE_NOUS_HORS_LIGNE) return ko(syncError('Connexion impossible pour le moment.', 'reseau'));
      try { ok(JSON.parse(JSON.stringify(window.ENTRE_NOUS_SERVEUR.traiter(JSON.parse(body))))); } catch (e) { ko(e); }
    };
    const slow = +(SYNC_PARAMS.get('lent') || 0); slow ? setTimeout(go, slow) : go();
  });
  else sending = (async () => {
    for (let attempt = 0; ; attempt++) {
      try {
        const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), delai);
        const r = await fetch(SYNC_CFG.api, { method: 'POST', body, headers: { 'Content-Type': 'text/plain;charset=utf-8' }, signal: ctl.signal });
        clearTimeout(t); return await r.json();
      } catch (e) { if (attempt >= essais - 1) throw syncError('Connexion impossible pour le moment.', 'reseau'); await new Promise(r => setTimeout(r, 1200 * (attempt + 1))); }
    }
  })();
  return sending.then(rep => { if (!rep || !rep.ok) throw syncError((rep && rep.erreur) || 'Erreur inconnue.', rep && rep.code); return rep; });
}

// What this profile may send: shared items, its own private ones, its own feelings. The partner's feelings are read-only here.
function syncWritable() {
  const me = SY.me, out = { couple: { couple: { first: S.couple.first, second: S.couple.second, stage: S.couple.stage, budget: S.budget } } };
  for (const col of SYNC_COLS) {
    out[col] = {};
    for (const item of S[col] || []) {
      if (!item || !item.id || (col === 'rules' && item.status === 'example') || ((col === 'emotionEntries' || col === 'pensees') && item.ownerId !== me)) continue;
      if ((col === 'expectations' || col === 'expenses') && !item.ownerId) item.ownerId = me;
      if (col === 'rules' && !item.proposedBy) item.proposedBy = me;
      out[col][item.id] = item;
    }
  }
  return out;
}
const syncSnapshot = docs => Object.fromEntries(Object.entries(docs).map(([col, items]) => [col, Object.fromEntries(Object.entries(items).map(([id, d]) => [id, JSON.stringify(d)]))]));
// Called by persist(): every change made anywhere in the app becomes a queued operation, compared with the last known server state.
function syncAfterPersist() {
  if (!syncConnected() || !SY.base) return;
  const now = syncWritable(), ops = [];
  for (const col of Object.keys(now)) {
    const before = SY.base[col] || {};
    for (const id of Object.keys(now[col])) { const json = JSON.stringify(now[col][id]); if (before[id] !== json) ops.push({ op: 'put', col, id, doc: JSON.parse(json) }); }
    for (const id of Object.keys(before)) if (!(id in now[col])) ops.push({ op: 'del', col, id });
  }
  if (!ops.length) return;
  for (const op of ops) { op.opId = syncId(); SY.file = SY.file.filter(o => !(o.col === op.col && o.id === op.id)); SY.file.push(op); }
  SY.base = syncSnapshot(now);
  syncSave(); syncPlan();
}
function syncPlan() { clearTimeout(syncRun.timer); syncRun.timer = setTimeout(syncFlush, 500); syncBadge(); }
async function syncFlush() {
  if (!syncConnected()) return;
  if (syncRun.busy) { syncRun.again = true; return; }
  syncRun.busy = true; syncBadge();
  let rejected = false;
  try {
    while (SY.file.length) {
      const batch = SY.file.slice(0, syncRun.oneByOne ? 1 : 40);
      try { const r = await syncCall('ecrire', { ops: batch }); SY.version = r.version; syncRun.wrote = Date.now(); }
      catch (x) {
        if (x.code === 'reseau' || x.code === 'serveur' || x.code === 'session') throw x;
        // Refused by the service: find the operation at fault, set it aside and let the others leave.
        if (batch.length > 1) { syncRun.oneByOne = true; continue; }
        rejected = true; toast('Une modification n’a pas pu être enregistrée : ' + x.message);
      }
      const sent = new Set(batch.map(o => o.opId));
      SY.file = SY.file.filter(o => !sent.has(o.opId));
      SY.maj = Date.now(); syncSave();
    }
    syncRun.oneByOne = false; syncRun.etat = 'ok';
  } catch (e) {
    syncRun.busy = false;
    if (e.code === 'session') return syncLogout('Votre session a expiré : entrez de nouveau votre code. Vos saisies sont gardées.', false);

  }

async function syncRefresh() {

    if (r.version < SY.version && Date.now() - syncRun.wrote < 60000) { syncBadge(); return; }   // answer older than our last write
    const data = r.data || {};
    for (const op of SY.file) { data[op.col] = data[op.col] || {}; if (op.op === 'put') data[op.col][op.id] = op.doc; else delete data[op.col][op.id]; }
    const firstRun = !(data.couple || {}).couple;
    syncApply(data, r);
    if (!SY.file.length) syncRun.etat = 'ok';
    // The welcome form closes by itself once the partner has entered the names, unless someone is typing in it.
    const typing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if (modal && modal.welcome && !firstRun && !typing) modal = null;
    syncRedraw();
    if (firstRun && !modal) { modal = { type: 'settings', welcome: true }; render(); toast('Bienvenue ♡ Commencez par vos deux prénoms.'); }
    if (SY.file.length) syncFlush();
  } catch (e) {
    if (e.code === 'session') return syncLogout('Votre session a expiré : entrez de nouveau votre code. Vos saisies sont gardées.', false);
    syncRun.etat = 'horsligne'; syncBadge();
  }
}
function syncApply(data, r) {
  const examples = S.rules.filter(x => x.status === 'example');
  for (const col of SYNC_COLS) S[col] = Object.values(data[col] || {});
  S.rules = S.rules.concat(examples);
  S.couple = { ...S.couple, id: r.coupleId || S.couple.id };
  const c = (data.couple || {}).couple;
  if (c) { S.couple.first = c.first || ''; S.couple.second = c.second || ''; S.couple.stage = c.stage || S.couple.stage; if (typeof c.budget === 'number') S.budget = c.budget; }
  // The couple identifier is the service's; partners' entries are matched on it locally.
  for (const e of S.emotionEntries) e.coupleId = S.couple.id;
  SY.me = r.profil || SY.me; SY.version = r.version; if (r.stock) SY.stock = r.stock; SY.maj = Date.now(); SY.partenaireActif = !!r.partenaireActif;
  SY.noms = { 'partner-a': S.couple.first, 'partner-b': S.couple.second };
  SY.base = syncSnapshot(syncWritable());
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* stockage plein ou bloqué */ }

}
// A background update never wipes what someone is typing: an open form or a focused field waits for the next render.
function syncRedraw() {

  render();
}

  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - SY.maj > 30000) syncRefresh(); });

// Photos, videos and documents of the couple (served by serveur/Code.gs, « fichiers du couple »).
// Connected: sent to the couple's Google Drive through the service, 4 MB at a time, and read back the same way.
// Demonstration: kept in this browser only (IndexedDB). Either way a local copy avoids downloading a file twice.
const FIC_MO = 1048576;
const FIC = {
  // Technical limits, shown to the couple: a photo is reduced before leaving the phone; a video travels as it is.
  limites: { photo: 40 * FIC_MO, video: 100 * FIC_MO, document: 25 * FIC_MO },
  morceau: 4 * FIC_MO, direct: 3 * FIC_MO, cache: 300 * FIC_MO,
  photo: { cote: 2048, qualite: 0.86 }, vignette: { cote: 420, qualite: 0.72 },
  envois: [], actif: false, reprise: null, timer: null,
  vignettes: new Map(), attente: new Set(), lecture: new Map(), pleins: new Map(), memoire: new Map(),
};
const FIC_VIDE = 'data:image/gif;base64,R0lGODlhAQABAAAAACw=';
const ficPause = ms => new Promise(r => setTimeout(r, ms));

/* ------------------------------------------------------------------ local store (IndexedDB, else memory) */
let ficBaseP = null;
function ficBase() {
  return ficBaseP || (ficBaseP = new Promise((ok, ko) => {
    if (typeof indexedDB === 'undefined') return ko(new Error('IndexedDB absent'));
    const r = indexedDB.open('entre-nous-fichiers', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('fichiers'); r.result.createObjectStore('envois'); };
    r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error);
  }));
}
async function ficIdb(store, mode, fn) {
  const db = await ficBase();
  return new Promise((ok, ko) => { const t = db.transaction(store, mode), r = fn(t.objectStore(store)); t.oncomplete = () => ok(r && r.result); t.onerror = t.onabort = () => ko(t.error); });
}
// Keys are prefixed with this app's storage key: the demonstration, the test bench and the real app never mix.
const ficCle = id => KEY + '|' + id;
async function ficLocal(id) {
  if (FIC.memoire.has(id)) return FIC.memoire.get(id);
  try { return await ficIdb('fichiers', 'readonly', s => s.get(ficCle(id))); } catch (e) { return undefined; }
}
async function ficGarder(id, blob, garde) {
  const v = { blob, t: Date.now(), taille: blob.size, garde: !!garde };
  try { await ficIdb('fichiers', 'readwrite', s => s.put(v, ficCle(id))); } catch (e) { if (garde) FIC.memoire.set(id, v); }
}
function ficOublier(ids) { for (const id of ids.filter(Boolean)) { FIC.memoire.delete(id); ficIdb('fichiers', 'readwrite', s => s.delete(ficCle(id))).catch(() => {}); const u = FIC.vignettes.get(id); if (u) { URL.revokeObjectURL(u); FIC.vignettes.delete(id); } } }
// Downloaded copies beyond 300 MB: the oldest go first (files only kept here, in the demonstration, never do).
async function ficRanger() {
  try {
    const db = await ficBase(), L = [];
    await new Promise(ok => { const t = db.transaction('fichiers', 'readonly'), c = t.objectStore('fichiers').openCursor(); c.onsuccess = () => { const x = c.result; if (!x) return ok(); if (String(x.key).startsWith(KEY + '|') && !x.value.garde) L.push([x.key, x.value.taille || 0, x.value.t || 0]); x.continue(); }; t.onerror = () => ok(); });

}

/* ------------------------------------------------------------------ base64 */
const ficEnBase64 = blob => new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.onerror = () => ko(r.error); r.readAsDataURL(blob); });
const ficDeBase64 = (b64, type) => fetch('data:application/octet-stream;base64,' + b64).then(r => r.blob()).then(b => new Blob([b], { type: type || 'application/octet-stream' }));

/* ------------------------------------------------------------------ sending and reading */
// Returns { id, taille }. Demonstration: the file stays in this browser.
async function ficEnvoyer(blob, rubrique, nom, job, progres) {
  if (!syncConnected()) { const id = 'loc-' + syncId(); await ficGarder(id, blob, true); progres(blob.size); return { id, taille: blob.size }; }
  const base = { rubrique, nom, type: blob.type || 'application/octet-stream', taille: blob.size };
  if (blob.size <= FIC.direct) { const r = await syncCall('fichierDebut', Object.assign({ donnees: await ficEnBase64(blob) }, base), { delai: 90000 }); progres(blob.size); return r.fichier; }
  let debut = 0, essais = 0;
  if (job && job.envoi) {   // resumed after a closed app or a lost network: Drive says where it stopped
    try { const st = await syncCall('fichierEtat', { envoi: job.envoi }, { delai: 30000 }); if (st.fini) return st.fichier; debut = st.recu; }
    catch (e) { if (e.code !== 'envoi') throw e; job.envoi = ''; }
  }
  if (!job || !job.envoi) { const r = await syncCall('fichierDebut', base, { delai: 30000 }); if (job) { job.envoi = r.envoi; ficSauverEnvoi(job); } else base.envoi = r.envoi; }
  const envoi = job ? job.envoi : base.envoi;
  for (;;) {
    progres(debut);
    try {
      const r = await syncCall('fichierMorceau', { envoi, debut, donnees: await ficEnBase64(blob.slice(debut, debut + FIC.morceau)) }, { delai: 120000, essais: 1 });
      if (r.fini) { progres(blob.size); return r.fichier; }
      debut = r.recu; essais = 0;
    } catch (e) {
      if ((e.code !== 'reseau' && e.code !== 'serveur') || ++essais > 4) throw e;
      await ficPause(2500 * essais);
      const st = await syncCall('fichierEtat', { envoi }, { delai: 30000 });
      if (st.fini) return st.fichier;
      debut = st.recu;
    }
  }
}
// Whole file as a Blob: local copy first, else 4 MB at a time from the service. One download per file at once.
function ficBlob(id, type, taille, progres) {
  if (FIC.lecture.has(id)) return FIC.lecture.get(id);
  const p = (async () => {
    const l = await ficLocal(id);
    if (l && l.blob) { if (!l.garde) ficGarder(id, l.blob); return l.blob; }
    if (!syncConnected()) throw syncError('Ce fichier n’est pas sur cet appareil.', 'absent');
    const parts = []; let recu = 0;
    do {
      const r = await syncCall('fichierLire', { id, debut: recu }, { delai: 120000 });
      const b = await ficDeBase64(r.donnees, type); parts.push(b); recu += b.size; taille = r.taille;
      if (progres) progres(recu / taille);
    } while (recu < taille);
    const blob = new Blob(parts, { type: type || 'application/octet-stream' });
    await ficGarder(id, blob); ficRanger();
    return blob;
  })();
  FIC.lecture.set(id, p);
  p.then(() => FIC.lecture.delete(id), () => FIC.lecture.delete(id));
  return p;
}
// Full-size files open in the viewer keep their address while they are shown (six at most).
function ficPlein(id) { return FIC.pleins.get(id) || null; }
function ficTenir(id, blob) {
  if (FIC.pleins.has(id)) return FIC.pleins.get(id);
  const v = { blob, url: URL.createObjectURL(blob) }; FIC.pleins.set(id, v);
  while (FIC.pleins.size > 6) { const [k, x] = FIC.pleins.entries().next().value; URL.revokeObjectURL(x.url); FIC.pleins.delete(k); }
  return v;
}

/* ------------------------------------------------------------------ thumbnails */
function ficVignetteUrl(id) { if (!id) return FIC_VIDE; const u = FIC.vignettes.get(id); if (u) return u; FIC.attente.add(id); return FIC_VIDE; }
function ficPoserVignette(id, blob) { if (!FIC.vignettes.has(id)) FIC.vignettes.set(id, URL.createObjectURL(blob)); document.querySelectorAll(`img[data-vignette="${CSS.escape(id)}"]`).forEach(i => { i.src = FIC.vignettes.get(id); }); }
async function ficChargerVignettes() {
  const ids = [...FIC.attente]; FIC.attente.clear();
  if (!ids.length) return;
  const manque = [];
  for (const id of ids) { const l = await ficLocal(id); if (l && l.blob) ficPoserVignette(id, l.blob); else manque.push(id); }

/* ------------------------------------------------------------------ preparing photos and videos */
function ficImage(file) {

}

/* ------------------------------------------------------------------ sending queue (kept across closings) */
// job: { id, mode, col: 'media' | 'documents', fichier, nom, type, doc, etat: 'attente' | 'envoi' | 'erreur', fait, total, erreur, envoi }
const ficEnAttente = () => FIC.envois.filter(j => j.etat !== 'erreur').length;
function ficSauverEnvoi(job) { const { erreur, ...v } = job; ficIdb('envois', 'readwrite', s => s.put(v, job.id)).catch(() => {}); }

  const t = file.type || '';

  if (t.startsWith('video/') || /\.(mov|mp4|m4v|webm)$/i.test(file.name || '')) return 'video';
  return '';
}
// Adds chosen files to the queue. quoi: { col: 'media', memoryId } or { col: 'documents', categorie, note }. Returns the refusals.
function ficAjouter(files, quoi) {

  for (const file of files) {
    const sorte = quoi.col === 'media' ? ficSorte(file) : 'document', max = FIC.limites[sorte];
    if (!sorte) { refus.push(`${file.name} : ni photo ni vidéo.`); continue; }

// Notifications on the phone (serveur/Code.gs, « notifications »): each addition by one partner reaches the other's
// phone, even locked. The signal is empty; the service worker (web/sw.js) asks the service for the text with this session.
// On iPhone: iOS 16.4 or later, and Entre Nous opened from its home-screen icon.
const NOTIF_SESSION = 'entre-nous-session';
const NOTIF = { etat: null, lecture: null };
const notifIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const notifIcone = () => navigator.standalone === true || !!(window.matchMedia && matchMedia('(display-mode: standalone)').matches);

function notifSession() {
  if (typeof caches === 'undefined' || SYNC_MODE !== 'ligne') return;
  caches.open(NOTIF_SESSION).then(c => SY.jeton ? c.put('./session', new Response(JSON.stringify({ api: SYNC_CFG.api, jeton: SY.jeton }), { headers: { 'Content-Type': 'application/json' } })) : c.delete('./session')).catch(() => {});
}
function notifLireEtat() {
  if (NOTIF.lecture) return NOTIF.lecture;

    try { const reg = await navigator.serviceWorker.getRegistration(), sub = reg && await reg.pushManager.getSubscription(); NOTIF.etat = { possible: true, permission: Notification.permission, sub }; }
    catch (e) { NOTIF.etat = { possible: true, permission: Notification.permission, sub: null }; }
    return NOTIF.etat;
  })().finally(() => { NOTIF.lecture = null; });

}
// Redraws only the notification blocks: an open settings form keeps what is being typed.
async function notifMaj() {
  if (SYNC_MODE !== 'ligne') return;
  await notifLireEtat();
  document.querySelectorAll('[data-notif]').forEach(el => { el.innerHTML = notifContenu(); });
  document.querySelectorAll('[data-notif-invite]').forEach(el => { el.outerHTML = notifInvitation(); });
}
function notifContenu() {
  if (SYNC_MODE === 'demo') return '<p class="quiet small">Dans l’application connectée, chaque ajout de l’un prévient le téléphone de l’autre, même verrouillé.</p>';
  if (SYNC_MODE === 'banc') return '<p class="quiet small">Banc d’essai : les notifications se règlent depuis l’application installée sur le téléphone.</p>';
  const N = NOTIF.etat;
  if (!N) { notifMaj(); return '<p class="quiet small">…</p>'; }
  const intro = `<p class="quiet small">Quand ${esc(personName(partnerOf(SY.me)))} ajoute quelque chose (souvenir, photo, document, rendez-vous, dépense commune, ressenti…), ce téléphone vous prévient, même verrouillé.</p>`;
  if (notifIOS() && !notifIcone()) return intro + '<div class="notice">Sur iPhone, les notifications ne marchent que depuis l’icône Entre Nous : dans Safari, touchez <b>Partager</b> › <b>Sur l’écran d’accueil</b>, puis ouvrez Entre Nous depuis cette icône et revenez ici.</div>';
  if (!N.possible) return intro + '<div class="notice">Ce navigateur ne permet pas les notifications. Sur iPhone, il faut iOS 16.4 ou plus récent et l’icône sur l’écran d’accueil.</div>';
  if (N.permission === 'denied') return intro + `<div class="notice">Les notifications sont refusées pour Entre Nous. ${notifIOS() ? 'Sur iPhone : <b>Réglages</b> › <b>Notifications</b> › <b>Entre Nous</b> › <b>Autoriser les notifications</b>.' : 'Dans Chrome : touchez le cadenas à gauche de l’adresse › <b>Autorisations</b> › <b>Notifications</b> › <b>Autoriser</b>.'}</div>`;

  if (N.sub) return intro + `<p><b>✓ Activées sur ce téléphone.</b></p>${discret}<div class="notif-boutons">${button('Envoyer un essai', 'notif-essai', 'btn sm soft')}${button('Désactiver', 'notif-off', 'btn sm ghost danger')}</div>`;

// Invitation under the status banner, as long as this phone can receive notifications and has not been asked yet.

async function notifActiver() {
  try {
    const perm = await Notification.requestPermission();   // first step after the touch: required by the iPhone
    if (perm !== 'granted') { toast('Notifications non autorisées sur ce téléphone.'); return; }
    const { cle } = await syncCall('notifCle', {});
    const reg = await navigator.serviceWorker.ready;
    const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: notifOctets(cle) });
    notifSession();
    await syncCall('notifAbonner', { sub: sub.toJSON(), discret: notifDiscret(), appareil: notifAppareil() });

  } catch (e) { toast(e.message || 'Activation impossible.'); }

}

  try {

    if (sub) { await syncCall('notifDesabonner', { endpoint: sub.endpoint }).catch(() => {}); await sub.unsubscribe(); }

  } catch (e) { toast(e.message || 'Désactivation impossible.'); }

// Leaving this phone: the session token is captured now, before the sign-out clears it.
function notifOublierAppareil() {
  if (SYNC_MODE !== 'ligne' || !notifPossible()) return;

  navigator.serviceWorker.getRegistration().then(reg => reg && reg.pushManager.getSubscription()).then(sub => {

  }).catch(() => {});
}
function notifAction(a) {
  if (a === 'notif-on') { notifActiver(); return true; }
  if (a === 'notif-off') { if (confirmDel('Ne plus recevoir de notifications sur ce téléphone ?')) notifDesactiver(); return true; }
  if (a === 'notif-essai') { notifSession(); syncCall('notifEssai', {}).then(r => toast(r.envoyes ? 'Essai envoyé : la notification arrive dans quelques secondes.' : 'L’essai n’a pas pu partir.')).catch(e => toast(e.message)); return true; }
  return false;
}
function notifChanged(e) {
  if (e.target.dataset.change !== 'notif-discret') return false;
  try { localStorage.setItem(KEY + ':notif-discret', e.target.checked ? '1' : '0'); } catch (x) { /* stockage bloqué */ }

  const x = (S.pensees || []).find(y => y.ownerId === penseeMoi() && y.date === TODAY);
  const corps = `<div class="segmented pensee-genres" role="radiogroup" aria-label="Genre">${PENSEE_GENRES.map(g => `<label class="${(x?.genre || 'pensee') === g[0] ? 'active' : ''}"><input type="radio" name="genre" value="${g[0]}" ${(x?.genre || 'pensee') === g[0] ? 'checked' : ''} data-change="pensee-genre"> ${g[2]} ${g[1]}</label>`).join('')}</div><div class="field"><label for="f-texte">Votre pensée du jour</label><textarea id="f-texte" name="texte" maxlength="280" required placeholder="Ex. : Merci pour ta patience ce matin ♡">${esc(x?.texte || '')}</textarea></div>${field('auteur', 'Auteur (pour une citation, facultatif)', 'text', x?.auteur || '', 'maxlength="80" placeholder="Ex. : Antoine de Saint-Exupéry"')}<p class="quiet small">Elle s’affiche à l’Accueil, chez vous deux, jusqu’à la prochaine. ${esc(personName(partnerOf(penseeMoi())))} est prévenu·e.</p>`;
  return `<div class="modal-backdrop" data-action="close-out"><div role="dialog" aria-modal="true" aria-label="Ma pensée du jour" class="modal"><div class="modal-head"><h2>Ma pensée du jour</h2>${button('×', 'close', 'btn ghost sm')}</div><form id="modal-form" data-form="submit-pensee">${corps}<div class="form-actions">${x ? button('Effacer', 'pensee-effacer', 'btn danger') : ''}${button('Annuler', 'close', 'btn')}<button type="submit" class="btn primary">Partager</button></div></form></div></div>`;
}
function penseeAction(a) {
  if (a === 'pensee-ecrire') { modal = { type: 'pensee' }; render(); return true; }
  if (a === 'pensee-effacer') {
    if (confirmDel('Effacer votre pensée du jour ?')) { S.pensees = (S.pensees || []).filter(y => !(y.ownerId === penseeMoi() && y.date === TODAY)); persist(); modal = null; render(); }
    return true;
  }
  return false;
}
function penseeChanged(e) {
  if (e.target.dataset.change !== 'pensee-genre') return false;
  e.target.closest('.pensee-genres').querySelectorAll('label').forEach(l => l.classList.toggle('active', l.contains(e.target)));
  return true;
}
function penseeSubmitted(action, d) {
  if (action !== 'submit-pensee') return false;
  const texte = String(d.texte || '').trim().slice(0, 280);
  if (!texte) { toast('Écrivez quelques mots.'); return true; }
  const moi = penseeMoi(), L = (S.pensees = S.pensees || []);
  let x = L.find(y => y.ownerId === moi && y.date === TODAY);
  if (!x) { x = { id: syncId(), ownerId: moi, date: TODAY, createdAt: new Date().toISOString() }; L.push(x); }
  Object.assign(x, { texte, genre: PENSEE_GENRES.some(g => g[0] === d.genre) ? d.genre : 'pensee', auteur: String(d.auteur || '').trim().slice(0, 80), updatedAt: new Date().toISOString() });
  persist(); modal = null; render(); sonsJouer('enregistrer'); toast(syncConnected() ? 'Pensée partagée. ♡' : 'Pensée enregistrée dans ce navigateur. ♡');
  return true;
}

const app=$('#app');app.addEventListener('click',actions);app.addEventListener('change',changed);app.addEventListener('submit',submitted);app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id?.startsWith('task-')){e.preventDefault();const id=e.target.id.slice(5);const v=e.target.value.trim();if(v){S.projects.find(p=>p.id===id)?.tasks.push({id:Math.random().toString(36).slice(2,10),name:v,done:false});persist();render()}}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)close()});syncStart();
})();
</script>
</body>
</html>

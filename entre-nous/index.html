/* Accueil : « Bonjour, … » qui se met au point, cœur qui bat et envoie des ondes */

.salut-coeur{position:relative;display:inline-block;width:.82em;height:.82em;vertical-align:-.06em;margin-left:.08em;transform-origin:50% 60%;animation:salut-bat 1.6s ease-in-out infinite}

.salut-coeur::after{animation-delay:.25s}

function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&x.events&&x.projects){if(!x.emotionSchemaVersion&&!localStorage.getItem(KEY+':before-emotions-v2')){try{localStorage.setItem(KEY+':before-emotions-v2',JSON.stringify(x))}catch(e){}}return x}}catch(e){}return window.ENTRE_NOUS_CONFIG&&window.ENTRE_NOUS_CONFIG.api?emptyState():seed()}

function pageHead(kicker,title,desc,actions=''){return `<div class="welcome"><div><div class="eyebrow">${kicker}</div><h1 class="display">${title}</h1><p class="lede">${desc}</p></div>${actions}</div>`}
function renderPage(){switch(page){case'calendar':return emotionCalendar();case'projects':return projects();case'finance':return finance();case'us':return us();default:return home()}}
function evList(evs,withRemove=false){evs=visibleEvents(evs);return evs.length?evs.map(e=>`<div class="event-line"><div class="date-chip"><b>${Number(e.date.slice(-2))}</b><span>${new Date(e.date+'T12:00').toLocaleDateString('fr-FR',{month:'short'})}</span></div><span class="event-symbol">${e.type==='intime'&&!S.privacy.showIntimacy?'🔒':TYPES[e.type]?.emoji||'📅'}</span><div class="event-desc"><b>${e.type==='intime'&&!S.privacy.showIntimacy?'Moment privé':esc(e.title)}</b><small>${TYPES[e.type]?.name||'Événement'} · ${fullDate(e.date)}${e.lieu&&!(e.type==='intime'&&!S.privacy.showIntimacy)?' · 📍 '+esc(e.lieu):''}</small></div>${withRemove?`${e.type==='intime'&&!S.privacy.showIntimacy?'':editButton('event',e,'Modifier l’événement')}<button class="remove" title="Supprimer" data-action="delete-event:${e.id}">×</button>`:''}</div>`).join(''):`<div class="empty">Aucun événement pour le moment.<br>Ajoutez une date importante pour commencer.</div>`}
function upcoming(n=3){return visibleEvents([...S.events]).filter(e=>e.date>=TODAY).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,n)}
function monthlyExpenses(){return S.expenses.filter(e=>monthKey(e.date)===monthKey(TODAY)).reduce((a,e)=>a+Number(e.amount),0)}
function taskCount(){const all=S.projects.flatMap(p=>p.tasks);return [all.filter(t=>t.done).length,all.length]}
function moodToday(){return S.moods.find(m=>m.date===TODAY)||{personal:0,relation:0,note:''}}

on</div><div class="stat-number">${EmotionCore.day(S,TODAY,emotionViewer).common === null ? '—' : EmotionCore.emoji(EmotionCore.day(S,TODAY,emotionViewer).common)}</div><div class="stat-label">Mood commun · deux réponses partagées</div></div></div></section><section class="card"><div class="card-title"><h3>Notre budget</h3>${button(svg('arrow'),'nav:finance','btn ghost sm')}</div><div class="section-hint"><span>Utilisé ce mois</span><b class="small">${fmt(spent)} / ${fmt(S.budget)} FCFA</b></div><div class="progress" style="margin:13px 0 10px"><div style="width:${Math.min(100,S.budget?spent/S.budget*100:0)}%"></div></div><p class="quiet small" style="line-height:1.6">Visualisez vos dépenses et faites grandir vos projets communs.</p></section><section class="card"><div class="card-title"><h3>Nos engagements</h3>${button(svg('arrow'),'sub:agreements','btn ghost sm')}</div><p class="quiet small" style="line-height:1.75">Exprimer nos attentes, construire des accords, évoluer sans jamais se juger.</p><div style="background:var(--bg);padding:14px;border-radius:13px;font:italic 18px/1.55 var(--serif)">« Écouter pour comprendre, pas seulement pour répondre. »</div>${button('Découvrir notre charte','sub:agreements','btn soft sm')}</section></div></div>`}
function calendar(){const year=Number(month.slice(0,4)),mo=Number(month.slice(5,7))-1,start=new Date(year,mo,1),offset=(start.getDay()+6)%7,days=new Date(year,mo+1,0).getDate(),gridN=Math.ceil((offset+days)/7)*7;
const cells=Array.from({length:gridN},(_,i)=>{let date=dstr(new Date(year,mo,i-offset+1)),d=Number(date.slice(-2)),isMonth=date.slice(0,7)===month,evs=S.events.filter(e=>e.date===date);return `<button class="day ${isMonth?'':'outside'} ${date===TODAY?'today':''} ${selected===date?'selected':''}" data-action="select-date:${date}" aria-label="${fullDate(date)}"><span class="day-number">${d}</span><div class="day-emojis">${evs.slice(0,4).map(e=>`<span title="${esc(e.type==='intime'?'Moment intime':e.title)}">${e.type==='intime'&&!S.privacy.showIntimacy?'🔒':TYPES[e.type]?.emoji||'📅'}</span>`).join('')}</div>${evs.length?`<div class="cal-chip">${evs.length} événement${evs.length>1?'s':''}</div>`:''}</button>`}).join('');
const dayEv=S.events.filter(e=>e.date===selected);let body='';if(calView==='month'){body=`<div class="cal-weekdays">${['LUN','MAR','MER','JEU','VEN','SAM','DIM'].map(s=>`<div>${s}</div>`).join('')}</div><div class="cal-grid">${cells}</div>`}else if(calView==='week'){const day=new Date(selected+'T12:00');const mon=addDay(selected,-(day.getDay()+6)%7);body=`<div class="grid-3" style="grid-template-columns:repeat(auto-fit,minmax(135px,1fr))">${Array.from({length:7},(_,i)=>{const dd=addDay(mon,i);let ev=S.events.filter(e=>e.date===dd);return `<button class="week-day ${selected===dd?'selected':''}" data-action="select-date:${dd}"><div class="smallcaps">${new Date(dd+'T12:00').toLocaleDateString('fr-FR',{weekday:'short'})}</div><b>${Number(dd.slice(-2))}</b><div style="font-size:23px">${ev.map(e=>e.type==='intime'&&!S.privacy.showIntimacy?'🔒':TYPES[e.type]?.emoji||'📅').join(' ')||'—'}</div></button>`}).join('')}</div>`}else{body=`<div class="date-banner">${fullDate(selected)}</div>${evList(dayEv,true)}`}
return `${pageHead('Tous nos instants','Notre <em>calendrier</em>','Rendez-vous, projets, souvenirs et moments intimes : l’histoire de votre quotidien.',button(`${svg('plus')} Nouvel événement`,'new-event','btn primary'))}<div class="card"><div class="calendar-head"><div class="month-title">${monthName(month+'-01').replace(/^./,c=>c.toUpperCase())}</div><div class="cal-controls"><div class="segmented">${['month','week','day'].map((v,i)=>`<button class="${calView===v?'active':''}" data-action="cal-view:${v}">${['Mois','Semaine','Jour'][i]}</button>`).join('')}</div>${iconBtn('back','cal-prev','Précédent')}${iconBtn('arrow','cal-next','Suivant')}${button('Aujourd’hui','cal-today','btn sm')}</div></div>${body}<div class="cal-legend"><span>🔞 Moments intimes</span><span>💝 Dates spéciales</span><span>📅 Rendez-vous</span><span>✅ Projets</span></div><div class="selected-date"><div class="selected-date-head"><b>${fullDate(selected)}</b>${button(`${svg('plus')} Ajouter`,'new-event','btn sm soft')}</div>${calView==='day'?'':evList(dayEv,true)}</div><div style="margin-top:13px" class="toggle-row"><div><b>Afficher les icônes 🔞</b><small>Visible par défaut dans les cases des jours concernés. À désactiver pour un affichage discret.</small></div><label class="switch"><input type="checkbox" data-change="intimacy" ${S.privacy.showIntimacy?'checked':''}/><span></span></label></div><div class="notice warning">Confidentialité : cette version enregistre localement les informations dans le navigateur, sans chiffrement spécifique ni synchronisation. Évitez les détails sensibles sur un appareil partagé.</div></div>`}
function projects(){const [done,total]=taskCount();return `${pageHead('Organiser demain','Nos <em>projets</em>','Des grandes ambitions aux petites tâches du quotidien, avançons ensemble.',button(`${svg('plus')} Nouveau projet`,'new-project','btn primary'))}<div class="grid-3" style="margin-bottom:20px"><div class="stat-tile"><div class="smallcaps">Projets actifs</div><div class="stat-number">${S.projects.length}</div><div class="stat-label">Objectifs partagés</div></div><div class="stat-tile"><div class="smallcaps">Tâches accomplies</div><div class="stat-number">${done} <span class="quiet" style="font:17px var(--sans)">/ ${total}</span></div><div class="stat-label">Étapes réalisées</div></div><div class="stat-tile"><div class="smallcaps">Progression globale</div><div class="stat-number">${total?Math.round(done/total*100):0}%</div><div class="progress"><div style="width:${total?done/total*100:0}%"></div></div></div></div><div class="grid-even">${S.projects.map(p=>{const done=p.tasks.filter(t=>t.done).length;return `<section class="project"><div class="project-head"><div><div class="proj-icon">${esc(p.emoji||'♡')}</div><h3>${esc(p.name)}</h3><div class="quiet tiny">Échéance : ${p.due?fullDate(p.due):'Non définie'}</div></div><div class="item-actions">${button('Modifier','edit-item:project:'+p.id,'btn ghost sm')}${button('Supprimer','delete-project:'+p.id,'btn ghost sm danger')}</div></div><div><div class="section-hint"><span class="small">Notre progression</span><span class="tiny quiet">${done} / ${p.tasks.length} étapes</span></div><div class="progress" style="margin-top:10px"><div style="width:${p.tasks.length?done/p.tasks.length*100:0}%"></div></div></div><div>${p.tasks.map(t=>`<div class="task ${t.done?'done':''}"><input type="checkbox" data-change="task:${p.id}:${t.id}" ${t.done?'checked':''} aria-label="Terminer ${esc(t.name)}"/><span class="task-text">${esc(t.name)}</span>${editButton('task',{id:p.id,name:t.name},'Renommer la tâche',':'+t.id)}<button data-action="delete-task:${p.id}:${t.id}" class="remove" title="Retirer la tâche">×</button></div>`).join('')||'<div class="quiet small">Aucune tâche pour le moment.</div>'}</div><div class="task-editor"><input id="task-${p.id}" placeholder="Ajouter une tâche…" aria-label="Nouvelle tâche"/><button data-action="add-task:${p.id}" aria-label="Ajouter une tâche">+</button></div></section>`}).join('')||'<div class="empty">Aucun projet encore. Créez votre premier projet commun.</div>'}</div>`}
function finance(){const spent=monthlyExpenses(),remaining=S.budget-spent,cat={};S.expenses.filter(x=>monthKey(x.date)===monthKey(TODAY)).forEach(e=>cat[e.category]=(cat[e.category]||0)+Number(e.amount));const max=Math.max(...Object.values(cat),1);return `${pageHead('Construire ensemble','Nos <em>finances</em>','Un espace simple pour suivre les dépenses communes et donner vie à vos projets.',button(`${svg('plus')} Ajouter une dépense`,'new-expense','btn primary'))}<div class="grid-2"><div class="stack"><section class="card budget-hero"><div class="finance-top"><div><div class="smallcaps">NOTRE BUDGET · ${monthName(TODAY).toUpperCase()}</div><div class="finance-amount">${fmt(remaining)} <span style="font:17px var(--sans)">FCFA</span></div><div class="finance-hero-note">Disponibles sur un budget mensuel de ${fmt(S.budget)} FCFA</div></div>${iconBtn('edit','edit-budget','Modifier le budget')}</div><div class="progress" style="margin:20px 0 10px"><div style="width:${Math.min(100,S.budget?spent/S.budget*100:0)}%"></div></div><div class="section-hint"><span class="small">${fmt(spent)} FCFA dépensés</span><span class="small">${S.budget?Math.round(spent/S.budget*100):0}% utilisés</span></div></section><section class="card"><div class="card-title"><h3>Nos dépenses</h3>${button(`${svg('plus')} Ajouter`,'new-expense','btn soft sm')}</div>${S.expenses.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10).map(e=>`<div class="finance-entry"><div class="finance-symbol">${depCatIcone(e.category)}</div><div class="entry-description"><b>${esc(e.name)}</b><small>${esc(e.category)} · ${fullDate(e.date)} · ${esc(e.paidBy)}${e.visibility==='prive'?' · 🔒 Privé':''}</small></div><div class="entry-amount">– ${fmt(e.amount)}</div>${editButton('expense',e,'Modifier la dépense')}<button class="remove" data-action="delete-expense:${e.id}" title="Supprimer">×</button></div>`).join('')||'<div class="empty">Ajoutez une dépense pour commencer.</div>'}</section></div><div class="stack"><section class="card"><div class="card-title"><h3>Répartition du mois</h3><span class="smallcaps">Dépenses</span></div>${Object.keys(cat).length?`<div class="bar-rows">${Object.entries(cat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="bar-row"><span>${depCatIcone(k)} ${esc(k)}</span><div class="progress"><div style="width:${Math.round(v/max*100)}%"></div></div><span>${fmt(v)}</span></div>`).join('')}</div>`:'<div class="empty">Pas de dépenses ce mois-ci.</div>'}</section><section class="card"><div class="card-title"><h3>Nos objectifs</h3>${button(`${svg('plus')} Nouvel objectif`,'new-goal','btn soft sm')}</div>${S.goals.map(g=>`<div class="goal"><div class="goal-top"><div class="goal-name">🎯 ${esc(g.name)}</div>${button('Ajouter','deposit:'+g.id,'btn sm soft')}</div><div class="progress"><div style="width:${Math.min(100,g.target?g.saved/g.target*100:0)}%"></div></div><div class="section-hint"><span class="quiet tiny">${fmt(g.saved)} / ${fmt(g.target)} FCFA</span><span class="tiny">${g.target&&g.saved>=g.target?'Atteint ✓':(g.target?Math.round(g.saved/g.target*100):0)+'%'}</span></div><div style="text-align:right;margin-top:8px">${button('Modifier','edit-item:goal:'+g.id,'btn ghost sm')}${button('Supprimer','delete-goal:'+g.id,'btn ghost sm danger')}</div></div>`).join('')||'<div class="empty">Votre premier objectif d’épargne vous attend.</div>'}<div class="notice">Les cagnottes sont des suivis virtuels : aucun argent n’est détenu ou transféré dans cette application.</div></section></div></div>`}
function us(){const subs=[['overview','Notre relation'],['mood','Mood'],['stats','Statistiques'],['agreements','Nos engagements'],['memories','Souvenirs'],['documents','Documents'],['jardin','🌹 Jardin secret']];let content=sub==='mood'?'<section class="card">'+emotionEditor()+'</section>':sub==='stats'?emotionalStats():sub==='agreements'?agreements():sub==='memories'?albumSouvenirs():sub==='jardin'?jardinVue():sub==='documents'?albumDocuments():overview();return `${pageHead('Notre histoire','Juste <em>nous deux.</em>','Les émotions, les petits instants et les engagements qui rendent votre histoire unique.') }<div class="subtabs">${subs.map(x=>`<button data-action="tab:${x[0]}" class="${sub===x[0]?'active':''}">${x[1]}</button>`).join('')}</div>${content}`}
function overview(){const t=moodToday(),active=S.rules.filter(r=>r.status==='accepted').length;return `<div class="grid-2"><div class="stack"><section class="hero"><div class="hero-main"><div class="smallcaps">L'HISTOIRE QUE NOUS ÉCRIVONS</div><div class="h-title">Un jour à la fois,<br>et toujours <em>ensemble.</em></div><p>Racontez vos moments, exprimez vos ressentis et gardez ce qui compte.</p>${button('Ajouter un souvenir','new-memory','btn soft')}</div><div class="hero-ornament">♡</div></section><section class="card">${emotionEditor()}</section></div><div class="stack"><section class="card"><div class="card-title"><h3>Notre charte</h3>${button(svg('arrow'),'tab:agreements','btn ghost sm')}</div><div class="two-mini"><div class="stat-tile"><div class="stat-number">${S.expectations.length}</div><div class="stat-label">Mes attentes privées</div></div><div class="stat-tile"><div class="stat-number">${active}</div><div class="stat-label">Engagements acceptés à deux</div></div></div><p class="quiet small" style="line-height:1.65">Les propositions ne deviennent communes qu’après l’accord réel de chaque partenaire dans une future version synchronisée.</p>${button('Voir nos engagements','tab:agreements','btn soft sm')}</section><section class="card"><div class="card-title"><h3>Notre histoire en chiffres</h3>${button(svg('arrow'),'tab:stats','btn ghost sm')}</div><div class="two-mini"><div class="stat-tile"><div class="stat-number">${S.privacy.showIntimacy?S.events.filter(e=>e.type==='intime').length:'—'}</div><div class="stat-label">${S.privacy.showIntimacy?'Moments intimes 🔞 inscrits':'Moments privés masqués'}</div></div><div class="stat-tile"><div class="stat-number">${S.memories.length}</div><div class="stat-label">Souvenirs précieux</div></div></div>${button('Voir toutes les statistiques','tab:stats','btn soft sm')}</section></div></div>`}
function stats(){const thisMonth=S.events.filter(e=>monthKey(e.date)===monthKey(TODAY)),intimes=thisMonth.filter(e=>e.type==='intime').length, outings=thisMonth.filter(e=>e.type==='sortie'||e.type==='special').length,mood=S.moods.filter(e=>monthKey(e.date)===monthKey(TODAY)),relation=mood.filter(m=>m.relation>0),positive=relation.filter(m=>m.relation>=4).length,[done,total]=taskCount(),spent=monthlyExpenses();let last7=Array.from({length:7},(_,i)=>{const d=addDay(TODAY,i-6),x=S.moods.find(m=>m.date===d);return {d,x}});return `<div class="grid-3" style="margin-bottom:20px"><div class="stat-tile"><div class="smallcaps">Moments 🔞 / mois</div><div class="stat-number">${intimes}</div><div class="stat-label">Dates enregistrées, sans jugement</div></div><div class="stat-tile"><div class="smallcaps">Ressentis positifs</div><div class="stat-number">${relation.length?Math.round(positive/relation.length*100)+' %':'—'}</div><div class="stat-label">Sur ${relation.length} jour(s) renseigné(s)</div></div><div class="stat-tile"><div class="smallcaps">Moments à deux</div><div class="stat-number">${outings}</div><div class="stat-label">Sorties et dates spéciales ce mois-ci</div></div><div class="stat-tile"><div class="smallcaps">Tâches achevées</div><div class="stat-number">${total?Math.round(done/total*100)+' %':'—'}</div><div class="stat-label">${done} tâche(s) sur ${total}</div></div><div class="stat-tile"><div class="smallcaps">Dépenses communes saisies</div><div class="stat-number" style="font-size:26px">${fmt(spent)}</div><div class="stat-label">FCFA ce mois-ci, toutes visibilités</div></div><div class="stat-tile"><div class="smallcaps">Souvenirs</div><div class="stat-number">${S.memories.length}</div><div class="stat-label">Moments précieux enregistrés</div></div></div><div class="grid-even"><section class="card"><div class="card-title"><h3>Ressenti relationnel</h3><span class="smallcaps">7 derniers jours</span></div><div class="chart">${last7.map(o=>`<div class="chart-column"><div class="chart-bar" style="height:${o.x&&o.x.relation?(o.x.relation/5*100):2}%;opacity:${o.x&&o.x.relation?1:.17}" data-val="${o.x&&o.x.relation?o.x.relation+'/5':'—'}"></div><small>${new Date(o.d+'T12:00').toLocaleDateString('fr-FR',{weekday:'short'})}</small></div>`).join('')}</div><p class="quiet small">Le graphique reflète seulement les jours où un ressenti a été saisi.</p></section><section class="card"><div class="card-title"><h3>Notre rétrospective</h3><span class="smallcaps">${monthName(TODAY)}</span></div><div class="hero" style="min-height:220px;padding:24px"><div class="hero-main"><div class="smallcaps">CE MOIS-CI ♡</div><div style="font:normal 26px/1.35 var(--serif);margin:14px 0">${intimes} moment${intimes>1?'s':''} 🔞, ${outings} sortie${outings>1?'s':''} et ${done} tâche${done>1?'s':''} accomplie${done>1?'s':''}.</div><p>Chaque histoire évolue à son rythme. Ces chiffres sont des souvenirs, pas des objectifs à atteindre.</p></div></div></section></div>`}
function agreements(){const expectations=S.expectations;const pending=S.rules.filter(r=>r.status!=='example'),suggested=S.rules.filter(r=>r.status==='example');return `<div class="grid-even"><section class="card"><div class="card-title"><h3>Mes attentes</h3><span class="pill private">${svg('lock')} Espace privé</span></div><p class="quiet small" style="line-height:1.65">Écrivez vos besoins, valeurs ou limites personnelles. Elles restent privées : pour en parler à deux, « Proposer comme engagement » prépare une proposition que vous relisez avant de l’envoyer.</p>${expectations.map(e=>`<div class="rule"><h4>${esc(e.title)}</h4><p>${esc(e.body)}</p>${attenteBouton(e)}<div class="rule-meta">${attenteEtat(e)}<span class="item-actions">${button('Modifier','edit-item:expectation:'+e.id,'btn ghost sm')}${button('Supprimer','delete-expectation:'+e.id,'btn ghost sm danger')}</span></div></div>`).join('')||'<div class="empty">Notez vos premières attentes personnelles.</div>'}${button(`${svg('plus')} Ajouter une attente`,'new-expectation','btn soft')}</section><section class="card"><div class="card-title"><h3>Nos règles</h3><span class="pill pending">Accord mutuel requis</span></div><p class="quiet small" style="line-height:1.65">Proposez des engagements. ${syncConnected()?'Une proposition devient un engagement quand l’autre personne l’accepte depuis son téléphone.':"Dans ce prototype local, aucune proposition n'est validée au nom de l'autre personne."}</p>${pending.map(r=>`<div class="rule"><h4>${esc(r.category)}</h4><p>« ${esc(r.body)} »</p><div class="rule-meta">${ruleMeta(r)}</div></div>`).join('')||'<div class="empty">Aucune proposition pour le moment. Créez votre première règle à discuter ensemble.</div>'}${button(`${svg('plus')} Proposer une règle`,'new-rule','btn primary')}<div class="divider"></div><div class="smallcaps" style="margin-bottom:12px">Idées pour commencer</div><div class="idea-list">${suggested.map(r=>`<button class="suggestion" data-action="suggest-rule:${r.id}"><b>${esc(r.category)}</b><br>${esc(r.body)}<br><span style="color:var(--accent);font-weight:700">+ Proposer</span></button>`).join('')}</div></section></div><div class="notice warning" style="margin-top:16px">Les règles ne remplacent jamais le consentement du moment, notamment pour l'intimité. Pas de sanctions, de points de bonne conduite ni de suivi automatique des « infractions ».</div>`}
function memories(){return `<div class="card-title" style="margin-bottom:15px"><div><div class="smallcaps">NOTRE ALBUM</div><h3 style="font:normal 26px var(--serif);margin:5px 0">Les souvenirs qui restent ♡</h3></div>${button(`${svg('plus')} Ajouter un souvenir`,'new-memory','btn primary')}</div><div class="grid-3">${S.memories.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(m=>`<article class="memory"><div class="memory-art">${esc(m.emoji||'♡')}</div><div class="memory-body"><small>${fullDate(m.date)}</small><h4>${esc(m.title)}</h4><p>${esc(m.note)}</p><div class="item-actions">${button('Modifier','edit-item:memory:'+m.id,'btn ghost sm')}${button('Supprimer','delete-memory:'+m.id,'btn ghost sm danger')}</div></div></article>`).join('')||'<div class="empty">Ajoutez votre premier souvenir.</div>'}</div>`}
function field(name,label,type='text',value='',extra=''){return `<div class="field"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}/></div>`}

case'new-goal':title='Notre nouvel objectif';body=`${field('name','Nom de l’objectif','text','','required maxlength="90" placeholder="Ex. : Notre voyage"')}${field('target','Montant à atteindre (FCFA)','number','','required min="1" step="1"')}${modal.edit?field('saved','Déjà mis de côté (FCFA)','number','','required min="0" step="1"')+'<div class="notice">Corrige le suivi en cas d’erreur de saisie. Aucun argent n’est déplacé.</div>':''}`;action='submit-goal';break;
case'deposit':title='Faire progresser notre objectif';body=`<p class="quiet small">${esc(S.goals.find(g=>g.id===modal.id)?.name)}</p>${field('amount','Montant à ajouter au suivi (FCFA)','number','','required min="1" step="1"')}<div class="notice">Il s’agit d’une saisie de suivi, pas d’un véritable dépôt bancaire.</div>`;action='submit-deposit';break;

case'new-memory':title='Un souvenir précieux';body=`${field('title','Titre du souvenir','text','','required maxlength="90" placeholder="Ex. : Notre belle soirée"')}<div class="form-row">${field('date','Date','date',TODAY,'required')}${field('emoji','Emoji','text','💝','maxlength="16"')}</div>${txt('note','Ce dont vous souhaitez vous souvenir','Quelques mots…')}${albumChoixMemoire()}`;action='submit-memory';break;

lasseur : choisissez-le ensemble. Aucune connexion bancaire n’est active.':'Prototype de démonstration : les données restent dans ce navigateur et ne sont pas chiffrées spécialement. Ni invitation, ni partage, ni connexion bancaire ne sont actifs.'}</div>${syncConnected()?syncSettingsButtons():`<div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:13px">${button('Réinitialiser les exemples','reset-demo','btn danger sm')}${button('Effacer toutes mes données','clear-all','btn danger sm')}</div>`}`;action='submit-settings';submit='Enregistrer le profil';break;}

// Options: delai (ms, 12 s by default) and essais (3 by default; 1 for a file chunk, whose resumption is checked first).
function syncCall(fn, args, opts) {
  const delai = (opts && opts.delai) || 12000, essais = (opts && opts.essais) || 3;

  let sending;

    const go = () => {
      if (SYNC_PARAMS.get('horsligne') || window.ENTRE_NOUS_HORS_LIGNE) return ko(syncError('Connexion impossible pour le moment.', 'reseau'));
      try { ok(JSON.parse(JSON.stringify(window.ENTRE_NOUS_SERVEUR.traiter(JSON.parse(body))))); } catch (e) { ko(e); }
    };

}

// What this profile may send: shared items, its own private ones, its own feelings. The partner's feelings are read-only here.
function syncWritable() {

    out[col] = {};
    for (const item of S[col] || []) {
      if (!item || !item.id || (col === 'rules' && item.status === 'example') || ((col === 'emotionEntries' || col === 'pensees' || col === 'profils' || col === 'voeux' || col === 'reactions' || col === 'jardin' || col === 'envies') && item.ownerId !== me)) continue;

// Connected: sent to the couple's Google Drive through the service, 4 MB at a time, and read back the same way.
// Demonstration: kept in this browser only (IndexedDB). Either way a local copy avoids downloading a file twice.
const FIC_MO = 1048576;
const FIC = {

  limites: { photo: 40 * FIC_MO, video: 100 * FIC_MO, document: 25 * FIC_MO },

    r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error);

}

/* ------------------------------------------------------------------ base64 */
const ficEnBase64 = blob => new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.onerror = () => ko(r.error); r.readAsDataURL(blob); });

/* ------------------------------------------------------------------ sending and reading */
// Returns { id, taille }. Demonstration: the file stays in this browser.
async function ficEnvoyer(blob, rubrique, nom, job, progres) {
  if (!syncConnected()) { const id = 'loc-' + syncId(); await ficGarder(id, blob, true); progres(blob.size); return { id, taille: blob.size }; }
  const base = { rubrique, nom, type: blob.type || 'application/octet-stream', taille: blob.size };
  if (blob.size <= FIC.direct) { const r = await syncCall('fichierDebut', Object.assign({ donnees: await ficEnBase64(blob) }, base), { delai: 90000 }); progres(blob.size); return r.fichier; }
  let debut = 0, essais = 0;
  if (job && job.envoi) {   // resumed after a closed app or a lost network: Drive says where it stopped
    try { const st = await syncCall('fichierEtat', { envoi: job.envoi }, { delai: 30000 }); if (st.fini) return st.fichier; debut = st.recu; }
    catch (e) { if (e.code !== 'envoi') throw e; job.envoi = ''; }
  }
  if (!job || !job.envoi) { const r = await syncCall('fichierDebut', base, { delai: 30000 }); if (job) { job.envoi = r.envoi; ficSauverEnvoi(job); } else base.envoi = r.envoi; }

}

function ficBlob(id, type, taille, progres) {

    if (!syncConnected()) throw syncError('Ce fichier n’est pas sur cet appareil.', 'absent');
    const parts = []; let recu = 0;

// Notifications on the phone (serveur/Code.gs, « notifications »): each addition by one partner reaches the other's
// phone, even locked. The signal is empty; the service worker (web/sw.js) asks the service for the text with this session.
// On iPhone: iOS 16.4 or later, and Entre Nous opened from its home-screen icon.
const NOTIF_SESSION = 'entre-nous-session';
const NOTIF = { etat: null, lecture: null };
const notifIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const notifIcone = () => navigator.standalone === true || !!(window.matchMedia && matchMedia('(display-mode: standalone)').matches);
const notifPossible = () => typeof navigator !== 'undefined' && 'serviceWorker' in navigator && typeof window !== 'undefined' && 'PushManager' in window && 'Notification' in window;
const notifOctets = b64 => Uint8Array.from(atob((b64 + '='.repeat((4 - b64.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
const notifDiscret = () => { try { return localStorage.getItem(KEY + ':notif-discret') === '1'; } catch (e) { return false; } };
const notifAppareil = () => (notifIOS() ? 'iPhone' : /Android/.test(navigator.userAgent) ? 'Android' : 'Ordinateur');
// The service worker needs the service address and this session to fetch the text of a notification.
function notifSession() {
  if (typeof caches === 'undefined' || SYNC_MODE !== 'ligne') return;
  caches.open(NOTIF_SESSION).then(c => SY.jeton ? c.put('./session', new Response(JSON.stringify({ api: SYNC_CFG.api, jeton: SY.jeton }), { headers: { 'Content-Type': 'application/json' } })) : c.delete('./session')).catch(() => {});
}
function notifLireEtat() {
  if (NOTIF.lecture) return NOTIF.lecture;
  NOTIF.lecture = (async () => {
    if (SYNC_MODE !== 'ligne' || !notifPossible()) return (NOTIF.etat = { possible: false });
    try { const reg = await navigator.serviceWorker.getRegistration(), sub = reg && await reg.pushManager.getSubscription(); NOTIF.etat = { possible: true, permission: Notification.permission, sub }; }
    catch (e) { NOTIF.etat = { possible: true, permission: Notification.permission, sub: null }; }
    return NOTIF.etat;
  })().finally(() => { NOTIF.lecture = null; });
  return NOTIF.lecture;
}
// Redraws only the notification blocks: an open settings form keeps what is being typed.
async function notifMaj() {
  if (SYNC_MODE !== 'ligne') return;
  await notifLireEtat();
  document.querySelectorAll('[data-notif]').forEach(el => { el.innerHTML = notifContenu(); });
  document.querySelectorAll('[data-notif-invite]').forEach(el => { el.outerHTML = notifInvitation(); });
}
function notifContenu() {
  if (SYNC_MODE === 'demo') return '<p class="quiet small">Dans l’application connectée, chaque ajout de l’un prévient le téléphone de l’autre, même verrouillé.</p>';
  if (SYNC_MODE === 'banc') return '<p class="quiet small">Banc d’essai : les notifications se règlent depuis l’application installée sur le téléphone.</p>';
  const N = NOTIF.etat;
  if (!N) { notifMaj(); return '<p class="quiet small">…</p>'; }
  const intro = `<p class="quiet small">Quand ${esc(personName(partnerOf(SY.me)))} ajoute quelque chose (souvenir, photo, document, rendez-vous, dépense commune, ressenti…), ce téléphone vous prévient, même verrouillé.</p>`;
  if (notifIOS() && !notifIcone()) return intro + '<div class="notice">Sur iPhone, les notifications ne marchent que depuis l’icône Entre Nous : dans Safari, touchez <b>Partager</b> › <b>Sur l’écran d’accueil</b>, puis ouvrez Entre Nous depuis cette icône et revenez ici.</div>';
  if (!N.possible) return intro + '<div class="notice">Ce navigateur ne permet pas les notifications. Sur iPhone, il faut iOS 16.4 ou plus récent et l’icône sur l’écran d’accueil.</div>';
  if (N.permission === 'denied') return intro + `<div class="notice">Les notifications sont refusées pour Entre Nous. ${notifIOS() ? 'Sur iPhone : <b>Réglages</b> › <b>Notifications</b> › <b>Entre Nous</b> › <b>Autoriser les notifications</b>.' : 'Dans Chrome : touchez le cadenas à gauche de l’adresse › <b>Autorisations</b> › <b>Notifications</b> › <b>Autoriser</b>.'}</div>`;
  const discret = `<div class="toggle-row"><div><b>Notifications discrètes</b><small>Sur l’écran verrouillé : « Du nouveau dans votre univers à deux », sans détail</small></div><label class="switch"><input type="checkbox" aria-label="Notifications discrètes" data-change="notif-discret" ${notifDiscret() ? 'checked' : ''}/><span></span></label></div>`;
  if (N.sub) return intro + `<p><b>✓ Activées sur ce téléphone.</b></p>${discret}<div class="notif-boutons">${button('Envoyer un essai', 'notif-essai', 'btn sm soft')}${button('Désactiver', 'notif-off', 'btn sm ghost danger')}</div>`;
  return intro + `${discret}<div class="notif-boutons">${button('🔔 Activer les notifications', 'notif-on', 'btn primary')}</div>`;
}
const notifReglages = () => `<div class="smallcaps" style="margin:18px 0 4px">NOTIFICATIONS</div><div data-notif>${notifContenu()}</div>`;
// Invitation under the status banner, as long as this phone can receive notifications and has not been asked yet.
function notifInvitation() {
  const N = NOTIF.etat;
  if (SYNC_MODE !== 'ligne' || !N || !N.possible || N.sub || N.permission !== 'default' || (notifIOS() && !notifIcone())) return '<span data-notif-invite hidden></span>';
  return `<div class="notif-invite" data-notif-invite><span>🔔 Soyez prévenu·e quand ${esc(personName(partnerOf(SY.me)))} ajoute quelque chose.</span>${button('Activer', 'notif-on', 'btn sm primary')}</div>`;
}
async function notifActiver() {
  try {
    const perm = await Notification.requestPermission();   // first step after the touch: required by the iPhone
    if (perm !== 'granted') { toast('Notifications non autorisées sur ce téléphone.'); return; }
    const { cle } = await syncCall('notifCle', {});
    const reg = await navigator.serviceWorker.ready;
    const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: notifOctets(cle) });
    notifSession();
    await syncCall('notifAbonner', { sub: sub.toJSON(), discret: notifDiscret(), appareil: notifAppareil() });
    sonsJouer('enregistrer'); toast('Notifications activées sur ce téléphone. ♡');
  } catch (e) { toast(e.message || 'Activation impossible.'); }
  finally { notifMaj(); }
}
async function notifDesactiver() {
  try {
    const reg = await navigator.serviceWorker.getRegistration(), sub = reg && await reg.pushManager.getSubscription();
    if (sub) { await syncCall('notifDesabonner', { endpoint: sub.endpoint }).catch(() => {}); await sub.unsubscribe(); }
    toast('Notifications désactivées sur ce téléphone.');
  } catch (e) { toast(e.message || 'Désactivation impossible.'); }
  notifMaj();
}
// Leaving this phone: the session token is captured now, before the sign-out clears it.
function notifOublierAppareil() {
  if (SYNC_MODE !== 'ligne' || !notifPossible()) return;
  const jeton = SY.jeton;
  navigator.serviceWorker.getRegistration().then(reg => reg && reg.pushManager.getSubscription()).then(sub => {
    if (!sub) return;
    syncCall('notifDesabonner', { jeton, endpoint: sub.endpoint }).catch(() => {}).finally(() => sub.unsubscribe().catch(() => {}));
  }).catch(() => {});
}
function notifAction(a) {
  if (a === 'notif-on') { notifActiver(); return true; }
  if (a === 'notif-off') { if (confirmDel('Ne plus recevoir de notifications sur ce téléphone ?')) notifDesactiver(); return true; }
  if (a === 'notif-essai') { notifSession(); syncCall('notifEssai', {}).then(r => toast(r.envoyes ? 'Essai envoyé : la notification arrive dans quelques secondes.' : 'L’essai n’a pas pu partir.')).catch(e => toast(e.message)); return true; }
  return false;
}
function notifChanged(e) {
  if (e.target.dataset.change !== 'notif-discret') return false;
  try { localStorage.setItem(KEY + ':notif-discret', e.target.checked ? '1' : '0'); } catch (x) { /* stockage bloqué */ }
  if (NOTIF.etat && NOTIF.etat.sub) syncCall('notifAbonner', { sub: NOTIF.etat.sub.toJSON(), discret: e.target.checked, appareil: notifAppareil() }).then(() => toast(e.target.checked ? 'Notifications discrètes.' : 'Notifications détaillées.')).catch(x => toast(x.message));
  return true;
}
// A touched notification opens the right screen (address ?aller=… or a message from the service worker).
function notifAller(vue) {
  const [p, s] = String(vue || '').split('/');
  if (!p || !NAV.some(n => n[0] === p)) return;

}
function notifAllerDepuisAdresse() {
  const vue = SYNC_PARAMS.get('aller'); if (!vue) return;
  notifAller(vue);

if (typeof navigator !== 'undefined' && navigator.serviceWorker && navigator.serviceWorker.addEventListener) {

/* ------------------------------------------------------------------ suggestion engine (local, no external service) */
// Common Mood (average of the two relationship feelings, shared by both) → tones that suit the day. Never the personal moods.
function penseeTonsDuMood(commun) {
  if (commun === null || commun === undefined) return null;
  return commun < 2.5 ? ['apaisante', 'tendre'] : commun < 4 ? ['tendre', 'profonde', 'apaisante'] : ['joyeuse', 'passionnee', 'tendre'];
}
// Pure choice of n messages: filters first; messages used in the last 30 days only when nothing else is left;
// favourites and favourite themes weigh more; the Mood (if allowed) favours suitable tones. Nothing else is read.
function penseeChoisir({ biblio, categorie, theme, tonalite, exclure = [], usage = {}, favoris = [], tons = null, maintenant = Date.now(), n = 3, hasard = Math.random }) {
  let L = biblio.filter(m => m.categorie === categorie && (!theme || m.theme === theme) && (!tonalite || m.tonalite === tonalite) && !exclure.includes(m.id));
  const recent = m => usage[m.id] && maintenant - Date.parse(usage[m.id]) < 30 * PENSEE_JOUR;
  const frais = L.filter(m => !recent(m));
  if (frais.length >= n) L = frais;
  else L = frais.concat(L.filter(recent).sort((a, b) => Date.parse(usage[a.id]) - Date.parse(usage[b.id])).slice(0, n - frais.length));
  const themesAimes = {}; for (const id of favoris) { const m = biblio.find(x => x.id === id); if (m) themesAimes[m.theme] = (themesAimes[m.theme] || 0) + 1; }
  const poids = m => (1 + Math.min(2, (themesAimes[m.theme] || 0) * 0.5)) * (favoris.includes(m.id) ? 1.5 : 1) * (tons && tons.includes(m.tonalite) ? 2.5 : 1);
  const out = [], reste = L.slice();
  while (out.length < n && reste.length) {
    const total = reste.reduce((t, m) => t + poids(m), 0);
    let r = hasard() * total, i = 0;
    for (; i < reste.length - 1; i++) { r -= poids(reste[i]); if (r <= 0) break; }
    out.push(reste.splice(i, 1)[0]);
  }
  return out;
}

  else if (nom === 'kama-fait') { kamaPoser(x, e.fait ? { fait: false, faitLe: '' } : { fait: true, faitLe: e.faitLe || TODAY, essayer: false }); if (!e.fait) { sonsJouer('enregistrer'); toast('Cochée ✓ Une de plus à votre carnet.'); } }
  else if (nom === 'kama-essayer') kamaPoser(x, { essayer: !e.essayer });
  else if (nom === 'kama-favori') kamaPoser(x, { favori: !e.favori });
  else if (nom === 'kama-proposer') {
    const p = KAMA.find(q => q[0] === x), moi = jardinMoi();
    if (p) {
      S.invitations = (S.invitations || []).filter(i => !(i.de === moi && !i.reponse && i.date >= TODAY));
      S.invitations.push({ id: 'inv-' + id(), de: moi, pour: partnerOf(moi), date: TODAY, message: ('Et si on essayait « ' + p[2] + ' » ce soir ? ♡').slice(0, 140), reponse: null, createdAt: new Date().toISOString() });
      persist(); JARDIN.onglet = 'invitation'; sonsJouer('enregistrer'); toast('Invitation envoyée pour ce soir. 🕯️');
    }
  }
  render();
  return true;
}

/* ----- Histoires coquines ----- */
const HIST_VUE = { ouverte: null, genre: '' };
const histLire = (k, d) => { try { return JSON.parse(localStorage.getItem(KEY + ':hist-' + k)) || d; } catch (e) { return d; } };
const histGarder = (k, v) => { try { localStorage.setItem(KEY + ':hist-' + k, JSON.stringify(v)); } catch (e) { /* stockage bloqué */ } };
const histMinutes = h => Math.max(1, Math.round(h[5].split(/\s+/).length / 200));
function jardinHistoires() {
  const n = jardinNiveau(), lues = histLire('lues', []), fav = histLire('favoris', []), g = HIST_VUE.genre;
  const L = HISTOIRES.filter(h => h[1] <= n && (!g || (g === 'favoris' ? fav.includes(h[0]) : h[2] === g))).slice().sort((a, b) => b[6].localeCompare(a[6]) || a[0].localeCompare(b[0]));
  const o = HIST_VUE.ouverte && HISTOIRES.find(h => h[0] === HIST_VUE.ouverte && h[1] <= n);
  if (o) return `<section class="card hist-lecture"><div class="smallcaps">${HIST_GENRES[o[2]]} · ${jardinNiv(o[1])[2]} ${jardinNiv(o[1])[1]} · ${histMinutes(o)} min</div><h2>${esc(o[3])}</h2><p class="hist-chapeau">${esc(o[4])}</p>${o[5].split(/\n\n+/).map(par => `<p>${esc(par)}</p>`).join('')}<div class="jardin-choix">${button(fav.includes(o[0]) ? '⭐ Dans mes favoris' : '☆ Ajouter aux favoris', 'hist-favori:' + o[0], 'btn sm ' + (fav.includes(o[0]) ? 'primary' : 'soft'))}${button('← Toutes les histoires', 'hist-ouvrir:', 'btn ghost sm')}</div></section>`;
  const pill = (v, t) => `<button type="button" class="pill-btn${g === v ? ' active' : ''}" data-action="hist-genre:${v}">${t}</button>`;
  const nouv = h => !lues.includes(h[0]) ? '<span class="pill pending">Nouvelle</span>' : '<span class="pill">Lue ✓</span>';
  return `<section class="card"><div class="card-title"><h3>Histoires coquines</h3><span class="pill">${HISTOIRES.filter(h => h[1] <= n && !lues.includes(h[0])).length} à lire</span></div><p class="quiet small">Récits, témoignages et fantasmes écrits pour Entre Nous, à lire seul… ou à voix haute, à deux. De nouvelles histoires arrivent avec les mises à jour.</p><div class="jardin-quand">${pill('', 'Toutes')}${pill('recit', '📖 Récits')}${pill('temoignage', '💌 Témoignages')}${pill('fantasme', '💭 Fantasmes')}${pill('favoris', '⭐ Favoris')}</div></section>${L.map(h => `<button type="button" class="card hist-carte" data-action="hist-ouvrir:${h[0]}"><div class="hist-tete"><small>${HIST_GENRES[h[2]]} · ${jardinNiv(h[1])[2]} · ${histMinutes(h)} min</small>${nouv(h)}</div><b>${esc(h[3])}</b><span>${esc(h[4])}</span></button>`).join('') || '<p class="quiet small">Aucune histoire ici pour l’instant.</p>'}`;
}
function histAction(a) {
  if (!a.startsWith('hist-')) return false;
  const [nom, x] = a.split(':');
  if (nom === 'hist-ouvrir') { HIST_VUE.ouverte = x || null; if (x) { const L = histLire('lues', []); if (!L.includes(x)) histGarder('lues', L.concat(x)); } if (typeof window !== 'undefined' && window.scrollTo) window.scrollTo(0, 0); }
  else if (nom === 'hist-genre') HIST_VUE.genre = x || '';
  else if (nom === 'hist-favori') { const L = histLire('favoris', []); histGarder('favoris', L.includes(x) ? L.filter(y => y !== x) : L.concat(x)); }
  render();
  return true;
}

const app=$('#app');app.addEventListener('click',actions);app.addEventListener('change',changed);app.addEventListener('submit',submitted);app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id?.startsWith('task-')){e.preventDefault();const id=e.target.id.slice(5);const v=e.target.value.trim();if(v){S.projects.find(p=>p.id===id)?.tasks.push({id:Math.random().toString(36).slice(2,10),name:v,done:false});persist();render()}}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)close()});syncStart();
})();
</script>

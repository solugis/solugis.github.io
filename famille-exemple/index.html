<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Famille Exemple</title>
<meta name="description" content="L’espace privé de Famille Exemple, sur Adya">
<meta name="theme-color" content="#0a4a30">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Exemple">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icone-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  /* Page verrouillée : rien ne peut glisser de côté ni rebondir (iPhone) */
  html, body { margin: 0; height: 100%; width: 100%; overflow: hidden; overscroll-behavior: none; background: #f4f6ef; }
  body { position: fixed; inset: 0; padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); box-sizing: border-box; font-family: -apple-system, system-ui, sans-serif; }
  /* Sur iPhone, un cadre s'élargit à la taille de son contenu : 1px + min-width 100 % le garde à la largeur de l'écran */
  iframe { position: relative; z-index: 1; display: block; width: 1px; min-width: 100%; max-width: 100%; height: 100%; border: 0; background: transparent; }
  #attente { position: fixed; inset: 0; z-index: 0; display: grid; place-content: center; justify-items: center; gap: 14px; font: 600 16px system-ui, sans-serif; color: #0a4a30; text-align: center; padding: 0 24px; }
  #attente img { width: 96px; height: 96px; border-radius: 22px; }
  #attente small { font-weight: 400; font-size: 14px; color: #55665a; max-width: 280px; text-align: center; min-height: 20px; }
  #attente button { font: 600 16px system-ui, sans-serif; border: 0; border-radius: 12px; padding: 12px 20px; background: #0a4a30; color: #fff; cursor: pointer; }
  #attente button[hidden] { display: none; }
  #attente.panne { z-index: 2; background: #f4f6ef; }
  @media (prefers-color-scheme: dark) { #attente small { color: #a2b3a6; } }
  /* Face ID : la vérification se fait ici, sur la page de l'icône, car le cadre Google ne l'autorise pas */
  .fid { position: fixed; left: 12px; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 5; max-width: 480px; margin: 0 auto; background: #ffffff; border: 1px solid #d9e1d4; border-radius: 18px; box-shadow: 0 8px 28px rgb(10 40 25 / 18%); padding: 14px; display: grid; gap: 10px; color: #16261c; }
  .fid[hidden], .voile[hidden] { display: none; }
  .fid p { margin: 0; font-size: 14px; line-height: 1.45; color: #55665a; }
  .fid strong { font-size: 16px; color: #0a4a30; }
  .fid button { font: 600 16px system-ui, sans-serif; border-radius: 12px; padding: 13px 16px; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .fid .principal { background: #0a4a30; color: #ffffff; }
  .fid .second { background: #eef3ec; color: #0a4a30; }
  .fid svg { width: 24px; height: 24px; }
  .voile { position: fixed; inset: 0; z-index: 4; background: rgb(5 20 12 / 45%); }
  @media (prefers-color-scheme: dark) {
    .fid { background: #15201a; border-color: #2a3b31; color: #e8efe7; }
    .fid p { color: #a2b3a6; } .fid strong { color: #8fd0a6; }
    .fid .principal { background: #3d9a66; color: #06140c; } .fid .second { background: #1d2c23; color: #8fd0a6; }
  }
  /* Note vocale et dictée : le micro n'est permis qu'ici, pas dans le cadre Google */
  .mic-temps { font: 600 34px system-ui, sans-serif; color: #0a4a30; text-align: center; font-variant-numeric: tabular-nums; }
  .mic-temps.enr::before { content: ""; display: inline-block; width: 12px; height: 12px; margin-right: 10px; border-radius: 50%; background: #c0392b; vertical-align: middle; animation: clignote 1s infinite; }
  @keyframes clignote { 50% { opacity: .2; } }
  .mic-dit { min-height: 64px; max-height: 30vh; overflow: auto; padding: 10px 12px; border-radius: 12px; background: #f4f6ef; font-size: 16px; line-height: 1.45; color: #16261c; white-space: pre-wrap; }
  .mic-dit:empty::before { content: "Votre texte s’affichera ici…"; color: #8a978d; }
  #mic audio { width: 100%; }
  #mic [hidden] { display: none; }
  .fid .rouge { background: #c0392b; color: #fff; }
  @media (prefers-color-scheme: dark) { .mic-temps { color: #8fd0a6; } .mic-dit { background: #1d2c23; color: #e8efe7; } }
</style>
</head>
<body>
<div id="attente"><img src="icone-192.png" alt="">Ouverture de Famille Exemple…<small id="attente-etat" role="status"></small><button id="attente-reessayer" type="button" hidden>Réessayer</button></div>
<!-- L'application elle-même (Google Apps Script, dans le compte du groupe). Cette page lui donne un nom, une icône et la connexion par Face ID. -->
<iframe id="app" data-src="https://script.google.com/macros/s/AKfycbw2epKrIgm36_2gekKRESP9h36t1kCW4r-eFtzwE0b0MF8zJYcM0ISaUvjR4Mj9qUQ/exec" title="Famille Exemple" allow="clipboard-write"></iframe>

<div class="fid" id="fid-connexion" hidden role="region" aria-label="Connexion rapide">
  <button class="principal" id="fid-go" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M9 9.5v1M15 9.5v1M12 9.5v3.5h-1M9.5 15.5a3.5 3.5 0 0 0 5 0"/></svg><span id="fid-go-txt">Se connecter avec Face ID</span></button>
</div>
<div class="voile" id="fid-voile" hidden></div>
<div class="fid" id="fid-activer" hidden role="dialog" aria-modal="true" aria-labelledby="fid-titre">
  <strong id="fid-titre">Activer Face ID</strong>
  <p id="fid-texte">L’application s’ouvrira d’un regard, sans code. Votre visage reste sur le téléphone.</p>
  <button class="principal" id="fid-oui" type="button">Activer</button>
  <button class="second" id="fid-non" type="button">Plus tard</button>
</div>

<div class="fid" id="fid-signer" hidden role="dialog" aria-modal="true" aria-labelledby="fsg-titre">
  <strong id="fsg-titre">Confirmer la signature</strong>
  <p id="fsg-texte"></p>
  <button class="principal" id="fsg-oui" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M9 9.5v1M15 9.5v1M12 9.5v3.5h-1M9.5 15.5a3.5 3.5 0 0 0 5 0"/></svg><span id="fsg-oui-txt">Signer avec Face ID</span></button>
  <button class="second" id="fsg-non" type="button">Annuler</button>
</div>
<div class="fid" id="mic" hidden role="dialog" aria-modal="true" aria-labelledby="mic-titre">
  <strong id="mic-titre">Note vocale</strong>
  <p id="mic-texte"></p>
  <div class="mic-temps" id="mic-temps" hidden>0:00</div>
  <div class="mic-dit" id="mic-dit" hidden aria-live="polite"></div>
  <audio id="mic-audio" controls hidden></audio>
  <button class="principal" id="mic-go" type="button">Enregistrer</button>
  <button class="second" id="mic-autre" type="button" hidden>Recommencer</button>
  <button class="second" id="mic-non" type="button">Annuler</button>
</div>

<script>
(function () {
  var GROUPE = 'famille-exemple';                                           // plusieurs groupes peuvent partager ce domaine
  var RP = location.hostname;                                        // ex. solugis.github.io
  var APP = /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/;                                       // origine du cadre de l'application
  var ua = navigator.userAgent;
  var ios = /iP(hone|ad|od)/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var LIB = ios ? 'Face ID' : /Mac/.test(navigator.platform) ? 'Touch ID' : /Android/i.test(ua) ? 'l’empreinte' : /Windows/i.test(ua) ? 'Windows Hello' : 'l’empreinte ou le visage';
  var lsGet = function (k) { try { return localStorage.getItem('adya.' + GROUPE + '.' + k); } catch (e) { return null; } };
  var lsSet = function (k, v) { try { if (v == null) localStorage.removeItem('adya.' + GROUPE + '.' + k); else localStorage.setItem('adya.' + GROUPE + '.' + k, v); } catch (e) {} };
  var app = null, origineApp = null, defi = null, enrol = null, webauthn = false, cleEnCours = null;
  var $ = function (id) { return document.getElementById(id); };
  /* Compatibilité avec une ancienne application (ex. NDK Family, messages « ndk ») : les messages portent les deux clés,
     et la connexion gardée sous l'ancien préfixe est reprise une fois. Vide pour un nouveau groupe. */
  var COMPAT = '';
  if (COMPAT) ['jeton', 'etat', 'faceid'].forEach(function (k) { try { var v = localStorage.getItem(COMPAT + '.' + k); if (v != null && lsGet(k) == null) lsSet(k, v); } catch (e) {} });
  var envoyer = function (m) { if (COMPAT && m.adya) m[COMPAT] = m.adya; if (app) app.postMessage(m, origineApp); };
  /* Petit journal de diagnostic (affiché dans Mon espace › Connexion avec Face ID) : ce que cette page reçoit et garde. */
  var VERSION = 'a2026-10-20';
  function diag(x) { try { var a = JSON.parse(lsGet('diag') || '[]'); var d = new Date(); a.push(('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + ' ' + d.toTimeString().slice(0, 5) + ' · ' + x); lsSet('diag', JSON.stringify(a.slice(-15))); } catch (e) {} }
  function journal() { try { return JSON.parse(lsGet('diag') || '[]'); } catch (e) { return []; } }
  diag('ouverture (' + VERSION + ') · connexion gardée : ' + (lsGet('jeton') ? 'oui' : 'non') + (window.navigator.standalone ? ' · icône' : ' · navigateur'));
  var b64u = function (buf) { var s = '', b = new Uint8Array(buf); for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
  var deB64u = function (t) { t = t.replace(/-/g, '+').replace(/_/g, '/'); while (t.length % 4) t += '='; var s = atob(t), b = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b; };
  var hex = function (b) { return Array.prototype.map.call(b, function (x) { return ('0' + x.toString(16)).slice(-2); }).join(''); };
  var erreur = function (e) {
    var n = e && e.name;
    if (n === 'NotAllowedError' || n === 'AbortError') return LIB + ' annulé. Si le téléphone indique qu’aucune clé n’est enregistrée, connectez-vous avec votre code, puis touchez « Réactiver » dans Mon espace.';
    if (n === 'InvalidStateError') return LIB + ' est déjà activé sur cet appareil.';
    if (n === 'NotSupportedError') return 'Cet appareil ne propose pas ' + LIB + '.';
    return LIB + ' n’a pas abouti. Réessayez ou utilisez votre code.';
  };
  $('fid-go-txt').textContent = 'Se connecter avec ' + LIB;
  $('fid-titre').textContent = 'Activer ' + LIB;
  if (!ios) $('fid-texte').textContent = 'L’application s’ouvrira sans code, avec ' + LIB + '. Votre empreinte ou votre visage restent sur l’appareil.';
  var disponible = window.PublicKeyCredential && PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable
    ? PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().catch(function () { return false; }) : Promise.resolve(false);
  disponible.then(function (ok) { webauthn = !!ok; if (app) annoncer(); });
  /* La connexion et la dernière situation sont gardées ici : sur iPhone, le stockage du cadre Google est effacé entre deux ouvertures. */
  function etatGarde() { try { return JSON.parse(lsGet('etat') || 'null'); } catch (e) { return null; } }
  var MICRO = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  var Reco = window.SpeechRecognition || window.webkitSpeechRecognition;
  function annoncer() { envoyer({ adya: 'porte', webauthn: webauthn, libelle: LIB, actif: lsGet('faceid') === '1', signature: true, jeton: lsGet('jeton'), etat: etatGarde(), v: VERSION, diag: journal(), micro: MICRO, dictee: !!Reco }); }

  /* ---- Note vocale : enregistrée ici, puis transmise à l'application, qui l'envoie dans le Drive du groupe ---- */
  var mic = { mode: null, z: null, max: 180, flux: null, rec: null, morceaux: [], t0: 0, tic: null, blob: null, type: '', duree: 0, reco: null, texte: '' };
  var mm = function (s) { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); };
  function micAfficher(etat) {
    var enr = etat === 'enr', fini = etat === 'fini', dictee = mic.mode === 'dictee';
    $('mic-titre').textContent = dictee ? 'Dicter un texte' : 'Note vocale';
    $('mic-temps').hidden = dictee || etat === 'pret'; $('mic-temps').className = 'mic-temps' + (enr ? ' enr' : '');
    $('mic-dit').hidden = !dictee;
    $('mic-audio').hidden = !fini || dictee;
    $('mic-autre').hidden = !fini;
    $('mic-go').className = enr ? 'rouge' : 'principal';
    $('mic-go').textContent = etat === 'pret' ? (dictee ? 'Parler' : 'Enregistrer') : enr ? (dictee ? 'Terminer' : 'Arrêter') : (dictee ? 'Insérer le texte' : 'Joindre la note');
    $('mic-texte').textContent = etat === 'pret' ? (dictee ? 'Touchez « Parler », puis dictez votre texte. Dites « virgule » ou « point » pour la ponctuation.' : 'Touchez « Enregistrer », parlez près du téléphone, puis « Arrêter ». ' + (mic.max >= 600 ? 'Jusqu’à ' + Math.round(mic.max / 60) + ' minutes.' : 'Jusqu’à 3 minutes.'))
      : enr ? (dictee ? 'Je vous écoute…' : 'Enregistrement en cours…') : (dictee ? 'Vérifiez le texte, puis insérez-le.' : 'Écoutez la note si vous le souhaitez, puis joignez-la.');
    mic.etat = etat;
  }
  function micOuvrir(mode, z, max) {
    if (mic.mode) return;
    mic.mode = mode; mic.z = z; mic.max = Math.max(10, Math.min(900, +max || 180)); mic.blob = null; mic.texte = ''; $('mic-dit').textContent = '';
    $('fid-voile').hidden = false; $('mic').hidden = false; micAfficher('pret'); $('mic-go').focus();
  }
  function micFermer() {
    clearInterval(mic.tic); mic.tic = null;
    try { if (mic.rec && mic.rec.state !== 'inactive') { mic.rec.onstop = null; mic.rec.stop(); } } catch (e) {}
    try { if (mic.reco) { mic.reco.onend = null; mic.reco.abort(); } } catch (e) {}
    if (mic.flux) mic.flux.getTracks().forEach(function (t) { t.stop(); });
    var a = $('mic-audio'); if (a.src) { a.pause(); URL.revokeObjectURL(a.src); a.removeAttribute('src'); }
    mic.flux = mic.rec = mic.reco = null; mic.mode = null;
    $('mic').hidden = true; $('fid-voile').hidden = true;
  }
  function micErreur(e) {
    var n = e && (e.name || e.error);
    var t = n === 'NotAllowedError' || n === 'not-allowed' || n === 'service-not-allowed' ? 'Le micro est refusé : autorisez-le pour cette page dans les réglages du téléphone (Safari › Micro), puis réessayez.'
      : n === 'NotFoundError' || n === 'audio-capture' ? 'Aucun micro trouvé sur cet appareil.' : n === 'no-speech' ? 'Je n’ai rien entendu : réessayez en parlant près du téléphone.' : n === 'network' ? 'La dictée a besoin d’une connexion internet.' : 'Le micro n’a pas pu démarrer. Réessayez.';
    micFermer(); envoyer({ adya: 'vocal-erreur', message: t }); diag('micro : ' + (n || 'erreur'));
  }
  function micEnregistrer() {
    navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } }).then(function (flux) {
      if (!mic.mode) { flux.getTracks().forEach(function (t) { t.stop(); }); return; }
      mic.flux = flux; mic.morceaux = [];
      var types = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/ogg;codecs=opus', 'audio/webm'], type = '';
      for (var i = 0; i < types.length; i++) if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(types[i])) { type = types[i]; break; }
      var opts = { audioBitsPerSecond: 32000 }; if (type) opts.mimeType = type;
      var rec; try { rec = new MediaRecorder(flux, opts); } catch (e) { rec = new MediaRecorder(flux); }
      mic.rec = rec; mic.type = (rec.mimeType || type || 'audio/mp4').split(';')[0];
      rec.ondataavailable = function (ev) { if (ev.data && ev.data.size) mic.morceaux.push(ev.data); };
      rec.onstop = function () {
        clearInterval(mic.tic); mic.duree = (Date.now() - mic.t0) / 1000;
        if (mic.flux) mic.flux.getTracks().forEach(function (t) { t.stop(); }); mic.flux = null;
        mic.blob = new Blob(mic.morceaux, { type: mic.type });
        var a = $('mic-audio'); a.src = URL.createObjectURL(mic.blob); micAfficher('fini');
      };
      rec.start(1000); mic.t0 = Date.now(); $('mic-temps').textContent = '0:00'; micAfficher('enr');
      mic.tic = setInterval(function () { var s = (Date.now() - mic.t0) / 1000, reste = mic.max - s; $('mic-temps').textContent = mm(s) + (reste <= 30 ? ' · encore ' + Math.ceil(reste) + ' s' : ''); if (reste <= 0) rec.stop(); }, 250);
    }).catch(micErreur);
  }
  function micDicter() {
    var r = new Reco(); mic.reco = r; r.lang = 'fr-FR'; r.continuous = true; r.interimResults = true;
    var acquis = mic.texte;
    r.onresult = function (ev) { var fin = '', prov = ''; for (var i = ev.resultIndex; i < ev.results.length; i++) { if (ev.results[i].isFinal) fin += ev.results[i][0].transcript; else prov += ev.results[i][0].transcript; } if (fin) acquis = (acquis ? acquis + ' ' : '') + fin.trim(); mic.texte = acquis; $('mic-dit').textContent = acquis + (prov ? ' ' + prov : ''); };
    r.onerror = function (ev) { if (ev.error !== 'aborted' && !(ev.error === 'no-speech' && mic.texte)) micErreur(ev); };
    r.onend = function () { if (mic.mode === 'dictee') micAfficher('fini'); };
    try { r.start(); micAfficher('enr'); } catch (e) { micErreur(e); }
  }
  function micEnvoyer() {
    if (mic.mode === 'dictee') { var t = (mic.texte || '').trim(); micFermer(); if (t) envoyer({ adya: 'dictee-texte', texte: t }); return; }
    var b = mic.blob, z = mic.z, type = mic.type, duree = Math.round(mic.duree); if (!b) return;
    if (b.size > 5 * 1024 * 1024) { micFermer(); envoyer({ adya: 'vocal-erreur', message: 'Note trop longue (5 Mo au plus) : enregistrez-la en plusieurs parties.' }); return; }
    var lu = new FileReader(); lu.onload = function () { micFermer(); envoyer({ adya: 'vocal', z: z, type: type, duree: duree, b64: String(lu.result).split(',')[1] || '' }); diag('note vocale transmise (' + duree + ' s)'); };
    lu.readAsDataURL(b);
  }
  $('mic-go').addEventListener('click', function () {
    if (mic.etat === 'pret') { if (mic.mode === 'dictee') micDicter(); else micEnregistrer(); }
    else if (mic.etat === 'enr') { if (mic.mode === 'dictee') { try { mic.reco.stop(); } catch (e) { micAfficher('fini'); } } else if (mic.rec) mic.rec.stop(); }
    else micEnvoyer();
  });
  $('mic-autre').addEventListener('click', function () { var a = $('mic-audio'); if (a.src) { a.pause(); URL.revokeObjectURL(a.src); a.removeAttribute('src'); } mic.blob = null; mic.texte = ''; $('mic-dit').textContent = ''; micAfficher('pret'); });
  $('mic-non').addEventListener('click', micFermer);

  /* Clé publique (x, y) : directement si le navigateur la fournit, sinon lue dans la réponse CBOR. */
  function clePublique(rep) {
    if (rep.getPublicKey) { var spki = new Uint8Array(rep.getPublicKey()); if (spki.length >= 65) return { x: hex(spki.slice(-64, -32)), y: hex(spki.slice(-32)) }; }
    var o = cbor(new Uint8Array(rep.attestationObject)), ad = o.authData, l = (ad[53] << 8) | ad[54];
    var cle = cbor(ad.slice(55 + l));
    return { x: hex(cle[-2]), y: hex(cle[-3]) };
  }
  function cbor(b) {
    var i = 0;
    function lire() {
      var t = b[i++], maj = t >> 5, inf = t & 31, n = inf;
      if (inf === 24) n = b[i++]; else if (inf === 25) { n = (b[i] << 8) | b[i + 1]; i += 2; } else if (inf === 26) { n = ((b[i] << 24) | (b[i + 1] << 16) | (b[i + 2] << 8) | b[i + 3]) >>> 0; i += 4; }
      if (maj === 0) return n; if (maj === 1) return -1 - n;
      if (maj === 2) { var v = b.slice(i, i + n); i += n; return v; }
      if (maj === 3) { var s = new TextDecoder().decode(b.slice(i, i + n)); i += n; return s; }
      if (maj === 4) { var a = []; for (var k = 0; k < n; k++) a.push(lire()); return a; }
      if (maj === 5) { var m = {}; for (var q = 0; q < n; q++) { var c = lire(); m[c] = lire(); } return m; }
      return null;
    }
    return lire();
  }

  window.addEventListener('message', function (e) {
    if (!APP.test(e.origin) || !e.data || (typeof e.data.adya !== 'string' && !(COMPAT && typeof e.data[COMPAT] === 'string'))) return;
    app = e.source; origineApp = e.origin;
    clearTimeout(minuteur); clearTimeout(lent); $('attente-etat').textContent = ''; $('attente').className = ''; $('attente-reessayer').hidden = true;
    var m = e.data;
    if (typeof m.adya !== 'string') { m = JSON.parse(JSON.stringify(m)); m.adya = m[COMPAT]; }
    if (m.adya === 'bonjour') annoncer();
    else if (m.adya === 'connexion') { defi = m.defi; $('fid-connexion').hidden = !(webauthn && lsGet('faceid') === '1' && defi); }
    else if (m.adya === 'connecte') { defi = null; $('fid-connexion').hidden = true; }
    else if (m.adya === 'enrolement') { enrol = m; $('fid-voile').hidden = false; $('fid-activer').hidden = false; $('fid-oui').focus(); }
    else if (m.adya === 'faceid-ok') { lsSet('faceid', '1'); if (cleEnCours) lsSet('cle', cleEnCours); cleEnCours = null; annoncer(); }
    else if (m.adya === 'faceid-oublie') { lsSet('faceid', null); lsSet('cle', null); annoncer(); }
    else if (m.adya === 'session') { lsSet('jeton', typeof m.jeton === 'string' && m.jeton ? m.jeton : null); if (!m.jeton) lsSet('etat', null); diag('connexion ' + (m.jeton ? 'reçue' : 'effacée') + ' · relue : ' + (lsGet('jeton') ? 'oui' : 'non')); }
    else if (m.adya === 'etat') { if (m.g && m.g.j && m.g.j === lsGet('jeton')) { try { localStorage.setItem('adya.' + GROUPE + '.etat', JSON.stringify(m.g)); } catch (e) { diag('situation trop lourde pour être gardée'); } } }
    else if (m.adya === 'diag') { diag(String(m.t || '').slice(0, 120)); }
    else if (m.adya === 'signature' && typeof m.defi === 'string') signerOuvrir(m);
    else if (m.adya === 'micro' && MICRO && typeof m.z === 'string') micOuvrir('note', m.z.slice(0, 60), m.max);
    else if (m.adya === 'dictee' && Reco) micOuvrir('dictee', null, 600);
  });
  // L'application a peut-être dit bonjour avant que cette page écoute : on se présente à tous les cadres
  // (le cadre de l'application est deux niveaux sous cette page) dès que le cadre principal est chargé.
  function saluer(w, n) { try { for (var k = 0; k < w.frames.length; k++) { var p = { adya: 'porte-prete' }; if (COMPAT) p[COMPAT] = 'porte-prete'; w.frames[k].postMessage(p, '*'); if (n < 3) saluer(w.frames[k], n + 1); } } catch (e) {} }
  $('app').addEventListener('load', function () { setTimeout(function () { saluer($('app').contentWindow, 0); }, 400); setTimeout(function () { if (!app) saluer($('app').contentWindow, 0); }, 2500); });

  /* Surveillance de l'ouverture : sur le réseau mobile, une connexion à Google reste parfois bloquée.
     Si l'application ne s'est pas annoncée à temps, la page la recharge (deux fois), puis propose « Réessayer ». */
  var SRC = $('app').getAttribute('data-src'), essai = 1, minuteur = null, lent = null;
  // Toujours la version la plus récente : une adresse unique à chaque ouverture, pour que le téléphone ne resserve jamais une ancienne copie.
  $('app').setAttribute('src', SRC + (SRC.indexOf('?') < 0 ? '?' : '&') + 'ouverture=' + Date.now());
  function surveiller() {
    clearTimeout(minuteur); clearTimeout(lent);
    lent = setTimeout(function () { if (!app) $('attente-etat').textContent = 'Connexion lente, merci de patienter…'; }, 6000);
    minuteur = setTimeout(function () {
      if (app) return;
      if (essai < 3) { essai++; $('attente-etat').textContent = 'Nouvel essai de connexion (' + essai + ' sur 3)…'; recharger(); }
      else { $('attente').className = 'panne'; $('attente-etat').textContent = 'L’application ne répond pas. Vérifiez votre connexion (Wi-Fi ou données mobiles), puis réessayez.'; $('attente-reessayer').hidden = false; }
    }, essai === 1 ? 15000 : 20000);
  }
  function recharger() { $('app').setAttribute('src', SRC + (SRC.indexOf('?') < 0 ? '?' : '&') + 'essai=' + essai + '-' + Date.now()); surveiller(); }
  $('attente-reessayer').addEventListener('click', function () { essai = 1; $('attente').className = ''; $('attente-reessayer').hidden = true; $('attente-etat').textContent = 'Nouvel essai de connexion…'; recharger(); });
  surveiller();

  /* Connexion : demandée au toucher (obligatoire pour Face ID) avec le défi préparé par le serveur. */
  $('fid-go').addEventListener('click', function () {
    if (!defi) return;
    var d = defi; defi = null; $('fid-connexion').hidden = true;
    var cle = lsGet('cle'), opts = { challenge: deB64u(d), rpId: RP, userVerification: 'required', timeout: 60000 };
    if (cle) opts.allowCredentials = [{ type: 'public-key', id: deB64u(cle) }];   // seulement la clé de ce groupe
    navigator.credentials.get({ publicKey: opts })
      .then(function (c) {
        envoyer({ adya: 'faceid-assertion', id: b64u(c.rawId), clientDataJSON: b64u(c.response.clientDataJSON), authenticatorData: b64u(c.response.authenticatorData), signature: b64u(c.response.signature) });
      })
      .catch(function (e) { envoyer({ adya: 'faceid-erreur', message: erreur(e) }); });
  });

  /* Signature d'une fiche : Face ID confirme que c'est bien le membre qui signe (au toucher, comme pour la connexion). */
  var aSigner = null;
  function signerOuvrir(m) {
    aSigner = m.defi;
    $('fsg-texte').textContent = (String(m.titre || 'Votre fiche').slice(0, 80)) + ' : ' + LIB + ' confirme que c’est bien vous qui signez.';
    $('fsg-oui-txt').textContent = 'Signer avec ' + LIB;
    $('fid-voile').hidden = false; $('fid-signer').hidden = false; $('fsg-oui').focus();
  }
  function signerFermer() { $('fid-voile').hidden = true; $('fid-signer').hidden = true; aSigner = null; }
  $('fsg-non').addEventListener('click', function () { signerFermer(); envoyer({ adya: 'faceid-erreur', message: 'Signature annulée.', but: 'signature' }); });
  $('fsg-oui').addEventListener('click', function () {
    var d = aSigner; signerFermer(); if (!d) return;
    var cle = lsGet('cle'), opts = { challenge: deB64u(d), rpId: RP, userVerification: 'required', timeout: 60000 };
    if (cle) opts.allowCredentials = [{ type: 'public-key', id: deB64u(cle) }];
    navigator.credentials.get({ publicKey: opts })
      .then(function (c) {
        envoyer({ adya: 'faceid-signature', id: b64u(c.rawId), clientDataJSON: b64u(c.response.clientDataJSON), authenticatorData: b64u(c.response.authenticatorData), signature: b64u(c.response.signature) });
      })
      .catch(function (e) { var n = e && e.name; envoyer({ adya: 'faceid-erreur', message: n === 'NotAllowedError' || n === 'AbortError' ? LIB + ' annulé : vous pouvez aussi signer avec votre code.' : erreur(e), but: 'signature' }); });
  });

  /* Activation sur cet appareil (depuis Mon espace) : création de la clé, protégée par Face ID. */
  function fermer() { $('fid-voile').hidden = true; $('fid-activer').hidden = true; }
  $('fid-non').addEventListener('click', function () { fermer(); enrol = null; });
  $('fid-oui').addEventListener('click', function () {
    var m = enrol; enrol = null; fermer(); if (!m) return;
    navigator.credentials.create({ publicKey: {
      challenge: deB64u(m.defi), rp: { id: RP, name: 'Adya – Famille Exemple' },
      user: { id: new TextEncoder().encode(GROUPE + ':' + m.user.id), name: m.user.nom, displayName: m.user.nom },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', residentKey: 'required', userVerification: 'required' },
      attestation: 'none', timeout: 60000 } })
      .then(function (c) {
        var alg = c.response.getPublicKeyAlgorithm ? c.response.getPublicKeyAlgorithm() : -7, k = clePublique(c.response);
        var appareil = ios ? (/iPad/.test(ua) ? 'iPad' : 'iPhone') : /Android/i.test(ua) ? 'Android' : /Mac/.test(navigator.platform) ? 'Mac' : /Windows/i.test(ua) ? 'PC Windows' : 'Appareil';
        cleEnCours = b64u(c.rawId);
        envoyer({ adya: 'faceid-cree', id: cleEnCours, x: k.x, y: k.y, alg: alg, clientDataJSON: b64u(c.response.clientDataJSON), appareil: appareil });
      })
      .catch(function (e) { envoyer({ adya: 'faceid-erreur', message: erreur(e) }); });
  });
})();
</script>
</body>
